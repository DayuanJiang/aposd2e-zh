<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 432" role="img" aria-labelledby="ch08-semantic-boundary-t ch08-semantic-boundary-d">
  <title id="ch08-semantic-boundary-t">下沉文字機制，不下沉按鍵含義</title><desc id="ch08-semantic-boundary-d">介面解釋退格事件和游標選區，傳入待刪除範圍；文字類只負責範圍編輯及內部行處理。把退格策略直接移入文字類會洩露介面知識。</desc>
  <defs><marker id="ch08-semantic-boundary-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--diagram-muted,#58636b)" /></marker></defs>
  <rect width="680" height="432" fill="var(--diagram-bg,#f5f7f8)" />
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" fill="var(--diagram-ink,#263239)">
    <text x="24" y="34" font-size="21" font-weight="600">下沉文字機制，不下沉按鍵含義</text>
    <text x="24" y="64" fill="var(--diagram-muted,#58636b)">教學分解：區分“要刪哪裡”與“怎樣修改文字”</text>
    <text x="24" y="108" font-weight="600">使用者介面的知識</text><text x="407" y="108" font-weight="600">文字類的知識</text>
    <rect x="24" y="128" width="224" height="86" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <text x="42" y="157">退格事件、游標、選區</text><text x="42" y="188">按介面策略確定刪除範圍</text>
    <rect x="407" y="128" width="249" height="86" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="427" y="157">執行範圍刪除</text><text x="427" y="188">內部按需拆分 / 合併行</text>
    <path d="M248 171H399" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch08-semantic-boundary-a)" />
    <text x="271" y="152" font-weight="600">文字範圍</text>
    <path d="M350 96V337" stroke="var(--diagram-line,#aebbad)" stroke-dasharray="5 4" />
    <text x="272" y="239" font-size="13" fill="var(--diagram-muted,#58636b)">模組邊界</text>
    <path d="M137 215V281H399" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-dasharray="5 4" />
    <path d="M326 267L344 295M344 267L326 295" stroke="var(--diagram-danger,#a03946)" stroke-width="3" />
    <text x="24" y="320" fill="var(--diagram-danger,#a03946)">不應只為“下沉”而移動退格策略</text>
    <text x="408" y="279">若文字類必須理解按鍵，</text><text x="408" y="305">介面知識就越過了邊界。</text>
    <path d="M24 350H656" stroke="var(--diagram-line,#aebbad)" />
    <text x="24" y="379">判斷：與核心功能相關，並讓其他程式碼及介面更簡單。</text>
    <text x="24" y="409" font-size="13" fill="var(--diagram-muted,#58636b)">不規定具體退格規則；不主張將所有應用功能集中進一個類。</text>
  </g>
</svg>
