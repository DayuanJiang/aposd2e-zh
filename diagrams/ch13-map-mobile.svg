<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 656" role="img" aria-labelledby="ch13m-title ch13m-desc">
  <title id="ch13m-title">注释应该描述什么信息？</title>
  <desc id="ch13m-desc">本章概览。注释应该描述什么信息？ 本章的主要部分：更低层级：提高精确度：补上声明没说的细节：单位是像素还是字符、范围是否包含边界、空值代表什么、谁负责释放资源；与代码同一层级：重复代码：读者从旁边代码就能看出的信息，例如“添加水平滚动条”，或者只是重复方法名里的词；更高层级：增强直觉：省略细节，说明这段代码要做什么、为什么需要它，例如“把当前键哈希追加到一个尚未发送的 RPC”。一句话：描述从代码中不易看出的信息：要么比代码更详细以求精确，要么比代码更抽象以帮助理解</desc>
  <rect width="420" height="656" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch13m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">注释应该描述什么信息？</text>
    <text x="22.0" y="80.0" font-size="13" fill="var(--diagram-muted,#5c645d)">注释靠提供与代码不同详细程度的信息来补充代码；和代码处在</text>
    <text x="22.0" y="100.0" font-size="13" fill="var(--diagram-muted,#5c645d)">同一详细程度的注释，多半在重复代码</text>
    <text x="22.0" y="132.0" font-size="16" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">从上到下</text>
    <rect x="22.0" y="148.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <circle cx="50.0" cy="174.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,166.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></g>
    <text x="74.0" y="179.0" font-size="18" font-weight="600">更高层级：增强直觉</text>
    <text x="74.0" y="204.0" font-size="15" fill="var(--diagram-muted,#5c645d)">省略细节，说明这段代码要做什么、为什么需</text>
    <text x="74.0" y="226.0" font-size="15" fill="var(--diagram-muted,#5c645d)">要它，例如“把当前键哈希追加到一个尚未发</text>
    <text x="74.0" y="248.0" font-size="15" fill="var(--diagram-muted,#5c645d)">送的 RPC”</text>
    <rect x="22.0" y="268.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-danger-soft,#ead9dc)"/>
    <circle cx="50.0" cy="294.0" r="14" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" stroke-width="2"/><g transform="translate(42.0,286.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></g>
    <text x="74.0" y="299.0" font-size="18" font-weight="600">与代码同一层级：重复代码</text>
    <text x="74.0" y="324.0" font-size="15" fill="var(--diagram-muted,#5c645d)">读者从旁边代码就能看出的信息，例如“添加</text>
    <text x="74.0" y="346.0" font-size="15" fill="var(--diagram-muted,#5c645d)">水平滚动条”，或者只是重复方法名里的词</text>
    <rect x="22.0" y="366.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <circle cx="50.0" cy="392.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,384.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></g>
    <text x="74.0" y="397.0" font-size="18" font-weight="600">更低层级：提高精确度</text>
    <text x="74.0" y="422.0" font-size="15" fill="var(--diagram-muted,#5c645d)">补上声明没说的细节：单位是像素还是字符、</text>
    <text x="74.0" y="444.0" font-size="15" fill="var(--diagram-muted,#5c645d)">范围是否包含边界、空值代表什么、谁负责释</text>
    <text x="74.0" y="466.0" font-size="15" fill="var(--diagram-muted,#5c645d)">放资源</text>
    <text x="22.0" y="498.0" font-size="13" fill="var(--diagram-muted,#5c645d)">接口注释描述抽象，与实现注释分开；跨模块决策放在开发人员</text>
    <text x="22.0" y="518.0" font-size="13" fill="var(--diagram-muted,#5c645d)">自然会看到的位置，例如状态枚举旁或 designNotes 文件</text>
    <rect x="22.0" y="544.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="36.0" y="565.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="36.0" y="591.0" font-size="17" font-weight="600">描述从代码中不易看出的信息：要么比代码更</text>
    <text x="36.0" y="617.0" font-size="17" font-weight="600">详细以求精确，要么比代码更抽象以帮助理解</text>
  </g>
</svg>
