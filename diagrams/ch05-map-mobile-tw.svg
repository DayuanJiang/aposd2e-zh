<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 459" role="img" aria-labelledby="ch05m-title ch05m-desc">
  <title id="ch05m-title">模組裡該藏什麼，洩露了怎麼看出來？</title>
  <desc id="ch05m-desc">本章概覽。模組裡該藏什麼，洩露了怎麼看出來？ 本章的主要部分：資訊洩露：同一知識在多個模組，改一處得改多處；資訊隱藏：設計決策只放在一個模組的實作裡。一句話：每個模組封裝一些設計決策，不讓別的模組看到；同一項知識出現在多處，就是洩露</desc>
  <rect width="420" height="459" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch05m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">模組裡該藏什麼，洩露了怎麼看出</text>
    <text x="22.0" y="75.0" font-size="23" font-weight="600">來？</text>
    <rect x="22.0" y="99.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-danger-soft,#ead9dc)" />
    <circle cx="50.0" cy="125.0" r="14" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" stroke-width="2" /><g transform="translate(42.0,117.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></g>
    <text x="74.0" y="130.0" font-size="18" font-weight="600">資訊洩露：同一知識散在多處</text>
    <text x="74.0" y="155.0" font-size="15" fill="var(--diagram-muted,#5c645d)">讀、寫兩個類都懂同一檔案格式；按先後順</text>
    <text x="74.0" y="177.0" font-size="15" fill="var(--diagram-muted,#5c645d)">序拆類，都得懂同一結構；內部怎麼存資料，</text>
    <text x="74.0" y="199.0" font-size="15" fill="var(--diagram-muted,#5c645d)">原樣交給呼叫者</text>
    <rect x="22.0" y="219.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="245.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,237.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>
    <text x="74.0" y="250.0" font-size="18" font-weight="600">資訊隱藏：知識只在一處</text>
    <text x="74.0" y="275.0" font-size="15" fill="var(--diagram-muted,#5c645d)">檔案格式的知識只放在一個類裡；合併成一</text>
    <text x="74.0" y="297.0" font-size="15" fill="var(--diagram-muted,#5c645d)">個類，呼叫一個方法就夠；按名字取值，內</text>
    <text x="74.0" y="319.0" font-size="15" fill="var(--diagram-muted,#5c645d)">部怎麼存不用管</text>
    <rect x="22.0" y="347.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="36.0" y="368.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="36.0" y="394.0" font-size="17" font-weight="600">每個模組封裝一些設計決策，不讓別的模組</text>
    <text x="36.0" y="420.0" font-size="17" font-weight="600">看到；同一項知識出現在多處，就是洩露</text>
  </g>
</svg>
