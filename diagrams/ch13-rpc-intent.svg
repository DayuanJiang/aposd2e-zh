<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 655" role="img" aria-labelledby="ch13-rpc-intent-t ch13-rpc-intent-d">
  <title id="ch13-rpc-intent-t">从追加意图读懂判断，但不越过未知条件</title><desc id="ch13-rpc-intent-d">rpc是当前readRpc[i]的教学缩写。会话相等很可能是在确认目标服务器；LOADING暗示状态约束；哈希数小于上限暗示容量限制。这三项满足后，仍必须满足rpc.maxPos小于assignPos才能选中候选供追加，高层注释没有解释这一条件的理由。图是逻辑条件组合，不是实际判断或循环顺序。</desc>
  <defs><marker id="ch13-rpc-intent-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--diagram-muted,#58636b)"/></marker></defs>
  <rect width="680" height="655" fill="var(--diagram-bg,#f5f7f8)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" fill="var(--diagram-ink,#263239)">
    <text x="24" y="34" font-size="21" font-weight="600">从追加意图读懂判断，但不越过未知条件</text>
    <text x="24" y="68">意图：尝试追加到发往目标服务器、尚未发出的既有 RPC。</text>
    <text x="24" y="94" font-size="13" fill="var(--diagram-muted,#58636b)">rpc 指当前 readRpc[i]，仅为教学缩写；右侧保留作者“很可能 / 暗示”的推断语气。</text>
    <text x="24" y="127" font-weight="600">源码判断（使用上述缩写）</text><text x="454" y="127" font-weight="600">由意图推断其作用</text>
    <g fill="var(--diagram-secondary-soft,#dce4ed)"><rect x="24" y="144" width="400" height="64" rx="4"/><rect x="24" y="232" width="400" height="64" rx="4"/><rect x="24" y="320" width="400" height="78" rx="4"/></g>
    <g font-family="monospace" font-size="14"><text x="42" y="180">session == rpc.session</text><text x="42" y="268">rpc.status == LOADING</text><text x="42" y="350">rpc.numHashes</text><text x="42" y="378">&lt; MAX_PKHASHES_PERRPC</text></g>
    <g stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch13-rpc-intent-a)"><path d="M425 176H444"/><path d="M425 264H444"/><path d="M425 359H444"/></g>
    <g font-size="14"><text x="454" y="170">很可能在确认</text><text x="454" y="194">是否发往正确服务器</text><text x="454" y="258">暗示状态约束，</text><text x="454" y="282">呼应“尚未发出”的意图</text><text x="454" y="347">暗示容量有上限，</text><text x="454" y="375">不填写原文未给出的数值</text></g>
    <rect x="24" y="435" width="173" height="48" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)"/><text x="49" y="465">前三项均满足</text>
    <path d="M198 459H229" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch13-rpc-intent-a)"/>
    <path d="M365 408 493 459 365 510 237 459Z" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)"/>
    <text x="282" y="464" font-family="monospace" font-size="13">rpc.maxPos &lt; assignPos</text>
    <path d="M494 459H535" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch13-rpc-intent-a)"/><text x="501" y="440" font-size="13">满足</text>
    <rect x="543" y="431" width="113" height="58" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)"/><text x="556" y="455" font-size="13">选中此 RPC</text><text x="556" y="480" font-size="13">供后续追加</text>
    <path d="M365 511V560H209" fill="none" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch13-rpc-intent-a)"/><text x="375" y="581" font-size="13">不满足</text>
    <rect x="24" y="540" width="178" height="42" rx="4" fill="var(--diagram-danger-soft,#ead9dc)"/><text x="54" y="568">此候选不选中</text>
    <text x="433" y="533" font-size="14">为什么要检查 maxPos？</text><text x="433" y="555" font-size="14">高层注释没有解释。</text>
    <path d="M24 602H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="627" font-size="13" fill="var(--diagram-muted,#58636b)">所有条件均须满足；图是逻辑组合，不规定短路判断或循环顺序，也不展示完整算法。</text>
    <text x="24" y="647" font-size="13" fill="var(--diagram-muted,#58636b)">选中候选供后续追加，不把前三项满足误画成已经完成追加。</text>
  </g>
</svg>
