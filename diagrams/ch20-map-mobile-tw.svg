    <rect x="22.0" y="372.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="398.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,390.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2v2" /><path d="M5 2v2" /><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1" /><path d="M8 15a6 6 0 0 0 12 0v-3" /><circle cx="20" cy="10" r="2" /></g>
    <text x="74.0" y="403.0" font-size="18" font-weight="600">整潔又快的新程式碼</text>
    <text x="74.0" y="428.0" font-size="15" fill="var(--diagram-muted,#5c645d)">新 Buffer 程式碼：一個方法，一次檢查，快一</text>
    <text x="74.0" y="450.0" font-size="15" fill="var(--diagram-muted,#5c645d)">倍，程式碼少兩成</text>
    <rect x="22.0" y="470.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="496.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,488.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2v2" /><path d="M5 2v2" /><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1" /><path d="M8 15a6 6 0 0 0 12 0v-3" /><circle cx="20" cy="10" r="2" /></g>
    <text x="74.0" y="501.0" font-size="18" font-weight="600">先測量</text>
    <text x="74.0" y="526.0" font-size="15" fill="var(--diagram-muted,#5c645d)">找出耗時的少數位置</text>
    <rect x="22.0" y="546.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="572.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,564.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3" /><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" /><circle cx="18" cy="5" r="3" /></g>
    <text x="74.0" y="577.0" font-size="18" font-weight="600">關鍵路徑</text>
    <text x="74.0" y="602.0" font-size="15" fill="var(--diagram-muted,#5c645d)">常見情況的最少程式碼</text>
    <rect x="22.0" y="630.0" width="376.0" height="116.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="36.0" y="651.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="36.0" y="677.0" font-size="17" font-weight="600">可以兼得：平時選自然高效的簡單設計；確實</text>
    <text x="36.0" y="703.0" font-size="17" font-weight="600">太慢時先測量，再圍繞關鍵路徑重新設計，讓</text>
    <text x="36.0" y="729.0" font-size="17" font-weight="600">它儘可能簡單</text>
  </g>
