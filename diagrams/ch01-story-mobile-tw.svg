<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 947" role="img" aria-labelledby="ch01-storym-title ch01-storym-desc">
  <title id="ch01-storym-title">寫軟體不受物理定律約束，真正的限制是我們能理解多複雜的系統</title>
  <desc id="ch01-storym-desc">本章回顧。寫軟體不受物理定律約束，真正的限制是我們能理解多複雜的系統。起點：寫軟體幾乎不受現實條件約束。寫軟體不像造橋，不受物理定律限制，腦中構想出的系統很可能就能實作。於是最大的限制變成了我們理解自己所造系統的能力。；問題：複雜性日積月累，拖慢開發、帶來缺陷。程式不斷演進、功能不斷增加，元件之間產生微妙的依賴。複雜性減慢開發速度並導致缺陷，缺陷又進一步拖慢開發。好工具有幫助，但僅靠工具終究有限。；轉折：兩條路：消除複雜性，或封裝複雜性。第一條路是消除複雜性，例如消除特殊情況、一致地使用識別符號。第二條路是模組化設計：把系統分成相對獨立的模組，開發一個模組時不必同時面對全部複雜性。；做法：增量開發意味著持續重新設計。瀑布式把設計集中在開始，問題要到實作推進很久後才顯現，只能修修補補。增量開發在系統還小時就修正設計問題，所以要始終考慮設計，並在計劃裡為改進留出時間。。這一章最想強調的：降低複雜性是軟體設計最重要的要素，開發人員應始終考慮複雜性 這些原則用來比較備選方案，每條都有例外，用過頭會適得其反，要把握分寸</desc>
