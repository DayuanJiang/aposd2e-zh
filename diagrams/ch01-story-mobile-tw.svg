    <circle cx="40.0" cy="461.0" r="18" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(31.0,452.0) scale(0.750)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z" /><path d="m7 16.5-4.74-2.85" /><path d="m7 16.5 5-3" /><path d="M7 16.5v5.17" /><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z" /><path d="m17 16.5-5-3" /><path d="m17 16.5 4.74-2.85" /><path d="M17 16.5v5.17" /><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z" /><path d="M12 8 7.26 5.15" /><path d="m12 8 4.74-2.85" /><path d="M12 13.5V8" /></g>
    <text x="76.0" y="449.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">轉折</text>
    <text x="76.0" y="473.0" font-size="18" font-weight="600">兩條路：消除複雜性，或封裝複雜性</text>
    <text x="76.0" y="499.0" font-size="15">第一條路是消除複雜性，例如消除特殊情況、一</text>
    <text x="76.0" y="522.0" font-size="15">致地使用識別符號。第二條路是模組化設計：把系</text>
    <text x="76.0" y="545.0" font-size="15">統分成相對獨立的模組，開發一個模組時不必同</text>
    <text x="76.0" y="568.0" font-size="15">時面對全部複雜性。</text>
    <circle cx="40.0" cy="630.0" r="18" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(31.0,621.0) scale(0.750)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></g>
    <text x="76.0" y="618.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">做法</text>
    <text x="76.0" y="642.0" font-size="18" font-weight="600">增量開發意味著持續重新設計</text>
    <text x="76.0" y="668.0" font-size="15">瀑布式把設計集中在開始，問題要到實作推進很</text>
    <text x="76.0" y="691.0" font-size="15">久後才顯現，只能修修補補。增量開發在系統還</text>
    <text x="76.0" y="714.0" font-size="15">小時就修正設計問題，所以要始終考慮設計，並</text>
    <text x="76.0" y="737.0" font-size="15">在計劃裡為改進留出時間。</text>
