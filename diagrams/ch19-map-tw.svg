    <text x="50.0" y="475.0" font-size="21" font-weight="600">介面繼承、單元測試有幫助；實作繼承、敏捷、設計模式有風險；不熱衷測試驅動開發，</text>
    <text x="50.0" y="505.0" font-size="21" font-weight="600">Getter 和 Setter 儘量避免</text>
