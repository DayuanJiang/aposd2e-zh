<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 558" role="img" aria-labelledby="ch08-semantic-boundary-m-t ch08-semantic-boundary-m-d">
  <title id="ch08-semantic-boundary-m-t">下沉文本机制，不下沉按键含义</title><desc id="ch08-semantic-boundary-m-d">界面在上，文本类在下，跨边界的正常箭头只携带文本范围；旁路直接携带退格策略，被标为信息泄露。</desc>
  <defs><marker id="ch08-semantic-boundary-m-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--diagram-muted,#58636b)"/></marker></defs>
  <rect width="360" height="558" fill="var(--diagram-bg,#f5f7f8)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" fill="var(--diagram-ink,#263239)">
    <text x="20" y="32" font-size="18" font-weight="600">下沉文本机制，</text><text x="20" y="58" font-size="18" font-weight="600">不下沉按键含义</text>
    <text x="20" y="100" font-weight="600">用户界面</text>
    <rect x="20" y="118" width="272" height="80" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <text x="38" y="147">退格事件、光标、选区</text><text x="38" y="177">按界面策略确定删除范围</text>
    <path d="M156 199V289" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch08-semantic-boundary-m-a)"/>
    <text x="178" y="231" font-weight="600">文本范围</text>
    <path d="M20 255H340" stroke="var(--diagram-line,#aebbad)" stroke-dasharray="5 4"/>
    <text x="20" y="247" font-size="13" fill="var(--diagram-muted,#58636b)">模块边界</text>
    <rect x="20" y="296" width="272" height="86" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="38" y="325">文本类：执行范围删除</text><text x="38" y="356">内部按需拆分 / 合并行</text>
    <path d="M293 158H321V338H298" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M310 241L332 268M332 241L310 268" stroke="var(--diagram-danger,#a03946)" stroke-width="3"/>
    <text x="20" y="416" fill="var(--diagram-danger,#a03946)">旁路：把退格策略直接放进文本类</text>
    <text x="20" y="443">会让界面知识越过边界。</text>
    <path d="M20 462H340" stroke="var(--diagram-line,#aebbad)"/>
    <text x="20" y="488" font-size="14">下沉内容须与核心功能相关，</text><text x="20" y="512" font-size="14">并简化其他代码和接口。</text>
    <text x="20" y="540" font-size="13" fill="var(--diagram-muted,#58636b)">教学分解，不规定具体退格规则。</text>
  </g>
</svg>
