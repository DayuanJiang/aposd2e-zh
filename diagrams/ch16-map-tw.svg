<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="ch16-title ch16-desc">
  <title id="ch16-title">修改現有程式碼時，怎樣不讓複雜性積累？</title>
  <desc id="ch16-desc">本章概覽。修改現有程式碼時，怎樣不讓複雜性積累？ 本章的主要部分：重新審視設計：面對這次變更，現有設計是否仍然最佳？；需要就重構：讓結構如同一開始就考慮了這次變更；同步更新註解：放在程式碼附近，每個決策儘量只記錄一次；提交前檢查：看一遍全部變更，確認註解準確反映改動。一句話：每次修改都保持戰略式思考：理想情況下，系統結構應如同一開始就考慮了這次變更，並更新註解</desc>
  <rect width="960" height="700" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch16-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">修改現有程式碼時，怎樣不讓複雜性積累？</text>
    <path d="M514.3 227.1 L753.8 304.3" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch16-arrow)" />
    <path d="M755.7 327.1 L516.2 404.3" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch16-arrow)" />
    <path d="M445.7 404.9 L206.2 327.7" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch16-arrow)" />
    <path d="M204.3 304.9 L443.8 227.7" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch16-arrow)" />
    <circle cx="480.0" cy="216.0" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(466.0,202.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z" /><circle cx="12" cy="12" r="10" /></g>
    <text x="480.0" y="154.0" font-size="18" font-weight="600" text-anchor="middle">重新審視設計</text>
    <text x="480.0" y="176.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">面對這次變更，現有設計是否仍然最佳？</text>
    <circle cx="790.0" cy="316.0" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(776.0,302.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" /></g>
    <text x="790.0" y="370.0" font-size="18" font-weight="600" text-anchor="middle">需要就重構</text>
    <text x="790.0" y="392.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">讓結構如同一開始就考慮了這次變</text>
    <text x="790.0" y="412.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">更</text>
    <circle cx="480.0" cy="416.0" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(466.0,402.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9" /><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z" /></g>
    <text x="480.0" y="470.0" font-size="18" font-weight="600" text-anchor="middle">同步更新註解</text>
    <text x="480.0" y="492.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">放在程式碼附近，每個決策儘量只記錄一次</text>
    <circle cx="170.0" cy="316.0" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(156.0,302.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" /></g>
    <text x="170.0" y="370.0" font-size="18" font-weight="600" text-anchor="middle">提交前檢查</text>
    <text x="170.0" y="392.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">看一遍全部變更，確認註解準確反</text>
    <text x="170.0" y="412.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">映改動</text>
    <rect x="32.0" y="574.0" width="896.0" height="98.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="50.0" y="595.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="50.0" y="625.0" font-size="21" font-weight="600">每次修改都保持戰略式思考：理想情況下，系統結構應如同一開始就考慮了這次變更，並</text>
    <text x="50.0" y="655.0" font-size="21" font-weight="600">更新註解</text>
  </g>
</svg>
