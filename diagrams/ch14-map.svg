<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 482" role="img" aria-labelledby="ch14-title ch14-desc">
  <title id="ch14-title">怎样为变量和方法选一个好名称？</title>
  <desc id="ch14-desc">本章概览。怎样为变量和方法选一个好名称？ 本章的主要部分：精确：block 一词指两种块，引出追查六个月的缺陷；一致：同一用途始终用同一名称，不作他用；去掉多余的词：每个词都要提供信息，fileObject 里的 Object 就多余。一句话：读者第一次遇到就能正确猜出它指什么：精确、一致、没有多余的词；起名困难则是设计的危险信号</desc>
  <rect width="960" height="482" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch14-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">怎样为变量和方法选一个好名称？</text>
    <rect x="32.0" y="84.0" width="896.0" height="70.0" rx="12" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <g transform="translate(52.0,105.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>
    <text x="94.0" y="114.0" font-size="20" font-weight="600">目标：读者只看名称，就能对所指事物形成清晰印象</text>
    <text x="94.0" y="138.0" font-size="15" fill="var(--diagram-muted,#5c645d)">名称本身就是一种文档</text>
    <rect x="32.0" y="172.0" width="286.7" height="162.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <rect x="46.0" y="260" width="258.7" height="1" fill="var(--diagram-line,#aebbad)"/>
    <g transform="translate(46.0,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></g>
    <text x="46.0" y="248.0" font-size="18" font-weight="600">精确</text>
    <text x="46.0" y="282.0" font-size="15" fill="var(--diagram-muted,#5c645d)">block 一词指两种块，引出追查六个</text>
    <text x="46.0" y="304.0" font-size="15" fill="var(--diagram-muted,#5c645d)">月的缺陷</text>
    <rect x="336.7" y="172.0" width="286.7" height="162.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <rect x="350.7" y="260" width="258.7" height="1" fill="var(--diagram-line,#aebbad)"/>
    <g transform="translate(350.7,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></g>
    <text x="350.7" y="248.0" font-size="18" font-weight="600">一致</text>
    <text x="350.7" y="282.0" font-size="15" fill="var(--diagram-muted,#5c645d)">同一用途始终用同一名称，不作他用</text>
    <rect x="641.3" y="172.0" width="286.7" height="162.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <rect x="655.3" y="260" width="258.7" height="1" fill="var(--diagram-line,#aebbad)"/>
    <g transform="translate(655.3,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></g>
    <text x="655.3" y="248.0" font-size="18" font-weight="600">去掉多余的词</text>
    <text x="655.3" y="282.0" font-size="15" fill="var(--diagram-muted,#5c645d)">每个词都要提供信息，fileObject</text>
    <text x="655.3" y="304.0" font-size="15" fill="var(--diagram-muted,#5c645d)">里的 Object 就多余</text>
    <rect x="32.0" y="356.0" width="896.0" height="98.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="50.0" y="377.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="50.0" y="407.0" font-size="21" font-weight="600">读者第一次遇到就能正确猜出它指什么：精确、一致、没有多余的词；起名困难则是设计</text>
    <text x="50.0" y="437.0" font-size="21" font-weight="600">的危险信号</text>
  </g>
</svg>
