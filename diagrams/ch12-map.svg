<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 394" role="img" aria-labelledby="ch12-title ch12-desc">
  <title id="ch12-title">不写注释的四个借口，站得住吗？</title>
  <desc id="ch12-desc">本章概览。不写注释的四个借口，站得住吗？ 本章的主要部分：四个借口：代码自解释、没时间、会过时、没用；作者的回应：逐条回应，都站不住。一句话：四个借口都站不住：注释记录设计者知道、却无法用代码表达的信息</desc>
  <rect width="960" height="394" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch12-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">不写注释的四个借口，站得住吗？</text>
    <rect x="32.0" y="84.0" width="418.0" height="192.0" rx="12" fill="var(--diagram-danger-soft,#ead9dc)"/>
    <g transform="translate(52.0,102.0) scale(1.083)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></g>
    <text x="88.0" y="122.0" font-size="20" font-weight="600">四个借口</text>
    <g transform="translate(52.0,146.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
    <text x="76.0" y="159.0" font-size="15">好的代码是自解释的</text>
    <g transform="translate(52.0,176.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
    <text x="76.0" y="189.0" font-size="15">我没有时间写注释</text>
    <g transform="translate(52.0,206.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
    <text x="76.0" y="219.0" font-size="15">注释很容易过时</text>
    <g transform="translate(52.0,236.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
    <text x="76.0" y="249.0" font-size="15">见过的注释都毫无价值</text>
    <rect x="510.0" y="84.0" width="418.0" height="192.0" rx="12" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <g transform="translate(530.0,102.0) scale(1.083)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></g>
    <text x="566.0" y="122.0" font-size="20" font-weight="600">作者的回应</text>
    <g transform="translate(530.0,146.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
    <text x="554.0" y="159.0" font-size="15">接口含义只能靠注释说明</text>
    <g transform="translate(530.0,176.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
    <text x="554.0" y="189.0" font-size="15">最多多花约 10% 的开发时间</text>
    <g transform="translate(530.0,206.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
    <text x="554.0" y="219.0" font-size="15">放在代码附近就容易更新</text>
    <g transform="translate(530.0,236.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
    <text x="554.0" y="249.0" font-size="15">有用的注释怎么写，可以学</text>
    <path d="M462.0 180.0 L498.0 180.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch12-arrow)"/>
    <text x="480.0" y="166.0" font-size="13" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">回应</text>
    <rect x="32.0" y="298.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="50.0" y="319.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="50.0" y="349.0" font-size="21" font-weight="600">四个借口都站不住：注释记录设计者知道、却无法用代码表达的信息</text>
  </g>
</svg>
