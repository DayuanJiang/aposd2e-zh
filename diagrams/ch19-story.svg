<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 842" role="img" aria-labelledby="ch19-story-title ch19-story-desc">
  <title id="ch19-story-title">从继承到 Getter：流行趋势是否真的降低复杂性</title>
  <desc id="ch19-story-desc">本章回顾。从继承到 Getter：流行趋势是否真的降低复杂性。起点：每种趋势只问一个问题：它有助于降低复杂性吗？。面向对象、敏捷、单元测试、测试驱动开发、设计模式、Getter 和 Setter，作者逐一用本书的原则评估。许多提案表面上听起来不错，深入研究后有些反而增加复杂性。；继承：接口继承降低复杂性，实现继承要谨慎。同一个 I/O 接口既能读写磁盘文件也能通过网络套接字通信，实现越多接口越深。实现继承让父类和子类共享实例变量，改一处可能要连带检查其他类；先考虑用辅助类组合。；测试：单元测试让开发人员敢于重构，作者坚决拥护。没有测试套件，重大结构调整很危险，开发人员往往会避免重构。Tcl 把解释器换成字节码编译器时，现有单元测试非常有效地找出了新引擎的缺陷，alpha 版发布后只发现一个。；风险：敏捷和测试驱动开发都容易变成战术式编程。敏捷把注意力集中在功能上，推迟设计决策；测试驱动开发忙于让下一个测试通过，没有明确的时机做设计。增量开发通常是好主意，但增量应是抽象；修缺陷时先写测试则很合理。；过度：设计模式和 Getter、Setter：好方法也会被过度使用。适合的设计模式往往比自己从头设计更整洁；如果自己的方案更整洁，就不要硬套。Getter 和 Setter 是通常只有一行的浅方法，让类接口杂乱；最好一开始就避免公开实例变量。。这一章最想强调的：遇到新的开发范式，都从复杂性的角度审视：它真的有助于降低大型系统的复杂性吗 许多提案表面上听起来不错，深入研究后有些反而增加复杂性；一种方法是好方法，并不意味着用得越多越好</desc>
