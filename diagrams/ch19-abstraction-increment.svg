<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 597" role="img" aria-labelledby="ch19-abstraction-increment-title ch19-abstraction-increment-desc">
  <title id="ch19-abstraction-increment-title">联系人与库存导出共享行编码契约才可复用</title>
  <desc id="ch19-abstraction-increment-desc">教学例当前联系人导出需要编码 Li, Ming 和 Tokyo，后来库存导出需要编码 red, pen 和 2。两者都要给含逗号字段加引号，再用逗号连接字段。当前需求可建立 emitRow 契约，后来相同契约的需求才接入；分别内联会保留两份相同规则。PDF 排版是另一个责任，不因复用而并入。</desc>
  <defs><marker id="ch19-abstraction-increment-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="680" height="597" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" fill="var(--diagram-ink,#303630)">
    <text x="24" y="33" font-size="21" font-weight="600">先建立共同契约，再谈复用</text><text x="24" y="60" font-size="14">19.2 / 19.4 · 教学自拟导出场景，用来解释作者的抽象增量建议</text>
    <rect x="24" y="83" width="288" height="107" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)"/>
    <text x="40" y="112" font-weight="600">当前：联系人导出需要一行编码</text><text x="40" y="143" font-family="ui-monospace,monospace" font-size="14">["Li, Ming", "Tokyo"]</text><text x="40" y="172" font-size="14">此时已经需要处理字段内的逗号</text>
    <rect x="368" y="83" width="288" height="107" rx="4" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-dasharray="5 4"/>
    <text x="384" y="112" font-weight="600">后来：库存导出有同一种需求</text><text x="384" y="143" font-family="ui-monospace,monospace" font-size="14">["red, pen", "2"]</text><text x="384" y="172" font-size="14">只在契约相符时复用，不保证永远适配</text>
    <g fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch19-abstraction-increment-arrow)"><path d="M168 190V243"/><path d="M512 190V243" stroke-dasharray="5 4"/></g>
    <text x="183" y="219" font-size="14">定义所需核心</text><text x="526" y="219" font-size="14">后来接入</text>
    <rect x="24" y="243" width="632" height="155" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/>
    <text x="40" y="272" font-weight="600">emitRow(fields)：字段编码为一行</text>
    <text x="40" y="301">含逗号字段 → 两端加引号；字段之间 → 加分隔逗号</text>
    <path d="M24 316H656" stroke="var(--diagram-primary,#0b6f5d)"/>
    <text x="40" y="343" font-size="14">当前输入的输出</text><text x="384" y="343" font-size="14">后来兼容输入的输出</text>
    <text x="40" y="377" font-family="ui-monospace,monospace" font-size="16">"Li, Ming",Tokyo</text><text x="384" y="377" font-family="ui-monospace,monospace" font-size="16">"red, pen",2</text>
    <text x="24" y="427" font-size="14">对照：若各自内联，会留下两份相同字段规则（教学伪代码）</text>
    <text x="24" y="456" font-family="ui-monospace,monospace" font-size="14">联系人: if comma(f): quote(f)</text>
    <text x="368" y="456" font-family="ui-monospace,monospace" font-size="14">库存: if comma(f): quote(f)</text>
    <path d="M24 465V472H656V465" fill="none" stroke="var(--diagram-warm,#80531b)"/>
    <path d="M24 490H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="519">抽象外：PDF 分页、图表排版；尚无需求时不必预建。</text>
    <text x="24" y="549" font-size="14">这里只演示字母、空格、数字与逗号字段，不是完整 CSV 规范或实现。</text>
    <text x="24" y="576" font-size="14">作者的建议不是“所有功能合一”，也不是对所有敏捷实践的必然结论。</text>
  </g>
</svg>
