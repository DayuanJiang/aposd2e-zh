<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1139" role="img" aria-labelledby="ch06-storym-title ch06-storym-desc">
  <title id="ch06-storym-title">從為退格鍵專門寫一個方法，到兩個通用方法管所有文字修改</title>
  <desc id="ch06-storym-desc">本章回顧。從為退格鍵專門寫一個方法，到兩個通用方法管所有文字修改。起點：學生按介面操作給文字類加方法。退格鍵一個方法，刪除鍵一個方法，刪除所選區域再一個。許多方法只在一處呼叫，介面開發人員卻要學一大堆方法；每加一種介面操作，還得去改文字類。；問題：專用化造成資訊洩露，還是錯誤的抽象。退格鍵、所選區域這些介面概念出現在文字類裡，兩個類綁在一起，無法獨立開發。backspace 方法想藏住刪哪些字元，可介面恰恰需要知道這一點，只能去讀它的程式碼。；轉折：通用 API 只需 insert 和 delete。退格鍵寫成刪除游標前一個字元，刪除鍵寫成刪除游標後一個字元。程式碼略長，但一眼能看出刪的是什麼；文字類總程式碼更少，還能直接用於查詢替換程式。；做法：專用程式碼總會有，把它和通用程式碼分開。介面細節上移到介面層，裝置差異下移到驅動程式。撤銷機制中，History 類只管操作列表，各種具體操作由懂它的模組實作，將來加新操作不用改它。；細節：方法體裡也一樣：消除特殊情況。學生用一個狀態變量表示有沒有所選區域，結果到處都是檢查。讓所選區域始終存在，沒有時就是起止相同的空選區，複製、刪除的程式碼不用特殊處理也能正確。。這一章最想強調的：過度專用化可能是軟體最大的複雜性來源；通用的模組更深、程式碼更少 要適度：功能反映當前需求，介面不侷限於當前用途；對當前需求不好用，說明通用過頭了</desc>
