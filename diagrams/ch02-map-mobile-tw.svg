<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 501" role="img" aria-labelledby="ch02m-title ch02m-desc">
  <title id="ch02m-title">複雜性是什麼，怎麼看出來，從哪來？</title>
  <desc id="ch02m-desc">本章概覽。複雜性是什麼，怎麼看出來，從哪來？ 本章的主要部分：根源：依賴性、模糊性：改一處得顧及別處；重要資訊不明顯；症狀：變更放大、認知負荷、未知的未知：一改牽連多處；要記的太多；不知該改哪；結果：難理解、難修改：小改進也要花大量工作。一句話：讓系統難以理解和修改的因素；根源是依賴性和模糊性，由成百上千個小問題積累而成</desc>
  <rect width="420" height="501" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch02m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">複雜性是什麼，怎麼看出來，從哪</text>
    <text x="22.0" y="75.0" font-size="23" font-weight="600">來？</text>
    <text x="22.0" y="113.0" font-size="16" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">從上到下</text>
    <rect x="22.0" y="129.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="155.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,147.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" /></g>
    <text x="74.0" y="160.0" font-size="18" font-weight="600">結果：難理解、難修改</text>
    <text x="74.0" y="185.0" font-size="15" fill="var(--diagram-muted,#5c645d)">小改進也要花大量工作</text>
    <rect x="22.0" y="205.0" width="376.0" height="90.0" rx="9" fill="var(--diagram-warm-soft,#eae2cf)" />
    <circle cx="50.0" cy="231.0" r="14" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)" stroke-width="2" /><g transform="translate(42.0,223.0) scale(0.667)" fill="none" stroke="var(--diagram-warm,#80531b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></g>
    <text x="74.0" y="236.0" font-size="18" font-weight="600">症狀：變更放大、認知負荷、未知的</text>
    <text x="74.0" y="260.0" font-size="18" font-weight="600">未知</text>
    <text x="74.0" y="285.0" font-size="15" fill="var(--diagram-muted,#5c645d)">一改牽連多處；要記的太多；不知該改哪</text>
    <rect x="22.0" y="305.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-danger-soft,#ead9dc)" />
    <circle cx="50.0" cy="331.0" r="14" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" stroke-width="2" /><g transform="translate(42.0,323.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1" /><rect x="2" y="16" width="6" height="6" rx="1" /><rect x="9" y="2" width="6" height="6" rx="1" /><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3" /><path d="M12 12V8" /></g>
    <text x="74.0" y="336.0" font-size="18" font-weight="600">根源：依賴性、模糊性</text>
    <text x="74.0" y="361.0" font-size="15" fill="var(--diagram-muted,#5c645d)">改一處得顧及別處；重要資訊不明顯</text>
    <rect x="22.0" y="389.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="36.0" y="410.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="36.0" y="436.0" font-size="17" font-weight="600">讓系統難以理解和修改的因素；根源是依賴</text>
    <text x="36.0" y="462.0" font-size="17" font-weight="600">性和模糊性，由成百上千個小問題積累而成</text>
  </g>
</svg>
