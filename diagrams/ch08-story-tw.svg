<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 719" role="img" aria-labelledby="ch08-story-title ch08-story-desc">
  <title id="ch08-story-title">從把難題推給呼叫者，到模組自己多費一點力氣</title>
  <desc id="ch08-story-desc">本章回顧。從把難題推給呼叫者，到模組自己多費一點力氣。起點：遇到難處理的情況，最省事的是拋例外，或者做成設定參數。拿不準就拋例外，定不了策略就做成設定參數。開發人員輕鬆了，但每個呼叫者都得處理那個例外，每個部署的管理員都得學那些參數：一個人的問題變成了許多人的問題。；例子：文字類按行提供介面，使用者介面只能自己拆行拼行。按鍵輸入要在一行中間插入一個字元，刪除所選區域會改動幾行的一部分。行導向的介面讓文字類的實作很簡單，卻把拆分和連線行的工作推給了每一處用到它的介面程式碼。；轉折：下沉複雜性：介面字元導向，拆行拼行封裝在文字類內部。介面能直接插入、刪除任意範圍的文字，文字類內部多做拆行拼行，整體複雜性下降。設定參數同理：網路協議按實際響應時間自己算重試間隔，條件變了還會自動調整。；界限：別做過頭：退格鍵的邏輯放進文字類，是資訊洩露。下沉要與類的現有功能密切相關，還要能簡化其他部分和類的介面。退格鍵屬於使用者介面的知識，與文字類的核心功能無關，放進去對高層程式碼幫助不大，反而造成資訊洩露。。這一章最想強調的：與模組功能相關的複雜性，通常應在模組內部處理；介面簡單比實作簡單更重要 前提是這份複雜性與類的功能密切相關，且能簡化其他部分和介面；像退格鍵那樣下沉，只會造成資訊洩露</desc>
