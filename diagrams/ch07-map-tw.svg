<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 364" role="img" aria-labelledby="ch07-title ch07-desc">
  <title id="ch07-title">相鄰兩層的介面幾乎一樣，有什麼問題？</title>
  <desc id="ch07-desc">本章概覽。相鄰兩層的介面幾乎一樣，有什麼問題？ 本章的主要部分：只是轉手呼叫：原樣轉給下一層；每層不同的抽象：重新劃分職責。一句話：每層抽象都要與上下層不同；把呼叫或參數原樣轉給下一層，增加複雜性卻沒增加功能</desc>
  <rect width="960" height="364" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch07-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">相鄰兩層的介面幾乎一樣，有什麼問題？</text>
    <rect x="32.0" y="84.0" width="418.0" height="162.0" rx="12" fill="var(--diagram-danger-soft,#ead9dc)" />
    <g transform="translate(52.0,102.0) scale(1.083)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><line x1="3" x2="9" y1="12" y2="12" /><line x1="15" x2="21" y1="12" y2="12" /></g>
    <text x="88.0" y="122.0" font-size="20" font-weight="600">相鄰兩層抽象相似</text>
    <g transform="translate(52.0,146.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></g>
    <text x="76.0" y="159.0" font-size="15">方法只是轉手呼叫下一層</text>
    <g transform="translate(52.0,176.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></g>
    <text x="76.0" y="189.0" font-size="15">介面照搬內部儲存方式</text>
    <g transform="translate(52.0,206.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></g>
    <text x="76.0" y="219.0" font-size="15">參數穿過不用它的方法</text>
    <rect x="510.0" y="84.0" width="418.0" height="162.0" rx="12" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <g transform="translate(530.0,102.0) scale(1.083)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z" /><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12" /><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17" /></g>
    <text x="566.0" y="122.0" font-size="20" font-weight="600">每層提供不同的抽象</text>
    <g transform="translate(530.0,146.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></g>
    <text x="554.0" y="159.0" font-size="15">合併類，或重新分配功能</text>
    <g transform="translate(530.0,176.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></g>
    <text x="554.0" y="189.0" font-size="15">介面好用，細節封裝在類裡</text>
    <g transform="translate(530.0,206.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></g>
    <text x="554.0" y="219.0" font-size="15">全域資訊放進一個物件</text>
    <path d="M462.0 165.0 L498.0 165.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch07-arrow)" />
    <text x="480.0" y="151.0" font-size="13" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">重構</text>
    <rect x="32.0" y="268.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="50.0" y="289.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="50.0" y="319.0" font-size="21" font-weight="600">每層抽象都要與上下層不同；把呼叫或參數原樣轉給下一層，增加複雜性卻沒增加功能</text>
  </g>
</svg>
