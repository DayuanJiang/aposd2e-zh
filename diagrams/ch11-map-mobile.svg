    <text x="74.0" y="436.0" font-size="18" font-weight="600">不理想就另想方案</text>
    <text x="74.0" y="461.0" font-size="15" fill="var(--diagram-muted,#5c645d)">顺着发现的问题，找到面向范围的接口</text>
