    <text x="36.0" y="510.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="36.0" y="536.0" font-size="17" font-weight="600">设计很难，最初想法很少是最好的；每个主</text>
    <text x="36.0" y="562.0" font-size="17" font-weight="600">要决策比较几种方案再选，时间远少于实现</text>
