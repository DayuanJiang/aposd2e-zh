<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 601" role="img" aria-labelledby="ch11m-title ch11m-desc">
  <title id="ch11m-title">最先想到的设计，为什么不该直接采用？</title>
  <desc id="ch11m-desc">本章概览。最先想到的设计，为什么不该直接采用？ 本章的主要部分：勾勒几种方案：文本类按行、按字符或按范围操作；列出优缺点：先看高层软件好不好用，再比通用和效率；比较后选择：选一个，或把几个方案的特点组合；不理想就另想方案：顺着发现的问题，找到面向范围的接口。一句话：设计很难，最初想法很少是最好的；每个主要决策比较几种方案再选，时间远少于实现</desc>
  <rect width="420" height="601" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch11m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">最先想到的设计，为什么不该直接</text>
    <text x="22.0" y="75.0" font-size="23" font-weight="600">采用？</text>
    <text x="22.0" y="111.0" font-size="13" fill="var(--diagram-muted,#5c645d)">挑差异大的方案；哪怕只有一种合理，也要想第二种</text>
    <rect x="22.0" y="129.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <circle cx="50.0" cy="155.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,147.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></g>
    <text x="74.0" y="160.0" font-size="18" font-weight="600">勾勒几种方案</text>
    <text x="74.0" y="185.0" font-size="15" fill="var(--diagram-muted,#5c645d)">文本类按行、按字符或按范围操作</text>
