<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 522" role="img" aria-labelledby="ch09-title ch09-desc">
  <title id="ch09-title">兩個功能放在一起實作，還是分開實作？</title>
  <desc id="ch09-desc">本章概覽。兩個功能放在一起實作，還是分開實作？ 本章的主要部分：共享資訊就組合：讀 HTTP 請求的程式碼不解析標頭就找不到結尾，與解析合在一個類裡，程式碼更短；簡化介面就組合：合併後中間傳字串的介面沒了；檔案流預設帶緩衝，多數使用者不必知道緩衝；組合來消除重複：幾種資料包各寫一遍同樣的日誌語句；提取成方法，或用 goto 讓它只留一份；通用與專用分開：文字類提供通用操作；刪除所選區域這類介面操作歸介面模組，否則資訊洩露；方法看深度：拆分多出介面。方法夠深、簽名簡單，幾百行也行；必須一起讀才懂的是連體方法。一句話：依據是整個系統的複雜性：共享資訊或能簡化介面就組合，通用機制與專用程式碼分開，方法先求深再求短</desc>
  <rect width="960" height="522" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch09-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">兩個功能放在一起實作，還是分開實作？</text>
    <rect x="32.0" y="84.0" width="896.0" height="70.0" rx="12" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <g transform="translate(52.0,105.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></g>
    <text x="94.0" y="114.0" font-size="20" font-weight="600">目標：整個系統的複雜性最低，資訊隱藏最好、依賴最少、介面最深</text>
    <text x="94.0" y="138.0" font-size="15" fill="var(--diagram-muted,#5c645d)">細分本身也有代價：元件更多、介面更多、需要額外的管理程式碼、相關程式碼被分散、還可能重複</text>
    <rect x="32.0" y="172.0" width="164.8" height="202.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <rect x="46.0" y="260" width="136.8" height="1" fill="var(--diagram-line,#aebbad)" />
    <g transform="translate(46.0,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1" /><rect x="2" y="16" width="6" height="6" rx="1" /><rect x="9" y="2" width="6" height="6" rx="1" /><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3" /><path d="M12 12V8" /></g>
    <text x="46.0" y="248.0" font-size="18" font-weight="600">共享資訊就組合</text>
    <text x="46.0" y="282.0" font-size="14" fill="var(--diagram-muted,#5c645d)">讀 HTTP 請求的程式碼</text>
    <text x="46.0" y="303.0" font-size="14" fill="var(--diagram-muted,#5c645d)">不解析標頭就找不到</text>
    <text x="46.0" y="324.0" font-size="14" fill="var(--diagram-muted,#5c645d)">結尾，與解析合在一</text>
    <text x="46.0" y="345.0" font-size="14" fill="var(--diagram-muted,#5c645d)">個類裡，程式碼更短</text>
    <rect x="214.8" y="172.0" width="164.8" height="202.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <rect x="228.8" y="260" width="136.8" height="1" fill="var(--diagram-line,#aebbad)" />
    <g transform="translate(228.8,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5" /><path d="M9 8V2" /><path d="M15 8V2" /><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z" /></g>
    <text x="228.8" y="248.0" font-size="18" font-weight="600">簡化介面就組合</text>
    <text x="228.8" y="282.0" font-size="14" fill="var(--diagram-muted,#5c645d)">合併後中間傳字串</text>
    <text x="228.8" y="303.0" font-size="14" fill="var(--diagram-muted,#5c645d)">的介面沒了；檔案流</text>
    <text x="228.8" y="324.0" font-size="14" fill="var(--diagram-muted,#5c645d)">預設帶緩衝，多數用</text>
    <text x="228.8" y="345.0" font-size="14" fill="var(--diagram-muted,#5c645d)">戶不必知道緩衝</text>
    <rect x="397.6" y="172.0" width="164.8" height="202.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <rect x="411.6" y="260" width="136.8" height="1" fill="var(--diagram-line,#aebbad)" />
    <g transform="translate(411.6,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5" /><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12" /><path d="m14 16-3 3 3 3" /><path d="M8.293 13.596 7.196 9.5 3.1 10.598" /><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843" /><path d="m13.378 9.633 4.096 1.098 1.097-4.096" /></g>
    <text x="411.6" y="248.0" font-size="18" font-weight="600">組合來消除重複</text>
    <text x="411.6" y="282.0" font-size="14" fill="var(--diagram-muted,#5c645d)">幾種資料包各寫一遍</text>
    <text x="411.6" y="303.0" font-size="14" fill="var(--diagram-muted,#5c645d)">同樣的日誌語句；提</text>
    <text x="411.6" y="324.0" font-size="14" fill="var(--diagram-muted,#5c645d)">取成方法，或用 goto</text>
    <text x="411.6" y="345.0" font-size="14" fill="var(--diagram-muted,#5c645d)">讓它只留一份</text>
    <rect x="580.4" y="172.0" width="164.8" height="202.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <rect x="594.4" y="260" width="136.8" height="1" fill="var(--diagram-line,#aebbad)" />
    <g transform="translate(594.4,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5" /><path d="M8 3H3v5" /><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3" /><path d="m15 9 6-6" /></g>
    <text x="594.4" y="248.0" font-size="18" font-weight="600">通用與專用分開</text>
    <text x="594.4" y="282.0" font-size="14" fill="var(--diagram-muted,#5c645d)">文字類提供通用操作；</text>
    <text x="594.4" y="303.0" font-size="14" fill="var(--diagram-muted,#5c645d)">刪除所選區域這類界</text>
    <text x="594.4" y="324.0" font-size="14" fill="var(--diagram-muted,#5c645d)">面操作歸介面模組，</text>
    <text x="594.4" y="345.0" font-size="14" fill="var(--diagram-muted,#5c645d)">否則資訊洩露</text>
    <rect x="763.2" y="172.0" width="164.8" height="202.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <rect x="777.2" y="260" width="136.8" height="1" fill="var(--diagram-line,#aebbad)" />
    <g transform="translate(777.2,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4" /><path d="M3.34 19a10 10 0 1 1 17.32 0" /></g>
    <text x="777.2" y="248.0" font-size="18" font-weight="600">方法看深度</text>
    <text x="777.2" y="282.0" font-size="14" fill="var(--diagram-muted,#5c645d)">拆分多出介面。方法</text>
    <text x="777.2" y="303.0" font-size="14" fill="var(--diagram-muted,#5c645d)">夠深、簽名簡單，幾</text>
    <text x="777.2" y="324.0" font-size="14" fill="var(--diagram-muted,#5c645d)">百行也行；必須一起</text>
    <text x="777.2" y="345.0" font-size="14" fill="var(--diagram-muted,#5c645d)">讀才懂的是連體方法</text>
    <rect x="32.0" y="396.0" width="896.0" height="98.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="50.0" y="417.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="50.0" y="447.0" font-size="21" font-weight="600">依據是整個系統的複雜性：共享資訊或能簡化介面就組合，通用機制與專用程式碼分開，方法</text>
    <text x="50.0" y="477.0" font-size="21" font-weight="600">先求深再求短</text>
  </g>
</svg>
