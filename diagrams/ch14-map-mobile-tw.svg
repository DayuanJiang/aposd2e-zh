<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 616" role="img" aria-labelledby="ch14m-title ch14m-desc">
  <title id="ch14m-title">怎樣為變數和方法選一個好名稱？</title>
  <desc id="ch14m-desc">本章概覽。怎樣為變數和方法選一個好名稱？ 本章的主要部分：精確：block 一詞指兩種塊，引出追查六個月的缺陷；一致：同一用途始終用同一名稱，不作他用；去掉多餘的詞：每個詞都要提供資訊，fileObject 裡的 Object 就多餘。一句話：讀者第一次遇到就能正確猜出它指什麼：精確、一致、沒有多餘的詞；起名困難則是設計的危險訊號</desc>
  <rect width="420" height="616" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch14m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">怎樣為變數和方法選一個好名稱？</text>
    <rect x="22.0" y="68.0" width="376.0" height="90.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="94.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,86.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></g>
    <text x="74.0" y="99.0" font-size="18" font-weight="600">目標：讀者只看名稱，就能對所指事</text>
    <text x="74.0" y="123.0" font-size="18" font-weight="600">物形成清晰印象</text>
    <text x="74.0" y="148.0" font-size="15" fill="var(--diagram-muted,#5c645d)">名稱本身就是一種文件</text>
    <text x="22.0" y="182.0" font-size="16" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">靠什麼支撐</text>
    <rect x="22.0" y="198.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="224.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,216.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /></g>
    <text x="74.0" y="229.0" font-size="18" font-weight="600">精確</text>
    <text x="74.0" y="254.0" font-size="15" fill="var(--diagram-muted,#5c645d)">block 一詞指兩種塊，引出追查六個月的缺</text>
    <text x="74.0" y="276.0" font-size="15" fill="var(--diagram-muted,#5c645d)">陷</text>
    <rect x="22.0" y="296.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="322.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,314.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" /></g>
    <text x="74.0" y="327.0" font-size="18" font-weight="600">一致</text>
    <text x="74.0" y="352.0" font-size="15" fill="var(--diagram-muted,#5c645d)">同一用途始終用同一名稱，不作他用</text>
    <rect x="22.0" y="372.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="398.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,390.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" /></g>
    <text x="74.0" y="403.0" font-size="18" font-weight="600">去掉多餘的詞</text>
    <text x="74.0" y="428.0" font-size="15" fill="var(--diagram-muted,#5c645d)">每個詞都要提供資訊，fileObject 裡的</text>
    <text x="74.0" y="450.0" font-size="15" fill="var(--diagram-muted,#5c645d)">Object 就多餘</text>
    <rect x="22.0" y="478.0" width="376.0" height="116.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="36.0" y="499.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="36.0" y="525.0" font-size="17" font-weight="600">讀者第一次遇到就能正確猜出它指什麼：精</text>
    <text x="36.0" y="551.0" font-size="17" font-weight="600">確、一致、沒有多餘的詞；起名困難則是設</text>
    <text x="36.0" y="577.0" font-size="17" font-weight="600">計的危險訊號</text>
  </g>
</svg>
