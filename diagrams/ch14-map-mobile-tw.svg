<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 824" role="img" aria-labelledby="ch14m-title ch14m-desc">
  <title id="ch14m-title">怎樣為變數和方法選一個好名稱？</title>
  <desc id="ch14m-desc">本章概覽。怎樣為變數和方法選一個好名稱？ 本章的主要部分：精確：block 既指磁碟塊也指檔案塊，引出追查六個月的缺陷；fileBlock、diskBlock 就分得開；一致：同一種用途始終用同一個名稱，且這個名稱不用於別的用途；迴圈變數 i 總在外層，j 總在內層；去掉多餘的詞：fileObject 裡的 Object、匈牙利命名法的型別字首、File 類裡的 fileBlock，都沒有提供新資訊；起名難是危險訊號：想不出精確、直觀又不長的名稱，說明變數的定義或用途可能不清楚；也許它表示了多個事物，該拆開。一句話：好名稱讓讀者第一次遇到就能正確猜出它指什麼：精確、一致、沒有多餘的詞，起名困難就是設計的危險訊號</desc>
  <rect width="420" height="824" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch14m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">怎樣為變數和方法選一個好名稱？</text>
    <rect x="22.0" y="68.0" width="376.0" height="112.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="94.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,86.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></g>
    <text x="74.0" y="99.0" font-size="18" font-weight="600">目標：讀者只看名稱，就能對它指的</text>
    <text x="74.0" y="123.0" font-size="18" font-weight="600">東西形成清晰的印象</text>
    <text x="74.0" y="148.0" font-size="15" fill="var(--diagram-muted,#5c645d)">名稱本身就是一種文件；成千上萬個變數都選</text>
    <text x="74.0" y="170.0" font-size="15" fill="var(--diagram-muted,#5c645d)">好名稱，系統的複雜性就會明顯不同</text>
    <text x="22.0" y="204.0" font-size="16" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">靠什麼支撐</text>
    <rect x="22.0" y="220.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="246.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,238.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></g>
    <text x="74.0" y="251.0" font-size="18" font-weight="600">精確</text>
    <text x="74.0" y="276.0" font-size="15" fill="var(--diagram-muted,#5c645d)">block 既指磁碟塊也指檔案塊，引出追查六個</text>
    <text x="74.0" y="298.0" font-size="15" fill="var(--diagram-muted,#5c645d)">月的缺陷；fileBlock、diskBlock 就分得開</text>
    <rect x="22.0" y="318.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="344.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,336.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" /></g>
    <text x="74.0" y="349.0" font-size="18" font-weight="600">一致</text>
    <text x="74.0" y="374.0" font-size="15" fill="var(--diagram-muted,#5c645d)">同一種用途始終用同一個名稱，且這個名稱不</text>
    <text x="74.0" y="396.0" font-size="15" fill="var(--diagram-muted,#5c645d)">用於別的用途；迴圈變數 i 總在外層，j 總在</text>
    <text x="74.0" y="418.0" font-size="15" fill="var(--diagram-muted,#5c645d)">內層</text>
    <rect x="22.0" y="438.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="464.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,456.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" /></g>
    <text x="74.0" y="469.0" font-size="18" font-weight="600">去掉多餘的詞</text>
    <text x="74.0" y="494.0" font-size="15" fill="var(--diagram-muted,#5c645d)">fileObject 裡的 Object、匈牙利命名法的</text>
    <text x="74.0" y="516.0" font-size="15" fill="var(--diagram-muted,#5c645d)">型別字首、File 類裡的 fileBlock，都沒有</text>
    <text x="74.0" y="538.0" font-size="15" fill="var(--diagram-muted,#5c645d)">提供新資訊</text>
    <rect x="22.0" y="558.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="584.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,576.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></g>
    <text x="74.0" y="589.0" font-size="18" font-weight="600">起名難是危險訊號</text>
    <text x="74.0" y="614.0" font-size="15" fill="var(--diagram-muted,#5c645d)">想不出精確、直觀又不長的名稱，說明變數的</text>
    <text x="74.0" y="636.0" font-size="15" fill="var(--diagram-muted,#5c645d)">定義或用途可能不清楚；也許它表示了多個事</text>
    <text x="74.0" y="658.0" font-size="15" fill="var(--diagram-muted,#5c645d)">物，該拆開</text>
    <rect x="22.0" y="686.0" width="376.0" height="116.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="36.0" y="707.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="36.0" y="733.0" font-size="17" font-weight="600">好名稱讓讀者第一次遇到就能正確猜出它指什</text>
    <text x="36.0" y="759.0" font-size="17" font-weight="600">麼：精確、一致、沒有多餘的詞，起名困難就</text>
    <text x="36.0" y="785.0" font-size="17" font-weight="600">是設計的危險訊號</text>
  </g>
</svg>
