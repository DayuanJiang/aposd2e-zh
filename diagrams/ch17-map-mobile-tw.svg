<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 622" role="img" aria-labelledby="ch17m-title ch17m-desc">
  <title id="ch17m-title">一致性為什麼重要，怎麼保持？</title>
  <desc id="ch17m-desc">本章概覽。一致性為什麼重要，怎麼保持？ 本章的主要部分：寫下約定：全域約定寫成文件，區域性約定寫進程式碼；自動檢查：寫工具自動檢查，透過才能提交；入鄉隨俗：先看現有程式碼怎麼做，照著做；不改舊約定：有更好的想法也不足以引入不一致。一句話：理解一處就能理解其他地方，失誤更少；靠寫下約定、自動檢查、入鄉隨俗來保持</desc>
  <rect width="420" height="622" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch17m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">一致性為什麼重要，怎麼保持？</text>
    <rect x="22.0" y="68.0" width="376.0" height="90.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="94.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,86.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></g>
    <text x="74.0" y="99.0" font-size="18" font-weight="600">目標：相似的事採用相似做法，不同</text>
    <text x="74.0" y="123.0" font-size="18" font-weight="600">的事採用不同做法</text>
    <text x="74.0" y="148.0" font-size="15" fill="var(--diagram-muted,#5c645d)">已有知識可以複用，不必從頭學習</text>
    <text x="22.0" y="182.0" font-size="16" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">靠什麼支撐</text>
    <rect x="22.0" y="198.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="224.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,216.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /><path d="M10 9H8" /><path d="M16 13H8" /><path d="M16 17H8" /></g>
    <text x="74.0" y="229.0" font-size="18" font-weight="600">寫下約定</text>
    <text x="74.0" y="254.0" font-size="15" fill="var(--diagram-muted,#5c645d)">全域約定寫成文件，區域性約定寫進程式碼</text>
    <rect x="22.0" y="274.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="300.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,292.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /><path d="m9 12 2 2 4-4" /></g>
    <text x="74.0" y="305.0" font-size="18" font-weight="600">自動檢查</text>
    <text x="74.0" y="330.0" font-size="15" fill="var(--diagram-muted,#5c645d)">寫工具自動檢查，透過才能提交</text>
    <rect x="22.0" y="350.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="376.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,368.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z" /><circle cx="12" cy="12" r="10" /></g>
    <text x="74.0" y="381.0" font-size="18" font-weight="600">入鄉隨俗</text>
    <text x="74.0" y="406.0" font-size="15" fill="var(--diagram-muted,#5c645d)">先看現有程式碼怎麼做，照著做</text>
    <rect x="22.0" y="426.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="452.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,444.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>
    <text x="74.0" y="457.0" font-size="18" font-weight="600">不改舊約定</text>
    <text x="74.0" y="482.0" font-size="15" fill="var(--diagram-muted,#5c645d)">有更好的想法也不足以引入不一致</text>
    <rect x="22.0" y="510.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="36.0" y="531.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="36.0" y="557.0" font-size="17" font-weight="600">理解一處就能理解其他地方，失誤更少；靠</text>
    <text x="36.0" y="583.0" font-size="17" font-weight="600">寫下約定、自動檢查、入鄉隨俗來保持</text>
  </g>
