    <text x="118.0" y="503.0" font-size="19" font-weight="600">三種方式讓讀者始終掌握所需資訊</text>
    <text x="118.0" y="529.0" font-size="15">最好的辦法是用抽象、消除特殊情況等設計手段，減少讀者需要知道的資訊；其次是遵循約定、符合預期，用讀者已有的知</text>
