<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 719" role="img" aria-labelledby="ch18-story-title ch18-story-desc">
  <title id="ch18-story-title">從一對叫 getKey 的回傳值，到讓讀者始終掌握所需資訊</title>
  <desc id="ch18-story-desc">本章回顧。從一對叫 getKey 的回傳值，到讓讀者始終掌握所需資訊。起點：方法用 Pair 回傳當前任期和一個布林值。呼叫者只能寫 result.getKey() 和 result.getValue()，這兩個名字說不出值的含義。寫的人省了幾分鐘，之後每個讀者都要去查。；問題：危險訊號：快速閱讀卻讀不懂，說明讀者缺了某條重要資訊。List 變數實際是 ArrayList；事件處理函式由事件模組間接呼叫，看不出何時執行；RaftClient 的建構函式開了新執行緒，main 回傳後行程仍在執行。；轉折：寫的時候多花幾分鐘，讀的人少花很多時間。為回傳值定義專門的類，元素就有了有意義的名字；讓宣告型別與分配型別一致；用空行分開程式碼塊，讓註解更醒目。如果讀你程式碼的人說它難懂，它就是難懂。；結論：三種方式讓讀者始終掌握所需資訊。最好的辦法是用抽象、消除特殊情況等設計手段，減少讀者需要知道的資訊；其次是遵循約定、符合預期，用讀者已有的知識；最後才是用好名稱和有針對性的註解直接補上資訊。。這一章最想強調的：軟體應設計得易於閱讀：寫程式碼的人多花幾分鐘，每個讀者都少花時間 事件驅動這類做法有時仍要用，這時用註解補上讀者缺少的資訊，例如說明處理函式何時會被呼叫</desc>
