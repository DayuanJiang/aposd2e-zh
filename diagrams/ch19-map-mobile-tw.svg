<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 710" role="img" aria-labelledby="ch19m-title ch19m-desc">
  <title id="ch19m-title">流行的開發趨勢真的降低複雜性嗎？</title>
  <desc id="ch19m-desc">本章概覽。流行的開發趨勢真的降低複雜性嗎？ 本章的主要部分：繼承：只繼承介面好，連實作一起繼承要謹慎；敏捷：增量開發通常是好主意，增量應是抽象；單元測試：堅決擁護；不熱衷測試驅動開發；設計模式：適合時很好，最大風險是過度使用；Getter：與 Setter 都是淺方法，最好儘量避免。一句話：介面繼承、單元測試有幫助；實作繼承、敏捷、設計模式有風險；不熱衷測試驅動開發，Getter 和 Setter 儘量避免</desc>
