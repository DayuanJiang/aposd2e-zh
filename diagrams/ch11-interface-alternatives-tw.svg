<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 655" role="img" aria-labelledby="ch11-interface-alternatives-t ch11-interface-alternatives-d">
  <title id="ch11-interface-alternatives-t">用同一操作檢驗三個介面</title><desc id="ch11-interface-alternatives-d">教學文字abcd換行efgh刪除cd、一個換行、ef後成為abgh。整行方案由呼叫者取出首行字首ab與末行字尾gh，再合併寫回。逐字元方案固定刪除當前索引2，依次得到abd換行efgh、ab換行efgh、abefgh、abfgh、abgh。範圍方案一次表達零基索引範圍2至7，不含7。五次呼叫不是五倍耗時結論。</desc>
  <defs><marker id="ch11-interface-alternatives-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--diagram-muted,#58636b)" /></marker></defs>
  <rect width="680" height="655" fill="var(--diagram-bg,#f5f7f8)" />
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" fill="var(--diagram-ink,#263239)">
    <text x="24" y="34" font-size="21" font-weight="600">用同一操作檢驗三個介面</text>
    <text x="24" y="70">同一教學任務：刪除著色範圍；↵ 表示一個換行，索引從 0 開始。</text>
    <rect x="200" y="87" width="68" height="26" fill="var(--diagram-danger-soft,#ead9dc)" /><rect x="160" y="116" width="40" height="26" fill="var(--diagram-danger-soft,#ead9dc)" />
    <g font-family="monospace" font-size="22"><text x="164" y="109">a</text><text x="184" y="109">b</text><text x="204" y="109">c</text><text x="224" y="109">d</text><text x="244" y="109">↵</text><text x="164" y="138">e</text><text x="184" y="138">f</text><text x="204" y="138">g</text><text x="224" y="138">h</text><text x="424" y="121">abgh</text></g>
    <path d="M292 115H398" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch11-interface-alternatives-a)" /><text x="521" y="110" font-size="14">刪除 4 個字母</text><text x="521" y="134" font-size="14">和 1 個換行</text>
    <path d="M24 164H656" stroke="var(--diagram-line,#aebbad)" />
    <text x="24" y="194" font-weight="600">整行介面：呼叫者拆分並取出保留片段</text>
    <text x="24" y="244" font-size="14">首行字首</text><text x="24" y="298" font-size="14">末行字尾</text>
    <g fill="var(--diagram-secondary-soft,#dce4ed)"><rect x="155" y="219" width="66" height="38" rx="4" /><rect x="155" y="273" width="66" height="38" rx="4" /></g>
    <g font-family="monospace" font-size="20"><text x="175" y="245">ab</text><text x="175" y="299">gh</text></g>
    <g fill="none" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch11-interface-alternatives-a)"><path d="M222 238H320V266H411" /><path d="M222 292H320V266" /></g>
    <text x="336" y="251">合併行</text>
    <rect x="418" y="241" width="156" height="50" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" /><text x="469" y="274" font-family="monospace" font-size="22">abgh</text>
    <text x="24" y="333" font-size="13">再透過整行操作寫回；這裡不指定具體 API 簽名或呼叫次數。</text>
    <path d="M24 348H656" stroke="var(--diagram-line,#aebbad)" />
    <text x="24" y="377" font-weight="600">逐字元介面：呼叫者迴圈，五次都刪除當前索引 2 的字元</text>
    <g fill="var(--diagram-secondary-soft,#dce4ed)"><rect x="24" y="411" width="80" height="40" /><rect x="138" y="411" width="80" height="40" /><rect x="252" y="411" width="70" height="40" /><rect x="356" y="411" width="60" height="40" /><rect x="450" y="411" width="52" height="40" /></g><rect x="536" y="411" width="56" height="40" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <g font-family="monospace" font-size="13"><text x="28" y="437">abcd↵efgh</text><text x="146" y="437">abd↵efgh</text><text x="259" y="437">ab↵efgh</text><text x="362" y="437">abefgh</text><text x="456" y="437">abfgh</text><text x="547" y="437">abgh</text></g>
    <g stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch11-interface-alternatives-a)"><path d="M105 431H130" /><path d="M219 431H244" /><path d="M323 431H348" /><path d="M417 431H442" /><path d="M503 431H528" /></g>
    <g font-size="12"><text x="108" y="402">1:c</text><text x="221" y="402">2:d</text><text x="325" y="402">3:↵</text><text x="419" y="402">4:e</text><text x="505" y="402">5:f</text></g>
    <text x="24" y="477" font-size="13">箭頭上標出呼叫次序與刪去的字元；換行只刪一次，後續字元向前移動。</text>
    <path d="M24 494H656" stroke="var(--diagram-line,#aebbad)" />
    <text x="24" y="524" font-weight="600">任意範圍介面：呼叫者直接表達同一個範圍</text>
    <rect x="24" y="543" width="164" height="44" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" /><text x="53" y="571" font-family="monospace">[2, 7)</text>
    <path d="M189 565H431" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch11-interface-alternatives-a)" /><text x="249" y="553" font-size="14">一次範圍刪除</text>
    <rect x="438" y="543" width="156" height="44" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" /><text x="488" y="573" font-family="monospace" font-size="22">abgh</text>
    <text x="24" y="616" font-size="13" fill="var(--diagram-muted,#58636b)">字母、索引和軌跡是教學例；五次呼叫不等於五倍耗時，未做效能測量。</text><text x="24" y="640" font-size="13" fill="var(--diagram-muted,#58636b)">第8章“字元導向”指任意範圍；本章的逐字元候選一次只處理一個字元。</text>
  </g>
</svg>
