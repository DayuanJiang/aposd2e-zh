<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 624" role="img" aria-labelledby="ch14-block-domains-m-t ch14-block-domains-m-d">
  <title id="ch14-block-domains-m-t">同一個數字，兩個地址域</title><desc id="ch14-block-domains-m-d">檔案塊2經過對映成為磁碟塊9。右側旁路繞過對映，把2直接當作物理塊號，誤清零無關磁碟塊2。數字為教學例。</desc>
  <defs><marker id="ch14-block-domains-m-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--diagram-muted,#58636b)" /></marker></defs>
  <rect width="360" height="624" fill="var(--diagram-bg,#f5f7f8)" />
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" fill="var(--diagram-ink,#263239)">
    <text x="20" y="32" font-size="18" font-weight="600">同一個數字，兩個地址域</text><text x="20" y="67" font-size="14">教學例：檔案塊 2 對應磁碟塊 9</text>
    <rect x="20" y="89" width="270" height="65" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" /><text x="38" y="116" font-weight="600">fileBlock = 2</text><text x="38" y="141">檔案邏輯域：檔案內部的索引</text>
    <path d="M155 155V184" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch14-block-domains-m-a)" />
    <rect x="20" y="191" width="270" height="47" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" /><text x="82" y="221">地址對映：2 → 9</text>
    <path d="M155 239V268" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch14-block-domains-m-a)" />
    <rect x="20" y="275" width="270" height="66" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" /><text x="38" y="303" font-weight="600">diskBlock = 9</text><text x="38" y="329">磁碟物理域：真正對應的塊</text>
    <path d="M291 121H327V421H297" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" marker-end="url(#ch14-block-domains-m-a)" />
    <text x="20" y="374" fill="var(--diagram-danger,#a03946)" font-size="14">旁路：直接把 2 當作物理塊號</text>
    <rect x="20" y="391" width="270" height="64" rx="4" fill="var(--diagram-danger-soft,#ead9dc)" /><text x="38" y="419">磁碟塊 2：無關資料被清零</text><text x="38" y="444" font-size="13">都叫 block，掩蓋了跨域誤用</text>
    <path d="M20 479H340" stroke="var(--diagram-line,#aebbad)" /><text x="20" y="510">名稱區分地址域；更進一步，</text><text x="20" y="537">用不可互換的型別限制混用。</text>
    <text x="20" y="571" font-size="13" fill="var(--diagram-muted,#58636b)">2和9為教學自擬，不是歷史事故的塊號。</text><text x="20" y="595" font-size="13" fill="var(--diagram-muted,#58636b)">名稱本身不提供型別安全保證。</text>
  </g>
</svg>
