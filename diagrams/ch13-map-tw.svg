<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" aria-labelledby="ch13-title ch13-desc">
  <title id="ch13-title">註解應該描述什麼資訊？</title>
  <desc id="ch13-desc">本章概覽。註解應該描述什麼資訊？ 本章的主要部分：更低層級：提高精確度：補上宣告沒說的細節：單位是畫素還是字元、範圍是否包含邊界、空值代表什麼、誰負責釋放資源；與程式碼同一層級：重複程式碼：讀者從旁邊程式碼就能看出的資訊，例如“新增水平捲軸”，或者只是重複方法名裡的詞；更高層級：增強直覺：省略細節，說明這段程式碼要做什麼、為什麼需要它，例如“把當前鍵雜湊追加到一個尚未傳送的 RPC”。一句話：描述從程式碼中不易看出的資訊：要麼比程式碼更詳細以求精確，要麼比程式碼更抽象以幫助理解</desc>
  <rect width="960" height="472" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch13-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">註解應該描述什麼資訊？</text>
    <text x="32.0" y="94.0" font-size="15" fill="var(--diagram-muted,#5c645d)">註解靠提供與程式碼不同詳細程度的資訊來補充程式碼；和程式碼處在同一詳細程度的註解，多半在重複程式碼</text>
    <rect x="32.0" y="114.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <g transform="translate(50.0,132.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></g>
    <text x="92.0" y="142.0" font-size="18" font-weight="600">更高層級：增強直覺</text>
    <text x="92.0" y="164.0" font-size="15" fill="var(--diagram-muted,#5c645d)">省略細節，說明這段程式碼要做什麼、為什麼需要它，例如“把當前鍵雜湊追加到一個尚未傳送的 RPC”</text>
    <rect x="32.0" y="186.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-danger-soft,#ead9dc)" />
    <g transform="translate(50.0,204.0) scale(1.167)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6" /><polyline points="8 6 2 12 8 18" /></g>
    <text x="92.0" y="214.0" font-size="18" font-weight="600">與程式碼同一層級：重複程式碼</text>
    <text x="92.0" y="236.0" font-size="15" fill="var(--diagram-muted,#5c645d)">讀者從旁邊程式碼就能看出的資訊，例如“新增水平捲軸”，或者只是重複方法名裡的詞</text>
    <rect x="32.0" y="258.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <g transform="translate(50.0,276.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /></g>
    <text x="92.0" y="286.0" font-size="18" font-weight="600">更低層級：提高精確度</text>
    <text x="92.0" y="308.0" font-size="15" fill="var(--diagram-muted,#5c645d)">補上宣告沒說的細節：單位是畫素還是字元、範圍是否包含邊界、空值代表什麼、誰負責釋放資源</text>
    <text x="32.0" y="348.0" font-size="14" fill="var(--diagram-muted,#5c645d)">介面註解描述抽象，與實作註解分開；跨模組決策放在開發人員自然會看到的位置，例如狀態列舉旁或 designNotes 檔案</text>
    <rect x="32.0" y="376.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="50.0" y="397.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="50.0" y="427.0" font-size="21" font-weight="600">描述從程式碼中不易看出的資訊：要麼比程式碼更詳細以求精確，要麼比程式碼更抽象以幫助理解</text>
  </g>
</svg>
