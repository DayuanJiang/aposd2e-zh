<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img" aria-labelledby="ch01-title ch01-desc">
  <title id="ch01-title">这本书要解决什么问题？</title>
  <desc id="ch01-desc">本章概览。这本书要解决什么问题？ 本章的主要部分：认清复杂性：复杂性是什么、为什么重要；在代码审查中练习识别危险信号，看别人的代码更容易看出问题；消除复杂性：让代码更简单、更易理解，例如消除特殊情况、一致地使用标识符；封装复杂性：模块化设计：把系统分成相对独立的模块，开发一个模块时不必了解其他模块的细节；持续重新设计：软件改起来容易，所以设计贯穿整个生命周期；初始设计几乎从来都不是最佳设计。一句话：复杂性限制了我们能造多大的系统；全书讲怎样在整个开发过程中认清、消除和封装它</desc>
  <rect width="960" height="496" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch01-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">这本书要解决什么问题？</text>
    <rect x="32.0" y="84.0" width="896.0" height="70.0" rx="12" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <g transform="translate(52.0,105.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>
    <text x="94.0" y="114.0" font-size="20" font-weight="600">目标：在复杂性变得难以驾驭之前，造出更大、功能更强的系统</text>
    <text x="94.0" y="138.0" font-size="15" fill="var(--diagram-muted,#5c645d)">写软件最大的限制是我们理解系统的能力；复杂性随功能增加不断积累，光靠工具不够，必须简化软件本身</text>
    <rect x="32.0" y="172.0" width="210.5" height="206.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <rect x="46.0" y="260" width="182.5" height="1" fill="var(--diagram-line,#aebbad)"/>
    <g transform="translate(46.0,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></g>
    <text x="46.0" y="248.0" font-size="18" font-weight="600">认清复杂性</text>
    <text x="46.0" y="282.0" font-size="15" fill="var(--diagram-muted,#5c645d)">复杂性是什么、为什么重</text>
    <text x="46.0" y="304.0" font-size="15" fill="var(--diagram-muted,#5c645d)">要；在代码审查中练习识别</text>
    <text x="46.0" y="326.0" font-size="15" fill="var(--diagram-muted,#5c645d)">危险信号，看别人的代码更</text>
    <text x="46.0" y="348.0" font-size="15" fill="var(--diagram-muted,#5c645d)">容易看出问题</text>
    <rect x="260.5" y="172.0" width="210.5" height="206.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <rect x="274.5" y="260" width="182.5" height="1" fill="var(--diagram-line,#aebbad)"/>
    <g transform="translate(274.5,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></g>
    <text x="274.5" y="248.0" font-size="18" font-weight="600">消除复杂性</text>
    <text x="274.5" y="282.0" font-size="15" fill="var(--diagram-muted,#5c645d)">让代码更简单、更易理解，</text>
    <text x="274.5" y="304.0" font-size="15" fill="var(--diagram-muted,#5c645d)">例如消除特殊情况、一致地</text>
    <text x="274.5" y="326.0" font-size="15" fill="var(--diagram-muted,#5c645d)">使用标识符</text>
    <rect x="489.0" y="172.0" width="210.5" height="206.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <rect x="503.0" y="260" width="182.5" height="1" fill="var(--diagram-line,#aebbad)"/>
    <g transform="translate(503.0,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/><path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/><path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/><path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/><path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/><path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/></g>
    <text x="503.0" y="248.0" font-size="18" font-weight="600">封装复杂性</text>
    <text x="503.0" y="282.0" font-size="15" fill="var(--diagram-muted,#5c645d)">模块化设计：把系统分成相</text>
    <text x="503.0" y="304.0" font-size="15" fill="var(--diagram-muted,#5c645d)">对独立的模块，开发一个模</text>
    <text x="503.0" y="326.0" font-size="15" fill="var(--diagram-muted,#5c645d)">块时不必了解其他模块的细</text>
    <text x="503.0" y="348.0" font-size="15" fill="var(--diagram-muted,#5c645d)">节</text>
    <rect x="717.5" y="172.0" width="210.5" height="206.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <rect x="731.5" y="260" width="182.5" height="1" fill="var(--diagram-line,#aebbad)"/>
    <g transform="translate(731.5,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
    <text x="731.5" y="248.0" font-size="18" font-weight="600">持续重新设计</text>
    <text x="731.5" y="282.0" font-size="15" fill="var(--diagram-muted,#5c645d)">软件改起来容易，所以设计</text>
    <text x="731.5" y="304.0" font-size="15" fill="var(--diagram-muted,#5c645d)">贯穿整个生命周期；初始设</text>
    <text x="731.5" y="326.0" font-size="15" fill="var(--diagram-muted,#5c645d)">计几乎从来都不是最佳设计</text>
    <rect x="32.0" y="400.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="50.0" y="421.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="50.0" y="451.0" font-size="21" font-weight="600">复杂性限制了我们能造多大的系统；全书讲怎样在整个开发过程中认清、消除和封装它</text>
  </g>
</svg>
