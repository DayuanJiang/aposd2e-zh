<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 694" role="img" aria-labelledby="ch06-range-api-m-title ch06-range-api-m-desc">
  <title id="ch06-range-api-m-title">三個刪除動作，一種文字機制</title>
  <desc id="ch06-range-api-m-desc">教學文字 ABCDE 的游標在 C、D 之間，位置為 3。三條獨立演算：退格 [2,3) 得 ABDE；Delete [3,4) 得 ABCE；刪除選區 [1,4) 得 AE。UI 決定範圍，文字類統一執行。</desc>
  <rect width="360" height="694" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)" font-size="15">
    <text x="16" y="32" font-size="19" font-weight="600">三個刪除動作，一種文字機制</text>
    <text x="16" y="59" font-size="14" fill="var(--diagram-muted,#5c645d)">教學範例：位置在字元之間的間隙</text>
    <rect x="40" y="109" width="280" height="48" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-line,#aebbad)" />
    <path d="M96 109V157M152 109V157M264 109V157" stroke="var(--diagram-line,#aebbad)" />
    <g font-family="ui-monospace,monospace" font-size="20" text-anchor="middle"><text x="68" y="140">A</text><text x="124" y="140">B</text><text x="180" y="140">C</text><text x="236" y="140">D</text><text x="292" y="140">E</text></g>
    <g font-size="13" text-anchor="middle"><text x="40" y="96">0</text><text x="96" y="96">1</text><text x="152" y="96">2</text><text x="208" y="96">3</text><text x="264" y="96">4</text><text x="320" y="96">5</text></g>
    <path d="M208 106V166" stroke="var(--diagram-danger,#a03946)" stroke-width="3" />
    <text x="162" y="191" font-size="14">游標在 3</text>
    <path d="M16 210H344M16 317H344M16 424H344M16 531H344" stroke="var(--diagram-line,#aebbad)" />
    <text x="16" y="240" font-weight="600">退格：UI 決定刪除左側字元</text>
    <text x="16" y="273">[2, 3) → 刪除 C → ABDE</text><text x="16" y="298" font-size="14" fill="var(--diagram-muted,#5c645d)">起點是游標之前的位置</text>
    <text x="16" y="347" font-weight="600">Delete：UI 決定刪除右側字元</text>
    <text x="16" y="380">[3, 4) → 刪除 D → ABCE</text><text x="16" y="405" font-size="14" fill="var(--diagram-muted,#5c645d)">終點是游標之後的位置</text>
    <text x="16" y="454" font-weight="600">刪除選區：UI 提供兩端位置</text>
    <text x="16" y="487">[1, 4) → 刪除 BCD → AE</text><text x="16" y="512" font-size="14" fill="var(--diagram-muted,#5c645d)">文字類無需知道 Selection 型別</text>
    <rect x="16" y="550" width="328" height="78" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" />
    <text x="32" y="578" font-family="ui-monospace,monospace">delete(start, end)</text><text x="32" y="607">同一機制：含起點，不含終點</text>
    <text x="16" y="658" font-size="13" fill="var(--diagram-muted,#5c645d)">三條演算均從原始文字開始，不依次執行。</text>
    <text x="16" y="679" font-size="13" fill="var(--diagram-muted,#5c645d)">數字位置只是示意，不規定 Position 實作。</text>
  </g>
</svg>
