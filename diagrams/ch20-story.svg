<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 719" role="img" aria-labelledby="ch20-story-title ch20-story-desc">
  <title id="ch20-story-title">从又慢又复杂的 Buffer 代码，到快一倍且少两成代码</title>
  <desc id="ch20-story-desc">本章回顾。从又慢又复杂的 Buffer 代码，到快一倍且少两成代码。起点：平时开发时，该花多少心思在性能上？。逐条语句优化会拖慢开发；完全不管，系统可能慢 5 到 10 倍。作者的做法：了解哪些操作开销大，选自然高效又简单的方案，不需要有序就用哈希表，它比有序映射快得多。；问题：系统还是太慢？先测量，别凭直觉改。程序员对性能的直觉并不可靠，经验丰富的人也一样。先测量找出少数真正耗时的位置，同时建立基线；修改后再测一次，测不出差异就撤销修改，除非它让系统更简单。；做法：围绕关键路径设计：常见情况只做一次检查。先找根本性的改进，例如加缓存或换算法。找不到时，设想只为常见情况写一个方法，只含必须执行的最少代码；再找整洁的设计尽量接近它，开头一次检查排除所有特殊情况。；例子：Buffer 重构：一个方法、一次检查，快一倍，代码少 20%。旧的 alloc 经过三层浅方法，检查 6 个条件。新代码用一个变量 availableAppendBytes 覆盖三种特殊情况，只判断一次。追加 1 字节从 8.8 纳秒降到 4.75 纳秒，代码少了 20%。。这一章最想强调的：整洁的设计与高性能可以兼得：复杂的代码往往慢，因为它做了不必要或重复的工作 围绕关键路径重新设计是最后手段，不应经常采用；能加缓存或换算法这类根本性改进时，优先用它</desc>
