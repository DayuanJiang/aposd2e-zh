<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 887" role="img" aria-labelledby="ch11m-title ch11m-desc">
  <title id="ch11m-title">最先想到的設計，為什麼不該直接採用？</title>
  <desc id="ch11m-desc">本章概覽。最先想到的設計，為什麼不該直接採用？ 本章的主要部分：勾勒幾種方案：文字類可以按行、按單個字元或按任意範圍操作。挑差異大的方案，勾勒最重要的幾個方法就夠；列出各自的優缺點：先看高層軟體好不好用：按行介面讓介面自己拆行，按字元要寫迴圈；再比通用性和效率；比較後選擇或組合：比較之後更容易看出哪個最好：可能是其中一個，也可能把幾個方案的特點組合成更好的新設計；都不理想就再來一輪：按行和按字元都讓高層軟體自己做文字操作，是危險訊號；從這個問題出發找到範圍導向的介面。一句話：設計很難，第一個想法很少是最好的。每個主要決策都勾勒幾種差異大的方案，比較優缺點再選，花的時間遠少於實作</desc>
  <rect width="420" height="887" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch11m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">最先想到的設計，為什麼不該直接採</text>
    <text x="22.0" y="75.0" font-size="23" font-weight="600">用？</text>
    <text x="22.0" y="111.0" font-size="13" fill="var(--diagram-muted,#5c645d)">每個主要設計決策都走一遍：就算確定只有一種合理方案，也要</text>
    <text x="22.0" y="131.0" font-size="13" fill="var(--diagram-muted,#5c645d)">想第二種；先選介面，再選實作，更高層級也一樣</text>
    <rect x="22.0" y="149.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="175.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,167.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9" /><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z" /></g>
    <text x="74.0" y="180.0" font-size="18" font-weight="600">勾勒幾種方案</text>
    <text x="74.0" y="205.0" font-size="15" fill="var(--diagram-muted,#5c645d)">文字類可以按行、按單個字元或按任意範圍操</text>
    <text x="74.0" y="227.0" font-size="15" fill="var(--diagram-muted,#5c645d)">作。挑差異大的方案，勾勒最重要的幾個方法</text>
    <text x="74.0" y="249.0" font-size="15" fill="var(--diagram-muted,#5c645d)">就夠</text>
    <path d="M210.0 261.0 L210.0 277.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch11m-arrow)" />
    <rect x="22.0" y="285.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="311.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,303.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" /></g>
    <text x="74.0" y="316.0" font-size="18" font-weight="600">列出各自的優缺點</text>
    <text x="74.0" y="341.0" font-size="15" fill="var(--diagram-muted,#5c645d)">先看高層軟體好不好用：按行介面讓介面自己</text>
    <text x="74.0" y="363.0" font-size="15" fill="var(--diagram-muted,#5c645d)">拆行，按字元要寫迴圈；再比通用性和效率</text>
    <path d="M210.0 375.0 L210.0 391.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch11m-arrow)" />
    <rect x="22.0" y="399.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="425.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,417.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="M7 21h10" /><path d="M12 3v18" /><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" /></g>
    <text x="74.0" y="430.0" font-size="18" font-weight="600">比較後選擇或組合</text>
    <text x="74.0" y="455.0" font-size="15" fill="var(--diagram-muted,#5c645d)">比較之後更容易看出哪個最好：可能是其中一</text>
    <text x="74.0" y="477.0" font-size="15" fill="var(--diagram-muted,#5c645d)">個，也可能把幾個方案的特點組合成更好的新</text>
    <text x="74.0" y="499.0" font-size="15" fill="var(--diagram-muted,#5c645d)">設計</text>
    <path d="M210.0 511.0 L210.0 527.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch11m-arrow)" />
    <rect x="22.0" y="535.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="561.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,553.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></g>
    <text x="74.0" y="566.0" font-size="18" font-weight="600">都不理想就再來一輪</text>
    <text x="74.0" y="591.0" font-size="15" fill="var(--diagram-muted,#5c645d)">按行和按字元都讓高層軟體自己做文字操作，</text>
    <text x="74.0" y="613.0" font-size="15" fill="var(--diagram-muted,#5c645d)">是危險訊號；從這個問題出發找到範圍導向的</text>
    <text x="74.0" y="635.0" font-size="15" fill="var(--diagram-muted,#5c645d)">介面</text>
    <path d="M210.0 647.0 L210.0 663.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch11m-arrow)" />
    <text x="22.0" y="683.0" font-size="13" fill="var(--diagram-muted,#5c645d)">然後回到第一步，迴圈往復。找到滿意的設計就停下，再對下一</text>
    <text x="22.0" y="703.0" font-size="13" fill="var(--diagram-muted,#5c645d)">個決策（例如實作）做同樣的事。對一個類，這通常只需一兩個</text>
    <text x="22.0" y="723.0" font-size="13" fill="var(--diagram-muted,#5c645d)">小時，遠少於實作所需的幾天或幾周</text>
    <rect x="22.0" y="749.0" width="376.0" height="116.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="36.0" y="770.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="36.0" y="796.0" font-size="17" font-weight="600">設計很難，第一個想法很少是最好的。每個主</text>
    <text x="36.0" y="822.0" font-size="17" font-weight="600">要決策都勾勒幾種差異大的方案，比較優缺點</text>
    <text x="36.0" y="848.0" font-size="17" font-weight="600">再選，花的時間遠少於實作</text>
  </g>
</svg>
