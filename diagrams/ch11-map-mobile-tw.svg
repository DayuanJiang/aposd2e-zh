<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 601" role="img" aria-labelledby="ch11m-title ch11m-desc">
  <title id="ch11m-title">最先想到的設計，為什麼不該直接採用？</title>
  <desc id="ch11m-desc">本章概覽。最先想到的設計，為什麼不該直接採用？ 本章的主要部分：勾勒幾種方案：文字類按行、按字元或按範圍操作；列出優缺點：先看高層軟體好不好用，再比通用和效率；比較後選擇：選一個，或把幾個方案的特點組合；不理想就另想方案：順著發現的問題，找到範圍導向的介面。一句話：設計很難，最初想法很少是最好的；每個主要決策比較幾種方案再選，時間遠少於實作</desc>
  <rect width="420" height="601" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch11m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">最先想到的設計，為什麼不該直接</text>
    <text x="22.0" y="75.0" font-size="23" font-weight="600">採用？</text>
    <text x="22.0" y="111.0" font-size="13" fill="var(--diagram-muted,#5c645d)">挑差異大的方案；哪怕只有一種合理，也要想第二種</text>
    <rect x="22.0" y="129.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="155.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,147.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9" /><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z" /></g>
    <text x="74.0" y="160.0" font-size="18" font-weight="600">勾勒幾種方案</text>
    <text x="74.0" y="185.0" font-size="15" fill="var(--diagram-muted,#5c645d)">文字類按行、按字元或按範圍操作</text>
    <path d="M210.0 197.0 L210.0 213.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch11m-arrow)" />
    <rect x="22.0" y="221.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="247.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,239.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" /></g>
    <text x="74.0" y="252.0" font-size="18" font-weight="600">列出優缺點</text>
    <text x="74.0" y="277.0" font-size="15" fill="var(--diagram-muted,#5c645d)">先看高層軟體好不好用，再比通用和效率</text>
    <path d="M210.0 289.0 L210.0 305.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch11m-arrow)" />
    <rect x="22.0" y="313.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="339.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,331.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="M7 21h10" /><path d="M12 3v18" /><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" /></g>
    <text x="74.0" y="344.0" font-size="18" font-weight="600">比較後選擇</text>
    <text x="74.0" y="369.0" font-size="15" fill="var(--diagram-muted,#5c645d)">選一個，或把幾個方案的特點組合</text>
    <path d="M210.0 381.0 L210.0 397.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch11m-arrow)" />
    <rect x="22.0" y="405.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="431.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,423.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></g>
    <text x="74.0" y="436.0" font-size="18" font-weight="600">不理想就另想方案</text>
    <text x="74.0" y="461.0" font-size="15" fill="var(--diagram-muted,#5c645d)">順著發現的問題，找到範圍導向的介面</text>
    <rect x="22.0" y="489.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="36.0" y="510.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="36.0" y="536.0" font-size="17" font-weight="600">設計很難，最初想法很少是最好的；每個主</text>
    <text x="36.0" y="562.0" font-size="17" font-weight="600">要決策比較幾種方案再選，時間遠少於實作</text>
