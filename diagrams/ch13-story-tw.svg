<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 719" role="img" aria-labelledby="ch13-story-title ch13-story-desc">
  <title id="ch13-story-title">從只會重複程式碼的註解，到描述程式碼裡看不出的資訊</title>
  <desc id="ch13-story-desc">本章回顧。從只會重複程式碼的註解，到描述程式碼裡看不出的資訊。起點：許多註解在重複程式碼，讀者憑旁邊的程式碼就能寫出來。例如 // Add a horizontal scroll bar，或者介面註解只是把方法名和參數名拆成單字再拼成句子。這樣的註解沒有讓程式碼更易理解，也讓一些人認定註解毫無價值。；原則：有用的註解和程式碼的詳細程度不同：更低層級求精確，更高層級助理解。變數註解補上單位、邊界、空值含義、不變條件等細節。方法內部的註解省略細節，說明這段程式碼要做什麼、為什麼需要它，例如“把當前鍵雜湊追加到一個尚未傳送的 RPC”。；介面：介面註解定義抽象，與實作註解分開。IndexLookup 類的原註解寫了用到哪些 RPC 和私有設定參數，使用者並不需要知道；改寫後說明每個實例代表一次範圍查詢和怎樣呼叫它。介面註解若必須描述實作，這個方法就是淺的。；位置：實作註解說做什麼和為什麼；跨模組決策放在開發人員自然會看到的地方。每個主要程式碼塊前，用一句話說明它做什麼，修復缺陷的程式碼要說明為什麼。跨越多個類的決策，放在狀態列舉末尾這類必然會被看到的位置，或集中到 designNotes 檔案。。這一章最想強調的：註解應該描述從程式碼中不易看出的資訊；使用者只讀宣告和註解就能理解模組的抽象 哪些資訊不易看出，要站在第一次讀這段程式碼的人的角度判斷；審查者說難懂，那就是難懂</desc>
