<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1015" role="img" aria-labelledby="ch03-storym-title ch03-storym-desc">
  <title id="ch03-storym-title">从“先让它跑起来”到“好设计是今天要做的事”</title>
  <desc id="ch03-storym-desc">本章回顾。从“先让它跑起来”到“好设计是今天要做的事”。起点：战术式编程：先让功能跑起来。大多数程序员这样工作。为了更快完成当前任务，加一点复杂性、留一两处蹩脚实现，似乎都是合理的折衷。但每个任务都这样，复杂性就迅速累积。；代价：修补引来更多修补，很快一团糟。问题出现后，你告诉自己下个功能比重构更重要，于是快速修补，补丁又带来新问题。战术龙卷风产出最快，有些组织的管理层视其为英雄，留下的混乱却要别人清理。；转折：能工作的代码不够，目标是出色的设计。大多数代码都是在扩展现有代码时写的，最重要的工作是让未来的扩展更容易。主动投资：为新类多比较几种设计，写好文档。发现设计问题时花时间真正修复，也是投资。；做法：持续小额投资，几个月后收回成本。一次设计整个系统是瀑布式，行不通。持续投入起初慢一点，几个月后开发速度反超，省下的时间足够支持后续投资。初创公司也一样，战术式很可能也不能让首个产品更早发布。。这一章最想强调的：能工作的代码是不够的；把好设计当作今天要做的事，持续做小额投资 一旦开始把清理推迟到忙完这阵，就很容易一直拖下去；6 到 18 个月回本只是作者的个人估计，没有数据</desc>
