<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 578" role="img" aria-labelledby="ch10m-title ch10m-desc">
  <title id="ch10m-title">怎樣減少必須處理例外的地方？</title>
  <desc id="ch10m-desc">本章概覽。怎樣減少必須處理例外的地方？ 本章的主要部分：透過定義來規避：改一下操作的定義，就沒有錯誤可報；在底層處理掉：TCP 內部重發丟失的包，高層不必知道；頂層集中處理：多種例外傳到頂層，交給一個處理常式；讓程式崩潰：少見又難處理的錯誤，例如記憶體耗盡。一句話：最好重新定義讓錯誤不發生；規避不了的在底層處理掉或頂層集中處理；少見又難辦的讓程式崩潰</desc>
  <rect width="420" height="578" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch10m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">怎樣減少必須處理例外的地方？</text>
    <text x="22.0" y="80.0" font-size="13" fill="var(--diagram-muted,#5c645d)">按錯誤走多遠排列：頂部中止程式，底部根本不發生</text>
    <text x="22.0" y="112.0" font-size="16" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">從上到下</text>
    <rect x="22.0" y="128.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-warm-soft,#eae2cf)" />
    <circle cx="50.0" cy="154.0" r="14" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)" stroke-width="2" /><g transform="translate(42.0,146.0) scale(0.667)" fill="none" stroke="var(--diagram-warm,#80531b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18v-6a5 5 0 1 1 10 0v6" /><path d="M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z" /><path d="M21 12h1" /><path d="M18.5 4.5 18 5" /><path d="M2 12h1" /><path d="M12 2v1" /><path d="m4.929 4.929.707.707" /><path d="M12 12v6" /></g>
    <text x="74.0" y="159.0" font-size="18" font-weight="600">讓程式崩潰</text>
    <text x="74.0" y="184.0" font-size="15" fill="var(--diagram-muted,#5c645d)">少見又難處理的錯誤，例如記憶體耗盡</text>
    <rect x="22.0" y="204.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="230.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,222.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /></g>
    <text x="74.0" y="235.0" font-size="18" font-weight="600">頂層集中處理</text>
    <text x="74.0" y="260.0" font-size="15" fill="var(--diagram-muted,#5c645d)">多種例外傳到頂層，交給一個處理常式</text>
    <rect x="22.0" y="280.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="306.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,298.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /></g>
    <text x="74.0" y="311.0" font-size="18" font-weight="600">在底層處理掉</text>
    <text x="74.0" y="336.0" font-size="15" fill="var(--diagram-muted,#5c645d)">TCP 內部重發丟失的包，高層不必知道</text>
    <rect x="22.0" y="356.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="382.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,374.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></g>
    <text x="74.0" y="387.0" font-size="18" font-weight="600">透過定義來規避</text>
    <text x="74.0" y="412.0" font-size="15" fill="var(--diagram-muted,#5c645d)">改一下操作的定義，就沒有錯誤可報</text>
    <rect x="22.0" y="440.0" width="376.0" height="116.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="36.0" y="461.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="36.0" y="487.0" font-size="17" font-weight="600">最好重新定義讓錯誤不發生；規避不了的在</text>
    <text x="36.0" y="513.0" font-size="17" font-weight="600">底層處理掉或頂層集中處理；少見又難辦的</text>
    <text x="36.0" y="539.0" font-size="17" font-weight="600">讓程式崩潰</text>
  </g>
