    <text x="76.0" y="570.0" font-size="15">getCount 太籠統，numActiveIndexlets 讓人</text>
    <text x="76.0" y="593.0" font-size="15">不看文件就能猜到回傳什麼；同一用途始終用同</text>
    <text x="76.0" y="616.0" font-size="15">一個名稱，i 總用於外層迴圈；名稱裡的每個詞</text>
    <text x="76.0" y="639.0" font-size="15">都要提供資訊。短迴圈用 i、j 是合理的例外。</text>
    <circle cx="40.0" cy="701.0" r="18" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(31.0,692.0) scale(0.750)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="M7 21h10" /><path d="M12 3v18" /><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" /></g>
    <text x="76.0" y="689.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">分歧</text>
    <text x="76.0" y="713.0" font-size="18" font-weight="600">Go 風格偏愛單字母名，作者認為可讀性</text>
