<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1042" role="img" aria-labelledby="ch14-storym-title ch14-storym-desc">
  <title id="ch14-storym-title">從一個叫 block 的變數引出的六個月追查，到把命名當作投資</title>
  <desc id="ch14-storym-desc">本章回顧。從一個叫 block 的變數引出的六個月追查，到把命名當作投資。起點：Sprite 檔案系統偶爾把檔案的一個數據塊清零，追了六個月。變數 block 有時指磁碟上的物理塊號，有時指檔案中的邏輯塊號，某處把兩者用混了。幾個人讀過這段程式碼都沒發現：看到 block 被當作物理塊號，就本能地以為它確實是。；判斷：多數人拿最先想到、大致相符的名稱就用，作者認為這不夠。“塊”看起來並不糟，卻讓人花了大量時間追一個微妙的缺陷。好名稱要讓讀者在沒看到宣告和用法時，就能準確猜出它指什麼：突出最重要的特徵，省去次要細節。；做法：精確、一致、沒有多餘的詞。getCount 太籠統，numActiveIndexlets 讓人不看文件就能猜到回傳什麼；同一用途始終用同一個名稱，i 總用於外層迴圈；名稱裡的每個詞都要提供資訊。短迴圈用 i、j 是合理的例外。；分歧：Go 風格偏愛單字母名，作者認為可讀性應由讀者判斷。Go 演講認為長名稱模糊了程式碼的作用。作者讀單字母版本時得通讀程式碼才知道 n 是什麼，count 就不用；若系統裡 n 始終表示計數，短名也說得通。讀者抱怨含糊，就該改長。。這一章最想強調的：不要滿足於“大致相符”的名稱，多花一點時間選出準確、明確而直觀的名稱 這是一項投資：一開始會覺得費時，隨著經驗積累，幾乎不用多花時間就能選出好名稱</desc>
