<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 719" role="img" aria-labelledby="ch21-story-title ch21-story-desc">
  <title id="ch21-story-title">从一个接口该不该知道退格键，到什么是好品味</title>
  <desc id="ch21-story-desc">本章回顾。从一个接口该不该知道退格键，到什么是好品味。起点：文本类需要知道用户按了退格键吗？。文本类只需要知道要删除一段字符；调用者是因为退格还是别的原因并不重要。通用的插入删除接口解决很多问题，专用的退格方法只解决一个：收益更广的做法，往往更重要。；问题：两类错误：把太多事看成重要，或漏掉真正重要的事。Java 的 I/O 接口迫使开发人员区分缓冲与非缓冲，而这个区别几乎从来不重要，结果是浅类。没认出重要的事，则会隐藏重要信息或缺少重要功能，开发人员只能反复实现。；做法：重要的事要少，而且醒目、重复、处于核心地位。先减少要关注的事：构造对象少要参数、给默认值，异常在低层处理完。真正重要的，放进接口文档、名称、常用参数，让它反复出现，并处于核心地位，例如设备驱动接口。；结论：看不出什么重要时，先假设，再从结果中学。先提出“我认为这是最重要的”，据此构建系统看效果。对了，想想当时有什么线索；错了也没关系，想想哪些线索本可以避免这个选择。区分重要与不重要的能力，就是“好品味”。。这一章最想强调的：围绕重要的事设计系统：重要的加以强调，不重要的尽可能隐藏 这个想法也适用于写文档和生活：先确定几件最重要的事，把精力尽可能放在上面</desc>
