<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 790" role="img" aria-labelledby="ch09-cursor-state-m-t ch09-cursor-state-m-d">
  <title id="ch09-cursor-state-m-t">合併物件為何反而增加一次判斷？</title><desc id="ch09-cursor-state-m-d">有選區的組合表示需選擇端點，獨立的cursor Position則可直接讀取。下方分別展示無選區仍有游標，以及有選區時游標與端點重合。不規定空選區或哨兵編碼。</desc>
  <defs><marker id="ch09-cursor-state-m-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--diagram-muted,#58636b)" /></marker></defs>
  <rect width="360" height="790" fill="var(--diagram-bg,#f5f7f8)" />
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" fill="var(--diagram-ink,#263239)">
    <text x="20" y="32" font-size="18" font-weight="600">合併物件為何反而增加一次判斷？</text>
    <text x="20" y="74" font-weight="600">組合表示（這裡以有選區為例）</text>
    <rect x="20" y="94" width="320" height="46" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" /><text x="42" y="123">選區兩端 + 在哪端 + 有無選區</text>
    <path d="M180 141V161" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch09-cursor-state-m-a)" />
    <path d="M180 168 267 207 180 246 93 207Z" fill="var(--diagram-secondary-soft,#dce4ed)" /><text x="134" y="212">游標在哪端？</text>
    <g fill="none" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch09-cursor-state-m-a)"><path d="M93 207H62V283" /><path d="M267 207H300V283" /></g>
    <text x="77" y="266" font-size="13">起點端</text><text x="248" y="266" font-size="13">終點端</text>
    <g fill="var(--diagram-secondary-soft,#dce4ed)"><rect x="20" y="290" width="137" height="40" rx="4" /><rect x="203" y="290" width="137" height="40" rx="4" /></g><text x="64" y="316">取起點</text><text x="247" y="316">取終點</text>
    <path d="M20 355H340" stroke="var(--diagram-line,#aebbad)" />
    <text x="20" y="387" font-weight="600">分開：直接儲存游標位置</text>
    <rect x="20" y="407" width="320" height="62" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" /><text x="40" y="433">cursor: Position</text><text x="40" y="456" font-size="14">直接讀取，無需判斷在哪端</text>
    <text x="20" y="501" font-weight="600">無選區：游標仍存在</text>
    <g font-family="monospace" font-size="20"><text x="88" y="536">a</text><text x="120" y="536">b</text><text x="152" y="536">c</text><text x="184" y="536">d</text><text x="216" y="536">e</text><text x="248" y="536">f</text></g>
    <path d="M238 518V550" stroke="var(--diagram-secondary,#2c6096)" stroke-width="4" />
    <text x="20" y="588" font-weight="600">有選區：另用兩個 Position 表示範圍</text>
    <rect x="110" y="610" width="128" height="36" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <g font-family="monospace" font-size="20"><text x="88" y="636">a</text><text x="120" y="636">b</text><text x="152" y="636">c</text><text x="184" y="636">d</text><text x="216" y="636">e</text><text x="248" y="636">f</text></g>
    <path d="M110 606V654" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><path d="M238 602V658" stroke="var(--diagram-secondary,#2c6096)" stroke-width="4" />
    <text x="88" y="678" font-size="13">起點</text><text x="212" y="678" font-size="13">終點 / 游標</text>
    <text x="20" y="716" font-size="13" fill="var(--diagram-muted,#58636b)">有選區時游標仍在一端；高層仍分別操作兩者。</text><text x="20" y="740" font-size="13" fill="var(--diagram-muted,#58636b)">字母為教學示意；不規定無選區的編碼。</text><text x="20" y="764" font-size="13" fill="var(--diagram-muted,#58636b)">無需專用游標類或選區類，也不作效能結論。</text>
  </g>
</svg>
