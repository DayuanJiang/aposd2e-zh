<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 604" role="img" aria-labelledby="ch22-title ch22-desc">
  <title id="ch22-title">全书只讨论一件事，是什么？</title>
  <desc id="ch22-desc">本章概览。全书只讨论一件事，是什么？ 本章的主要部分：复杂性的根本原因：依赖性：改一处要连带改别处；模糊性：重要信息不容易被看到；识别不必要复杂性的危险信号：信息泄露、不必要的错误情况、过于笼统的名称；创建更简单系统的通用思路：设计深而通用的类，通过定义来规避错误，把接口文档和实现文档分开；投资思维：早期多花一些时间做设计，回报很快到来：模块反复被用，文档省下重读的时间，技能越练越快。一句话：复杂性：找到它的根源，用危险信号识别它，用深模块等思路减少它，并接受早期多投入的投资思维</desc>
  <rect width="960" height="604" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch22-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">全书只讨论一件事，是什么？</text>
    <text x="32.0" y="94.0" font-size="15" fill="var(--diagram-muted,#5c645d)">应对复杂性是软件设计最重要的挑战：它让系统难以构建和维护，也常常让系统运行缓慢</text>
    <rect x="32.0" y="114.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <g transform="translate(50.0,132.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></g>
    <text x="92.0" y="142.0" font-size="18" font-weight="600">投资思维</text>
    <text x="92.0" y="164.0" font-size="15" fill="var(--diagram-muted,#5c645d)">早期多花一些时间做设计，回报很快到来：模块反复被用，文档省下重读的时间，技能越练越快</text>
    <rect x="32.0" y="186.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <g transform="translate(50.0,204.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/><path d="m7.5 4.27 9 5.15"/></g>
    <text x="92.0" y="214.0" font-size="18" font-weight="600">创建更简单系统的通用思路</text>
    <text x="92.0" y="236.0" font-size="15" fill="var(--diagram-muted,#5c645d)">设计深而通用的类，通过定义来规避错误，把接口文档和实现文档分开</text>
    <rect x="32.0" y="258.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <g transform="translate(50.0,276.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></g>
    <text x="92.0" y="286.0" font-size="18" font-weight="600">识别不必要复杂性的危险信号</text>
    <text x="92.0" y="308.0" font-size="15" fill="var(--diagram-muted,#5c645d)">信息泄露、不必要的错误情况、过于笼统的名称</text>
    <rect x="32.0" y="330.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <g transform="translate(50.0,348.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g>
    <text x="92.0" y="358.0" font-size="18" font-weight="600">复杂性的根本原因</text>
    <text x="92.0" y="380.0" font-size="15" fill="var(--diagram-muted,#5c645d)">依赖性：改一处要连带改别处；模糊性：重要信息不容易被看到</text>
    <text x="928.0" y="416.0" font-size="13" fill="var(--diagram-muted,#5c645d)" text-anchor="end">从下到上：先弄清复杂性从哪来，再学会识别它、减少它，最后是坚持投入的心态</text>
    <text x="32.0" y="450.0" font-size="14" fill="var(--diagram-muted,#5c645d)">代价是项目早期要投入额外工作，学习设计技巧时进度也会慢一些；一旦掌握方法，好设计并不比草率的设计多花多少时间</text>
    <rect x="32.0" y="478.0" width="896.0" height="98.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="50.0" y="499.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="50.0" y="529.0" font-size="21" font-weight="600">复杂性：找到它的根源，用危险信号识别它，用深模块等思路减少它，并接受早期多投入的</text>
    <text x="50.0" y="559.0" font-size="21" font-weight="600">投资思维</text>
  </g>
</svg>
