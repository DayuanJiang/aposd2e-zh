    <text x="76.0" y="616.0" font-size="15">重讀程式碼、加新功能時省下時間。設計技能也</text>
    <text x="76.0" y="639.0" font-size="15">會隨經驗提升，做出好設計越來越快。</text>
    <circle cx="40.0" cy="701.0" r="18" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(31.0,692.0) scale(0.750)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></g>
    <text x="76.0" y="689.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">結論</text>
    <text x="76.0" y="713.0" font-size="18" font-weight="600">優秀的設計師把更多時間花在有趣的設</text>
    <text x="76.0" y="737.0" font-size="18" font-weight="600">計階段</text>
    <text x="76.0" y="763.0" font-size="15">設計是一個有趣的問題：怎樣用盡可能簡單的結</text>
    <text x="76.0" y="786.0" font-size="15">構解決特定問題。整潔、簡單、易理解的設計本</text>
    <text x="76.0" y="809.0" font-size="15">身就是美的。糟糕的設計師則把大部分時間花在</text>
    <text x="76.0" y="832.0" font-size="15">複雜而脆弱的程式碼裡追查缺陷。</text>
