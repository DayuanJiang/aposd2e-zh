<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 719" role="img" aria-labelledby="ch20-story-title ch20-story-desc">
  <title id="ch20-story-title">從又慢又複雜的 Buffer 程式碼，到快約一倍且少兩成程式碼</title>
  <desc id="ch20-story-desc">本章回顧。從又慢又複雜的 Buffer 程式碼，到快約一倍且少兩成程式碼。起點：平時開發時，該花多少心思在效能上？。逐條語句最佳化會拖慢開發；完全不管，系統可能慢 5 到 10 倍。作者的做法：瞭解哪些操作開銷大，選自然高效又簡單的方案，不需要有序就用雜湊表，它比有序對映快得多。；問題：系統還是太慢？先測量，別憑直覺改。程式設計師對效能的直覺並不可靠，經驗豐富的人也一樣。先測量找出少數真正耗時的位置，同時建立基線；修改後再測一次，測不出差異就撤銷修改，除非它讓系統更簡單。；做法：圍繞關鍵路徑設計：常見情況只做一次檢查。先找根本性的改進，如加快取或換演算法。找不到時，設想只為常見情況寫一個方法，只含必須執行的最少程式碼；再找整潔的設計儘量接近它，理想是開頭一次檢查排除所有特殊情況。；例子：Buffer 重構：一個方法、一次檢查，快約一倍，程式碼少 20%。舊的 alloc 經過三層淺方法，檢查 6 個條件。新程式碼用變數 availableAppendBytes 覆蓋三種特殊情況，只判斷一次。追加 1 位元組從 8.8 納秒降到 4.75 納秒，程式碼少 20%。。這一章最想強調的：整潔的設計與高效能可以兼得：複雜的程式碼往往慢，因為它做了不必要或重複的工作 圍繞關鍵路徑重新設計是最後手段，不應經常採用；能加快取或換演算法這類根本性改進時，優先用它</desc>
