<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" role="img" aria-labelledby="ch20-state-compression-title ch20-state-compression-desc">
  <title id="ch20-state-compression-title">先维护状态含义，每次正大小追加才可只比较一次</title>
  <desc id="ch20-state-compression-desc">C 是 availableAppendBytes 的简称。上部定义不变量：无末块、末块外部或无紧邻空间任一成立时 C 为零，否则为紧邻可用字节数。下部才是运行过程，读取已维护值；自拟例 C 为 8，追加正数 3 后写回 5，下一次请求 6 因 5 小于 6 不走快路径。不是每次重新计算上部条件，也不是性能数据。</desc>
  <defs><marker id="ch20-state-compression-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="680" height="590" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" fill="var(--diagram-ink,#303630)">
    <text x="24" y="33" font-size="21" font-weight="600">一次比较，依赖此前一直维护的状态</text>
    <text x="24" y="60" font-size="14">20.4 · C = availableAppendBytes；仅讨论 numBytes &gt; 0 且状态正确</text>
    <text x="24" y="97" font-weight="600">状态含义：不是每次 alloc 的计算流程</text>
    <text x="24" y="131">无末块</text><text x="24" y="158">末块是外部块</text><text x="24" y="185">无紧邻可用空间</text>
    <path d="M163 119H175V188H163" fill="none" stroke="var(--diagram-warm,#80531b)" stroke-width="2"/>
    <text x="193" y="140" font-size="14">任一成立</text><text x="193" y="164" font-size="14">OR</text>
    <text x="285" y="158" font-size="20" font-weight="600" fill="var(--diagram-warm,#80531b)">C = 0</text>
    <text x="427" y="131">否则：末块内部且有空间</text><text x="427" y="164" fill="var(--diagram-primary,#0b6f5d)">C = 紧邻可用字节数</text>
    <text x="24" y="216" font-size="14">改变块或空间的操作须维持这层含义；下面只展开一次成功追加的写回。</text>
    <path d="M24 236H656" stroke="var(--diagram-line,#aebbad)" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="24" y="266" font-weight="600">每次调用：读取已存值 → 正大小追加 → 写回</text>
    <text x="24" y="291" font-size="14">教学自拟容量状态：8、3、5、6 是字节数，不是耗时或加速比</text>
    <rect x="24" y="315" width="156" height="76" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)"/>
    <text x="102" y="345" text-anchor="middle">调用前已存</text><text x="102" y="373" text-anchor="middle" font-weight="600">C = 8</text>
    <rect x="254" y="315" width="164" height="76" rx="4" fill="none" stroke="var(--diagram-primary,#0b6f5d)"/>
    <text x="336" y="342" text-anchor="middle">请求 n = 3</text><text x="336" y="369" text-anchor="middle">8 ≥ 3，扩展末块</text>
    <rect x="492" y="315" width="164" height="76" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/>
    <text x="574" y="345" text-anchor="middle">写回 8 − 3</text><text x="574" y="373" text-anchor="middle" font-weight="600">C = 5</text>
    <g fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch20-state-compression-arrow)"><path d="M180 353H254"/><path d="M418 353H492"/><path d="M574 391V429"/></g>
    <text x="217" y="336" text-anchor="middle" font-size="14">读取</text><text x="455" y="336" text-anchor="middle" font-size="14">维护</text>
    <text x="24" y="434">同一次追加还更新末块长度与总长度。</text>
    <text x="574" y="456" text-anchor="middle">下一次请求 n = 6</text><text x="574" y="483" text-anchor="middle" fill="var(--diagram-warm,#80531b)">5 &lt; 6 → 特殊处理</text>
    <path d="M24 512H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="541" font-size="14">若漏写回而仍用 8，就会在这个例子中错误放行下一次 6 字节请求。</text>
    <text x="24" y="567" font-size="14">不推论零/负大小、溢出、分配失败或完整 Buffer 不变量。</text>
  </g>
</svg>
