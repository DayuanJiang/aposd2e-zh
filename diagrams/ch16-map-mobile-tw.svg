<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 643" role="img" aria-labelledby="ch16m-title ch16m-desc">
  <title id="ch16m-title">修改現有程式碼時，怎樣不讓複雜性積累？</title>
  <desc id="ch16m-desc">本章概覽。修改現有程式碼時，怎樣不讓複雜性積累？ 本章的主要部分：重新審視設計：面對這次變更，現有設計是否仍然最佳？；需要就重構：讓結構如同一開始就考慮了這次變更；同步更新註解：放在程式碼附近，每個決策儘量只記錄一次；提交前檢查：看一遍全部變更，確認註解準確反映改動。一句話：每次修改都保持戰略式思考：理想情況下，系統結構應如同一開始就考慮了這次變更，並更新註解</desc>
  <rect width="420" height="643" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch16m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">修改現有程式碼時，怎樣不讓複雜</text>
    <text x="22.0" y="75.0" font-size="23" font-weight="600">性積累？</text>
    <rect x="22.0" y="99.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="125.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,117.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z" /><circle cx="12" cy="12" r="10" /></g>
    <text x="74.0" y="130.0" font-size="18" font-weight="600">重新審視設計</text>
    <text x="74.0" y="155.0" font-size="15" fill="var(--diagram-muted,#5c645d)">面對這次變更，現有設計是否仍然最佳？</text>
    <path d="M210.0 167.0 L210.0 183.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch16m-arrow)" />
    <rect x="22.0" y="191.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="217.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,209.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" /></g>
    <text x="74.0" y="222.0" font-size="18" font-weight="600">需要就重構</text>
    <text x="74.0" y="247.0" font-size="15" fill="var(--diagram-muted,#5c645d)">讓結構如同一開始就考慮了這次變更</text>
    <path d="M210.0 259.0 L210.0 275.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch16m-arrow)" />
    <rect x="22.0" y="283.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="309.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,301.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9" /><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z" /></g>
    <text x="74.0" y="314.0" font-size="18" font-weight="600">同步更新註解</text>
    <text x="74.0" y="339.0" font-size="15" fill="var(--diagram-muted,#5c645d)">放在程式碼附近，每個決策儘量只記錄一次</text>
    <path d="M210.0 351.0 L210.0 367.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch16m-arrow)" />
    <rect x="22.0" y="375.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="401.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,393.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" /></g>
    <text x="74.0" y="406.0" font-size="18" font-weight="600">提交前檢查</text>
    <text x="74.0" y="431.0" font-size="15" fill="var(--diagram-muted,#5c645d)">看一遍全部變更，確認註解準確反映改動</text>
    <path d="M210.0 443.0 L210.0 459.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch16m-arrow)" />
    <text x="22.0" y="479.0" font-size="13" fill="var(--diagram-muted,#5c645d)">然後回到第一步，迴圈往復。</text>
    <rect x="22.0" y="505.0" width="376.0" height="116.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="36.0" y="526.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="36.0" y="552.0" font-size="17" font-weight="600">每次修改都保持戰略式思考：理想情況下，</text>
    <text x="36.0" y="578.0" font-size="17" font-weight="600">系統結構應如同一開始就考慮了這次變更，</text>
    <text x="36.0" y="604.0" font-size="17" font-weight="600">並更新註解</text>
  </g>
</svg>
