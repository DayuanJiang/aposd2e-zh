<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 719" role="img" aria-labelledby="ch07-story-title ch07-story-desc">
  <title id="ch07-story-title">從一個幾乎全是透傳方法的類，到每一層都提供不同的抽象</title>
  <desc id="ch07-story-desc">本章回顧。從一個幾乎全是透傳方法的類，到每一層都提供不同的抽象。起點：學生的文字編輯器裡，一個類 15 個方法有 13 個只是轉調另一個類。TextDocument 的 insertString 只是把參數交給 TextArea 的同名方法。這樣的方法增加了介面卻沒有增加功能，還在兩個類之間建立了依賴：下層改簽名，上層也得改。；判斷：問一句：這兩個類各自負責什麼？。透傳方法說明兩個類的職責劃分不清：插入文字的介面在 TextDocument，實作卻全在 TextArea。介面和實作應放在同一個類裡。學生把三個類調整成兩個，透傳方法就消失了。；推廣：同樣的問題還會出現在裝飾器、類的介面與實作、透傳變數上。為加緩衝單獨包一層 BufferedInputStream，樣板多、方法淺；文字內部按行儲存，介面就照搬按行，類就不深；證書參數從 main 一路傳到 m3，中間方法都得知道它。；做法：讓每個設計元素都消除比它自身更多的複雜性。緩衝直接加進基礎類；介面字元導向，拆行拼行封裝在文字類內部；全域狀態放進上下文物件，只經建構函式傳遞。簽名相同也可以：分發器和同一介面的多種實作都提供了新功能。。這一章最想強調的：每個介面、參數或類都會增加複雜性，只有消除更多複雜性時才值得引入 透傳方法、層層包裝的裝飾器和透傳變數都沒透過這個檢驗；上下文物件也遠非理想，是作者目前找到的最好辦法</desc>
