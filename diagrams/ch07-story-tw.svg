    <text x="118.0" y="160.0" font-size="15">TextDocument 的 insertString 只是把參數交給 TextArea 的同名方法。這樣的方法增加了介面卻沒有增加功能，還在</text>
    <text x="118.0" y="183.0" font-size="15">兩個類之間建立了依賴：下層改簽名，上層也得改。</text>
