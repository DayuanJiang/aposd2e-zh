    <text x="118.0" y="380.0" font-size="19" font-weight="600">同樣的問題還會出現在裝飾器、類的介面與實作、透傳變數上</text>
    <text x="118.0" y="406.0" font-size="15">為加緩衝單獨包一層 BufferedInputStream，樣板多、方法淺；文字內部按行儲存，介面就照搬按行，類就不深；證書參</text>
    <text x="118.0" y="429.0" font-size="15">數從 main 一路傳到 m3，中間方法都得知道它。</text>
    <circle cx="74.0" cy="491.0" r="22" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(63.0,480.0) scale(0.917)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" /></g>
    <text x="118.0" y="479.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">做法</text>
    <text x="118.0" y="503.0" font-size="19" font-weight="600">讓每個設計元素都消除比它自身更多的複雜性</text>
    <text x="118.0" y="529.0" font-size="15">緩衝直接加進基礎類；介面字元導向，拆行拼行封裝在文字類內部；全域狀態放進上下文物件，只經建構函式傳遞。簽名相</text>
    <text x="118.0" y="552.0" font-size="15">同也可以：分發器和同一介面的多種實作都提供了新功能。</text>
    <rect x="32.0" y="590.0" width="896.0" height="101.0" rx="12" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <g transform="translate(50.0,610.0) scale(1.000)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" /><line x1="4" x2="4" y1="22" y2="15" /></g>
    <text x="92.0" y="618.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">這一章最想強調的</text>
    <text x="92.0" y="644.0" font-size="20" font-weight="600">每個介面、參數或類都會增加複雜性，只有消除更多複雜性時才值得引入</text>
