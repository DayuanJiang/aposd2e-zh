<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1066" role="img" aria-labelledby="ch22-storym-title ch22-storym-desc">
  <title id="ch22-storym-title">从一本只讨论复杂性的书，到把更多时间用在有趣的设计上</title>
  <desc id="ch22-storym-desc">本章回顾。从一本只讨论复杂性的书，到把更多时间用在有趣的设计上。起点：全书只讨论一件事：复杂性。复杂性让系统难以构建和维护，也常常让它运行缓慢。全书讲了它的根源，例如依赖性和模糊性；识别它的危险信号，例如信息泄露；减少它的思路，例如深而通用的类和通过定义来规避错误。；代价：代价：项目早期要多投入，学的时候进度更慢。如果唯一关心的是让当前代码尽快正常工作，思考设计就会显得是额外负担，妨碍了真正的目标。作者承认这一点：还不习惯思考设计时，进度确实会慢一些。；转折：回报很快到来：好设计并不比草率的设计多花多少时间。项目开始时精心定义的模块，会在后续反复使用时省下时间；六个月前写下的清晰文档，会在你重读代码、加新功能时省下时间。设计技能也会随经验提升，做出好设计越来越快。；结论：优秀的设计师把更多时间花在有趣的设计阶段。设计是一个有趣的问题：怎样用尽可能简单的结构解决特定问题。整洁、简单、易理解的设计本身就是美的。糟糕的设计师则把大部分时间花在复杂而脆弱的代码里追查缺陷。。这一章最想强调的：应对复杂性是软件设计中最重要的挑战；对良好设计的投入很快就会得到回报 提高设计技能后，你能更快开发出更高质量的软件，也能更享受开发的过程</desc>
