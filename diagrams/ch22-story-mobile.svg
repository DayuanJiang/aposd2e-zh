    <text x="76.0" y="639.0" font-size="15">随经验提升，做出好设计越来越快。</text>
    <circle cx="40.0" cy="701.0" r="18" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(31.0,692.0) scale(0.750)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></g>
    <text x="76.0" y="689.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">结论</text>
    <text x="76.0" y="713.0" font-size="18" font-weight="600">优秀的设计师把更多时间花在有趣的设计</text>
    <text x="76.0" y="737.0" font-size="18" font-weight="600">阶段</text>
    <text x="76.0" y="763.0" font-size="15">设计是一个有趣的问题：怎样用尽可能简单的结</text>
    <text x="76.0" y="786.0" font-size="15">构解决特定问题。整洁、简单、易理解的设计本</text>
    <text x="76.0" y="809.0" font-size="15">身就是美的。糟糕的设计师则把大部分时间花在</text>
    <text x="76.0" y="832.0" font-size="15">复杂而脆弱的代码里追查缺陷。</text>
