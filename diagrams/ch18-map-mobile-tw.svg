<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 493" role="img" aria-labelledby="ch18m-title ch18m-desc">
  <title id="ch18m-title">什麼讓程式碼難理解，什麼讓它易理解？</title>
  <desc id="ch18m-desc">本章概覽。什麼讓程式碼難理解，什麼讓它易理解？ 本章的主要部分：難理解：讀者缺少資訊；易理解：把資訊交給讀者。一句話：寫程式碼時多花幾分鐘，讀者就能快速讀懂：靠好名稱、一致性、空格和註解，避開 Pair 這類通用容器</desc>
  <rect width="420" height="493" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch18m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">什麼讓程式碼難理解，什麼讓它易</text>
    <text x="22.0" y="75.0" font-size="23" font-weight="600">理解？</text>
    <text x="22.0" y="111.0" font-size="13" fill="var(--diagram-muted,#5c645d)">是否易理解，由讀者判斷</text>
    <rect x="22.0" y="129.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-danger-soft,#ead9dc)" />
    <circle cx="50.0" cy="155.0" r="14" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" stroke-width="2" /><g transform="translate(42.0,147.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" /><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" /><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" /><path d="m2 2 20 20" /></g>
    <text x="74.0" y="160.0" font-size="18" font-weight="600">讓讀者缺少資訊</text>
    <text x="74.0" y="185.0" font-size="15" fill="var(--diagram-muted,#5c645d)">Pair 的兩個值只能叫 getKey、getValue；</text>
    <text x="74.0" y="207.0" font-size="15" fill="var(--diagram-muted,#5c645d)">看不出事件處理函式何時呼叫；main 回傳</text>
    <text x="74.0" y="229.0" font-size="15" fill="var(--diagram-muted,#5c645d)">後，RaftClient 的執行緒仍在執行</text>
    <rect x="22.0" y="249.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="275.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,267.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></g>
    <text x="74.0" y="280.0" font-size="18" font-weight="600">把資訊交給讀者</text>
    <text x="74.0" y="305.0" font-size="15" fill="var(--diagram-muted,#5c645d)">名稱精確，不必通讀程式碼去猜；做法一致，</text>
    <text x="74.0" y="327.0" font-size="15" fill="var(--diagram-muted,#5c645d)">見過的模式就懂；註解補上缺少的資訊</text>
    <rect x="22.0" y="355.0" width="376.0" height="116.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="36.0" y="376.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="36.0" y="402.0" font-size="17" font-weight="600">寫程式碼時多花幾分鐘，讀者就能快速讀懂：</text>
    <text x="36.0" y="428.0" font-size="17" font-weight="600">靠好名稱、一致性、空格和註解，避開 Pair</text>
    <text x="36.0" y="454.0" font-size="17" font-weight="600">這類通用容器</text>
  </g>
</svg>
