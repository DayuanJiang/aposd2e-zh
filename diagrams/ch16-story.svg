<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 842" role="img" aria-labelledby="ch16-story-title ch16-story-desc">
  <title id="ch16-story-title">从“最少改哪些代码”的心态，到每次修改都改善设计</title>
  <desc id="ch16-story-desc">本章回顾。从“最少改哪些代码”的心态，到每次修改都改善设计。起点：修复缺陷或加功能时，典型心态是“最少需要改动哪些代码”。开发人员对要改的代码没有把握，担心改动越大风险越大。但每次最小改动都会加进一些特殊情况和依赖，设计就变差一点；系统每演进一步，问题就多积累一些。；主张：理想情况下，每次修改完成后，系统结构都应如同一开始就考虑了这次变更。面对变更先问现有设计是否仍然最佳，需要就重构。作者承认期限紧迫时，可能只能用两小时的修补代替三个月的重构；但要问自己在当前限制下是否已做到最好。；位置：注释放在开发人员修改代码时最容易看到的地方。接口注释紧靠方法体，改方法时就能看到并更新；实现注释放到各阶段代码正上方。变更的微妙原因若只写在提交消息里，后人可能撤销它而重新引入缺陷，所以要写进代码。；去重：每个设计决策只记录一次，其他地方用一句话指向它。影响多处的变量行为写在声明旁；找不到自然位置就集中到 designNotes 文件，代码里一句注释指过去。HTTP 协议、用户手册里已有的内容，附上引用即可。；收尾：提交前检查一遍变更；更高层级的注释更容易维护。提交之前，花几分钟确认文档准确反映了每项变更，也能顺带发现遗留的调试代码。比代码更抽象的注释只在整体行为变化时才需要更新，最有用的注释往往也最容易维护。。这一章最想强调的：修改现有代码时也要战略式思考：如果没有让设计变好，你就很可能正在让它变坏 确保注释及时更新的最佳方法，是把它放在所描述的代码附近，并且每个设计决策只记录一次</desc>
