    <text x="76.0" y="616.0" font-size="15">明每個實例代表一次範圍查詢和怎樣呼叫它。接</text>
    <text x="76.0" y="639.0" font-size="15">口註解若必須描述實作，這個方法就是淺的。</text>
    <circle cx="40.0" cy="701.0" r="18" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(31.0,692.0) scale(0.750)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8" /><path d="M12 3v3" /><path d="M18 6a2 2 0 0 1 1.387.56l2.307 2.22a1 1 0 0 1 0 1.44l-2.307 2.22A2 2 0 0 1 18 13H6a2 2 0 0 1-1.387-.56l-2.306-2.22a1 1 0 0 1 0-1.44l2.306-2.22A2 2 0 0 1 6 6z" /></g>
    <text x="76.0" y="689.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">位置</text>
    <text x="76.0" y="713.0" font-size="18" font-weight="600">實作註解說做什麼和為什麼；跨模組決策</text>
    <text x="76.0" y="737.0" font-size="18" font-weight="600">放在開發人員自然會看到的地方</text>
