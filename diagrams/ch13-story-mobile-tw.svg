    <text x="76.0" y="401.0" font-size="15">變數註解補上單位、邊界、空值含義、不變條件等</text>
    <text x="76.0" y="424.0" font-size="15">細節。方法內部的註解省略細節，說明這段程式碼</text>
    <text x="76.0" y="447.0" font-size="15">要做什麼、為什麼需要它，例如“把當前鍵雜湊</text>
    <text x="76.0" y="470.0" font-size="15">追加到一個尚未傳送的 RPC”。</text>
    <circle cx="40.0" cy="532.0" r="18" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(31.0,523.0) scale(0.750)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" /><path d="M12 22V12" /><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7" /><path d="m7.5 4.27 9 5.15" /></g>
