<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 641" role="img" aria-labelledby="ch10-unset-semantics-m-t ch10-unset-semantics-m-d">
  <title id="ch10-unset-semantics-m-t">改变成功条件，而不是忽略失败</title><desc id="ch10-unset-semantics-m-d">上方原定义的两种初态分别产生成功和错误；下方建议语义的两种初态汇合到变量不存在且成功返回。</desc>
  <defs><marker id="ch10-unset-semantics-m-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--diagram-muted,#58636b)"/></marker></defs>
  <rect width="360" height="641" fill="var(--diagram-bg,#f5f7f8)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" fill="var(--diagram-ink,#263239)">
    <text x="20" y="32" font-size="18" font-weight="600">改变成功条件，而不是忽略失败</text><text x="20" y="74" font-weight="600">原定义：删除变量</text>
    <g fill="var(--diagram-secondary-soft,#dce4ed)"><circle cx="91" cy="132" r="36"/><circle cx="269" cy="132" r="36"/></g><text x="76" y="137">存在</text><text x="247" y="137">不存在</text>
    <g stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch10-unset-semantics-m-a)"><path d="M91 169V220"/><path d="M269 169V220"/></g><text x="112" y="200" font-size="13">删除</text><text x="285" y="200" font-size="13">报错</text>
    <rect x="20" y="227" width="142" height="63" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)"/><text x="62" y="252">不存在</text><text x="62" y="277">成功返回</text>
    <rect x="198" y="227" width="142" height="63" rx="4" fill="var(--diagram-danger-soft,#ead9dc)"/><text x="231" y="252">抛出错误</text><text x="214" y="277" font-size="14">调用者 catch</text>
    <path d="M20 316H340" stroke="var(--diagram-line,#aebbad)"/>
    <text x="20" y="349" font-weight="600">作者建议：确保变量不存在</text>
    <g fill="var(--diagram-secondary-soft,#dce4ed)"><circle cx="91" cy="406" r="36"/><circle cx="269" cy="406" r="36"/></g><text x="76" y="411">存在</text><text x="247" y="411">不存在</text>
    <g fill="none" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch10-unset-semantics-m-a)"><path d="M91 443V479L150 511"/><path d="M269 443V479L210 511"/></g><text x="22" y="471" font-size="13">执行删除</text><text x="281" y="471" font-size="13">无需操作</text>
    <rect x="20" y="518" width="320" height="59" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)"/><text x="74" y="553">变量不存在，成功返回</text>
    <text x="20" y="608" font-size="13" fill="var(--diagram-muted,#58636b)">Tcl 原设计与作者建议的语义对照。</text><text x="20" y="631" font-size="13" fill="var(--diagram-muted,#58636b)">不表示现有 unset 已按建议改变。</text>
  </g>
</svg>
