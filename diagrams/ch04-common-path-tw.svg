<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 550" role="img" aria-labelledby="ch04-common-path-title ch04-common-path-desc">
  <title id="ch04-common-path-title">有選擇，不等於每次都要選擇</title>
  <desc id="ch04-common-path-desc">教學檔案 ABCDEF。假設每次讀取成功取得兩個位元組。先讀 AB 後位置為 2；普通分支直接再讀 CD，位置變為 4。特殊分支先 lseek 到 4，再讀 EF，位置變為 6。本例不是呼叫語法，不要求先 read 才能 lseek。預設 Java 緩衝是作者建議。</desc>
  <defs><marker id="ch04-common-path-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="var(--diagram-muted,#5c645d)" /></marker></defs>
  <rect width="680" height="550" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="var(--diagram-ink,#303630)">
    <text x="24" y="34" font-size="20" font-weight="600">有選擇，不等於每次都要選擇</text>
    <text x="24" y="61" font-size="14" fill="var(--diagram-muted,#5c645d)">教學序列：檔案 ABCDEF；假設每次 read 成功取得 2 位元組</text>
    <text x="24" y="117">位元組偏移</text>
    <rect x="186" y="103" width="288" height="41" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-line,#aebbad)" />
    <path d="M234 103V144M282 103V144M330 103V144M378 103V144M426 103V144" stroke="var(--diagram-line,#aebbad)" />
    <g text-anchor="middle" font-family="ui-monospace,monospace"><text x="210" y="128">A</text><text x="258" y="128">B</text><text x="306" y="128">C</text><text x="354" y="128">D</text><text x="402" y="128">E</text><text x="450" y="128">F</text></g>
    <g text-anchor="middle" font-size="13"><text x="210" y="94">0</text><text x="258" y="94">1</text><text x="306" y="94">2</text><text x="354" y="94">3</text><text x="402" y="94">4</text><text x="450" y="94">5</text></g>
    <rect x="168" y="165" width="344" height="47" rx="4" fill="none" stroke="var(--diagram-secondary,#2c6096)" /><text x="186" y="194">已讀取 AB：當前位置從 0 到 2</text>
    <g fill="none" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch04-common-path-arrow)"><path d="M255 220V255H160V286" /><path d="M425 220V255H520V277" /></g>
    <text x="24" y="259" font-weight="600">順序繼續</text><text x="548" y="259" font-weight="600">選擇跳轉</text>
    <rect x="24" y="299" width="280" height="100" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" />
    <text x="42" y="329">直接 read：從位置 2 讀取</text><text x="42" y="359" font-weight="600">回傳 CD；下一位置 4</text><text x="42" y="386" font-size="14">不必瞭解 lseek</text>
    <rect x="376" y="290" width="280" height="42" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" /><text x="394" y="317">lseek：將當前位置 2 改為 4</text>
    <path d="M520 340V360" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch04-common-path-arrow)" />
    <rect x="376" y="371" width="280" height="58" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" /><text x="394" y="396">read 回傳 EF；下一位置 6</text><text x="394" y="418" font-size="13">這次 read 從跳轉後的 4 開始</text>
    <text x="24" y="460" font-size="14">這只是一個例子：lseek 不要求此前先 read，也未畫完整呼叫語法。</text>
    <text x="24" y="490" font-size="14">Java 緩衝：預設啟用是作者建議，不是書中所示 API 的行為。</text>
    <text x="24" y="526" font-size="13" fill="var(--diagram-muted,#5c645d)">忽略短讀、錯誤與 EOF 處理；選擇能力保留，但普通路徑不經過它。</text>
  </g>
</svg>
