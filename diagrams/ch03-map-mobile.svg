<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 572" role="img" aria-labelledby="ch03m-title ch03m-desc">
  <title id="ch03m-title">能工作的代码，为什么还不够？</title>
  <desc id="ch03m-desc">本章概览。能工作的代码，为什么还不够？ 本章的主要部分：战术式编程：只求尽快让代码工作，每次添一点复杂性，很快一团糟；战略式编程：把好设计当主要目标，持续投入 10% 到 20% 的时间。一句话：只求代码能跑会累积复杂性；持续投入 10% 到 20% 的时间做设计，几个月后更快</desc>
  <rect width="420" height="572" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch03m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">能工作的代码，为什么还不够？</text>
    <text x="22.0" y="80.0" font-size="13" fill="var(--diagram-muted,#5c645d)">大多数程序员用战术式思维写代码：先让它跑起来。作者主张换</text>
    <text x="22.0" y="100.0" font-size="13" fill="var(--diagram-muted,#5c645d)">成战略式：主要目标是好的设计，同时让代码能工作</text>
    <rect x="22.0" y="118.0" width="376.0" height="132.0" rx="9" fill="var(--diagram-danger-soft,#ead9dc)"/>
    <circle cx="50.0" cy="144.0" r="14" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" stroke-width="2"/><g transform="translate(42.0,136.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g>
    <text x="74.0" y="149.0" font-size="18" font-weight="600">战术式：先让它跑起来</text>
    <text x="74.0" y="174.0" font-size="15" fill="var(--diagram-muted,#5c645d)">有截止期限，不花时间找最佳设计；加点复杂</text>
    <text x="74.0" y="196.0" font-size="15" fill="var(--diagram-muted,#5c645d)">性、留个蹩脚实现，觉得没什么；问题出现后</text>
    <text x="74.0" y="218.0" font-size="15" fill="var(--diagram-muted,#5c645d)">快速修补，补丁越打越多；战术龙卷风：产出</text>
    <text x="74.0" y="240.0" font-size="15" fill="var(--diagram-muted,#5c645d)">最快，留下的混乱要别人清理</text>
    <rect x="22.0" y="260.0" width="376.0" height="132.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <circle cx="50.0" cy="286.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,278.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/><circle cx="12" cy="12" r="10"/></g>
    <text x="74.0" y="291.0" font-size="18" font-weight="600">战略式：好设计是主要目标</text>
    <text x="74.0" y="316.0" font-size="15" fill="var(--diagram-muted,#5c645d)">能工作的代码是不够的，最重要的是长期结</text>
    <text x="74.0" y="338.0" font-size="15" fill="var(--diagram-muted,#5c645d)">构；主动投资：新类多比较几种设计，写好文</text>
    <text x="74.0" y="360.0" font-size="15" fill="var(--diagram-muted,#5c645d)">档；被动投资：发现设计问题就真正修复；总</text>
    <text x="74.0" y="382.0" font-size="15" fill="var(--diagram-muted,#5c645d)">开发时间的 10% 到 20% 用于投资</text>
    <text x="22.0" y="414.0" font-size="13" fill="var(--diagram-muted,#5c645d)">技术债：现在快一点，以后一直慢；作者估计 6 到 18 个月能收回</text>
    <text x="22.0" y="434.0" font-size="13" fill="var(--diagram-muted,#5c645d)">投资，但他说明这只是个人意见，没有数据支持</text>
    <rect x="22.0" y="460.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="36.0" y="481.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="36.0" y="507.0" font-size="17" font-weight="600">只求代码能跑会累积复杂性；持续投入 10% 到</text>
    <text x="36.0" y="533.0" font-size="17" font-weight="600">20% 的时间做设计，几个月后更快</text>
  </g>
</svg>
