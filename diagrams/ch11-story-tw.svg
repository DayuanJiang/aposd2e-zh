<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 842" role="img" aria-labelledby="ch11-story-title ch11-story-desc">
  <title id="ch11-story-title">從直接實作第一個想法，到給每個主要決策想兩種以上方案</title>
  <desc id="ch11-story-desc">本章回顧。從直接實作第一個想法，到給每個主要決策想兩種以上方案。起點：給文字編輯器設計文字類：別急著採用最先想到的方案。設計很難，最初的想法不太可能就是最佳設計。文字類的介面至少有三種：按行、按單個字元、按任意範圍操作。勾勒最重要的幾個方法就夠，方案之間差異越大，學到的越多。；比較：列出優缺點：按行和按字元的介面，都讓高層軟體做額外的工作。按行介面下，剪下貼上跨行內容要介面自己拆行合併；按字元介面下，改多個字元要寫迴圈，還可能慢很多，因為每個字元都要呼叫一次。還要比介面是否更簡單、更通用。；轉折：都不理想？以發現的問題為起點，再想新方案。兩種方案都讓高層軟體自己做文字操作，這是危險訊號：既然有了文字類，它就該處理所有文字操作。順著這個問題找，就得到範圍導向的介面。最佳選擇也可能是幾個方案的組合。；做法：每個主要決策都設計兩次：介面一次，實作一次，更高層級也一樣。實作階段再比一輪：行的連結串列、固定大小的字元塊、間隙緩衝區，這時最看重簡單和效能。對一個類，這可能只要一兩個小時，遠少於實作的幾天幾周，還能提高設計能力。；提醒：聰明人有時反而更難接受設計兩次。他們習慣了第一個想法就足夠好，嘗試多種設計好像就等於承認自己不聰明。作者的看法：大型軟體系統的設計真的很難，沒有人能靠第一次嘗試就做好，這與是否聰明無關。。這一章最想強調的：在每個主要設計決策上都考慮多個方案，最初的想法很少是最好的 花的時間遠少於實作；對一個類可能只需一兩個小時，很可能換來明顯更好的設計，還能提高設計能力</desc>
