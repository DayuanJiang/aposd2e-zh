<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 734" role="img" aria-labelledby="ch07-line-boundary-title ch07-line-boundary-desc">
  <title id="ch07-line-boundary-title">按行存储，不必按行暴露</title>
  <desc id="ch07-line-boundary-desc">教学逻辑字符序列 ABcd、换行 NL、efGH 中，start 在 B 与 c 间，end 在 f 与 G 间，删去 cd、NL、ef，保留 AB 和 GH。两种设计的行存储都在文本模块侧，从行1 ABcd、行2 efGH 变为行1 ABGH。行接口将取行、拼接、回写暴露给 UI；范围接口只接收删除区间并在内部拼接。</desc>
  <defs><marker id="ch07-line-boundary-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="680" height="734" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="var(--diagram-ink,#303630)">
    <text x="24" y="34" font-size="20" font-weight="600">按行存储，不必按行暴露</text>
    <text x="24" y="61" font-size="14" fill="var(--diagram-muted,#5c645d)">教学文本与位置；NL 是换行记号，不规定编码或 Position 的实现</text>
    <text x="152" y="103" font-size="14">start (S)</text><text x="424" y="103" font-size="14">end (E)</text>
    <rect x="36" y="121" width="108" height="45" fill="var(--diagram-secondary-soft,#dce4ed)"/><rect x="144" y="121" width="270" height="45" fill="var(--diagram-danger-soft,#ead9dc)"/><rect x="414" y="121" width="108" height="45" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <g font-family="ui-monospace,monospace" font-size="20" text-anchor="middle"><text x="63" y="150">A</text><text x="117" y="150">B</text><text x="171" y="150">c</text><text x="225" y="150">d</text><text x="279" y="150">NL</text><text x="333" y="150">e</text><text x="387" y="150">f</text><text x="441" y="150">G</text><text x="495" y="150">H</text></g>
    <path d="M144 111V176M414 111V176" stroke="var(--diagram-warm,#80531b)" stroke-width="2"/>
    <path d="M155 142H402" stroke="var(--diagram-danger,#a03946)" stroke-width="2"/>
    <text x="548" y="149" font-family="ui-monospace,monospace" font-size="21">ABGH</text>
    <text x="24" y="202" font-size="14">划掉 [S,E) 中的 cd、NL、ef；保留两端 AB 与 GH。</text>
    <path d="M340 248V679" stroke="var(--diagram-line,#aebbad)" stroke-dasharray="5 4"/>
    <text x="24" y="240" font-weight="600">行接口：UI 处理拆分和拼接</text>
    <text x="24" y="271" font-weight="600">UI 调用点</text><text x="379" y="271" font-weight="600">文本模块：按行存储</text>
    <rect x="379" y="287" width="277" height="62" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)"/>
    <text x="395" y="310">前：行 1　ABcd</text><text x="426" y="337">行 2　efGH</text>
    <text x="24" y="310" font-family="ui-monospace,monospace">getLine(...)</text><path d="M170 304H367" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch07-line-boundary-arrow)"/>
    <text x="24" y="345" font-family="ui-monospace,monospace">ABcd / efGH</text><path d="M367 339H167" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch07-line-boundary-arrow)"/>
    <text x="24" y="377">UI 保留并拼接 AB + GH</text>
    <text x="24" y="410">putLine 级回写等</text><path d="M188 404H367" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch07-line-boundary-arrow)"/>
    <rect x="379" y="379" width="277" height="49" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/><text x="395" y="409">后：行 1　ABGH</text>
    <text x="24" y="448" font-size="13">同类 UI 调用点可能重复这些工作；交互仅示职责，不规定操作次数。</text>
    <path d="M24 467H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="498" font-weight="600">范围接口：UI 只提供 S、E</text>
    <rect x="379" y="517" width="277" height="62" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)"/>
    <text x="395" y="541">前：行 1　ABcd</text><text x="426" y="567">行 2　efGH</text>
    <text x="24" y="550" font-family="ui-monospace,monospace">delete(S, E)</text><path d="M170 544H367" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch07-line-boundary-arrow)"/>
    <path d="M514 587V615" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch07-line-boundary-arrow)"/>
    <text x="535" y="607" font-size="13">内部拼接</text>
    <rect x="379" y="627" width="277" height="49" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/><text x="395" y="657">后：行 1　ABGH</text>
    <text x="24" y="604">不接收行内容，</text><text x="24" y="632">不再自行拆行、合行。</text>
    <text x="24" y="712" font-size="13" fill="var(--diagram-muted,#5c645d)">两种设计的存储都在右侧且仍按行；省略删除旧行等细节，非完整编辑算法。</text>
  </g>
</svg>
