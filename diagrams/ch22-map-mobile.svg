<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 582" role="img" aria-labelledby="ch22m-title ch22m-desc">
  <title id="ch22m-title">全书只讨论一件事，是什么？</title>
  <desc id="ch22m-desc">本章概览。全书只讨论一件事，是什么？ 本章的主要部分：根本原因：依赖性：牵连别处；模糊性：信息不显眼；危险信号：信息泄露、不必要的错误情况等；减少复杂性的思路：深而通用的类，通过定义来规避错误；投资思维：早期多花时间做设计，回报很快到来。一句话：复杂性：找到根源，用危险信号识别它，用深模块等思路减少它，坚持投资思维</desc>
  <rect width="420" height="582" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch22m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">全书只讨论一件事，是什么？</text>
    <text x="22.0" y="80.0" font-size="13" fill="var(--diagram-muted,#5c645d)">应对复杂性是软件设计最重要的挑战</text>
    <text x="22.0" y="112.0" font-size="16" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">从上到下</text>
    <rect x="22.0" y="128.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <circle cx="50.0" cy="154.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,146.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></g>
    <text x="74.0" y="159.0" font-size="18" font-weight="600">投资思维</text>
    <text x="74.0" y="184.0" font-size="15" fill="var(--diagram-muted,#5c645d)">早期多花时间做设计，回报很快到来</text>
    <rect x="22.0" y="204.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <circle cx="50.0" cy="230.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,222.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/><path d="m7.5 4.27 9 5.15"/></g>
    <text x="74.0" y="235.0" font-size="18" font-weight="600">减少复杂性的思路</text>
    <text x="74.0" y="260.0" font-size="15" fill="var(--diagram-muted,#5c645d)">深而通用的类，通过定义来规避错误</text>
    <rect x="22.0" y="280.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <circle cx="50.0" cy="306.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,298.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></g>
    <text x="74.0" y="311.0" font-size="18" font-weight="600">危险信号</text>
    <text x="74.0" y="336.0" font-size="15" fill="var(--diagram-muted,#5c645d)">信息泄露、不必要的错误情况等</text>
    <rect x="22.0" y="356.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <circle cx="50.0" cy="382.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,374.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g>
    <text x="74.0" y="387.0" font-size="18" font-weight="600">根本原因</text>
    <text x="74.0" y="412.0" font-size="15" fill="var(--diagram-muted,#5c645d)">依赖性：牵连别处；模糊性：信息不显眼</text>
    <text x="22.0" y="444.0" font-size="13" fill="var(--diagram-muted,#5c645d)">阅读顺序：先根源，再识别和减少，最后是投入的心态</text>
    <rect x="22.0" y="470.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="36.0" y="491.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="36.0" y="517.0" font-size="17" font-weight="600">复杂性：找到根源，用危险信号识别它，用</text>
    <text x="36.0" y="543.0" font-size="17" font-weight="600">深模块等思路减少它，坚持投资思维</text>
  </g>
</svg>
