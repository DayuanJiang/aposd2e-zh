    <text x="118.0" y="257.0" font-size="19" font-weight="600">变更放大、认知负荷、未知的未知</text>
    <text x="118.0" y="283.0" font-size="15">改横幅颜色要逐页修改；用某个 C 函数得记住释放它分配的内存；改了中心变量，却不知道哪些页面还单独写了强调</text>
