    <text x="118.0" y="380.0" font-size="19" font-weight="600">两个根源：依赖性和模糊性</text>
    <text x="118.0" y="406.0" font-size="15">依赖性：改一段代码，得顾及甚至修改别的代码，例如方法加了参数，所有调用都要改。模糊性：重要信息不明</text>
