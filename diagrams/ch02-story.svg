    <text x="118.0" y="110.0" font-size="12" font-weight="600" fill="var(--diagram-secondary,#2c6096)">起点</text>
    <text x="118.0" y="134.0" font-size="19" font-weight="600">复杂性：让系统难以理解和修改的因素</text>
    <text x="118.0" y="160.0" font-size="15">软件系统结构中，任何让系统难以理解和修改的因素都是复杂性。它和规模、功能多少没有必然联系，小系统也可能很</text>
    <text x="118.0" y="183.0" font-size="15">复杂。读者比作者更容易察觉复杂性。</text>
