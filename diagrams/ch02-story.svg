<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 719" role="img" aria-labelledby="ch02-story-title ch02-story-desc">
  <title id="ch02-story-title">从改一个横幅颜色要改数千个页面，到复杂性的两个根源</title>
  <desc id="ch02-story-desc">本章回顾。从改一个横幅颜色要改数千个页面，到复杂性的两个根源。起点：复杂性：让系统难以理解和修改的因素。软件系统结构中，任何让系统难以理解和修改的因素都是复杂性。它和规模、功能多少没有必然联系，小系统也可能很复杂。读者比作者更容易察觉复杂性。；症状：变更放大、认知负荷、未知的未知。改横幅颜色要逐页修改；用某个 C 函数得记住释放它分配的内存；改了中心变量，却不知道哪些页面还单独写了强调色。最后一种最糟，你连该改哪里都不知道。；根源：两个根源：依赖性和模糊性。依赖性：改一段代码，得顾及甚至修改别的代码，例如方法加了参数，所有调用都要改。模糊性：重要信息不明显，例如变量叫 time 却没说单位。；结论：复杂性是一点点积累出来的。单个依赖或一处模糊，本身影响不大。麻烦的是每个人对每次修改都觉得这一点没什么大不了，成百上千个小问题积累后，每次修改都会碰到好几个，也很难再消除。。这一章最想强调的：复杂性来自依赖性和模糊性的积累，让修改现有代码变得困难而危险 依赖无法完全消除，目标是让它更少、更简单、更明显；把复杂性隔离到不必接触的地方，几乎等于消除</desc>
