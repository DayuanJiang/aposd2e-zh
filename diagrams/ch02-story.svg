    <g transform="translate(50.0,610.0) scale(1.000)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></g>
    <text x="92.0" y="618.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">这一章最想强调的</text>
    <text x="92.0" y="644.0" font-size="20" font-weight="600">复杂性来自依赖性和模糊性的积累，让修改现有代码变得困难而危险</text>
    <text x="92.0" y="670.0" font-size="15" fill="var(--diagram-muted,#5c645d)">依赖无法完全消除，目标是让它更少、更简单、更明显；把复杂性隔离到不必接触的地方，几乎等于消除</text>
