    <text x="118.0" y="479.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">结论</text>
    <text x="118.0" y="503.0" font-size="19" font-weight="600">复杂性是一点点积累出来的</text>
    <text x="118.0" y="529.0" font-size="15">单个依赖或一处模糊，本身影响不大。麻烦的是每个人对每次修改都觉得这一点没什么大不了，成百上千个小问题积累</text>
    <text x="118.0" y="552.0" font-size="15">后，每次修改都会碰到好几个，也很难再消除。</text>
