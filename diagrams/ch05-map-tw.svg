<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 454" role="img" aria-labelledby="ch05-title ch05-desc">
  <title id="ch05-title">模組裡該藏什麼，洩露了怎麼看出來？</title>
  <desc id="ch05-desc">本章概覽。模組裡該藏什麼，洩露了怎麼看出來？ 本章的主要部分：資訊洩露：同一設計決策出現在多個模組，改一處就得改多處；資訊隱藏：設計決策只在一個模組的實作裡，介面更簡單，改動只影響這一個模組。一句話：每個模組封裝一些設計決策，不讓別的模組看到；同一項知識出現在多處，就是洩露</desc>
  <rect width="960" height="454" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch05-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">模組裡該藏什麼，洩露了怎麼看出來？</text>
    <text x="32.0" y="94.0" font-size="15" fill="var(--diagram-muted,#5c645d)">每個模組應封裝一些設計決策，只放在實作裡；同一項知識出現在多個模組，就是洩露，改一處就得改多處</text>
    <rect x="32.0" y="114.0" width="418.0" height="192.0" rx="12" fill="var(--diagram-danger-soft,#ead9dc)" />
    <g transform="translate(52.0,132.0) scale(1.083)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></g>
    <text x="88.0" y="152.0" font-size="20" font-weight="600">資訊洩露：同一知識散在多處</text>
    <g transform="translate(52.0,176.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></g>
    <text x="76.0" y="189.0" font-size="15">讀檔案和寫檔案兩個類都懂同一種檔案格式</text>
    <g transform="translate(52.0,206.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></g>
    <text x="76.0" y="219.0" font-size="15">先讀請求、再解析請求，拆成兩個類</text>
    <g transform="translate(52.0,236.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></g>
    <text x="76.0" y="249.0" font-size="15">getParams 直接交出內部的參數對映</text>
    <g transform="translate(52.0,266.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></g>
    <text x="76.0" y="279.0" font-size="15">讓呼叫者自己填 HTTP 響應版本號</text>
    <rect x="510.0" y="114.0" width="418.0" height="192.0" rx="12" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <g transform="translate(530.0,132.0) scale(1.083)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>
    <text x="566.0" y="152.0" font-size="20" font-weight="600">資訊隱藏：知識只在一處</text>
    <g transform="translate(530.0,176.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></g>
    <text x="554.0" y="189.0" font-size="15">檔案格式的知識只放在一個類裡</text>
    <g transform="translate(530.0,206.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></g>
    <text x="554.0" y="219.0" font-size="15">讀取和解析合併成一個類，只需呼叫一個方法</text>
    <g transform="translate(530.0,236.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></g>
    <text x="554.0" y="249.0" font-size="15">getParameter 按名字取值，藏住內部表示</text>
    <g transform="translate(530.0,266.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></g>
    <text x="554.0" y="279.0" font-size="15">響應版本、日期標頭由 HTTP 類自動填好</text>
    <path d="M462.0 210.0 L498.0 210.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch05-arrow)" />
    <text x="480.0" y="196.0" font-size="13" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">改為</text>
    <text x="32.0" y="330.0" font-size="14" fill="var(--diagram-muted,#5c645d)">時間順序分解（按先做什麼後做什麼拆類）是洩露的常見原因；隱藏有限度，模組外部確實需要的資訊必須公開</text>
    <rect x="32.0" y="358.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="50.0" y="379.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="50.0" y="409.0" font-size="21" font-weight="600">每個模組封裝一些設計決策，不讓別的模組看到；同一項知識出現在多處，就是洩露</text>
  </g>
</svg>
