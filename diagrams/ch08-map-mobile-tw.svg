    <text x="74.0" y="405.0" font-size="18" font-weight="600">別做過頭</text>
    <text x="74.0" y="430.0" font-size="15" fill="var(--diagram-muted,#5c645d)">與本類功能密切相關，簡化別處和介面</text>
    <rect x="22.0" y="458.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="36.0" y="479.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="36.0" y="505.0" font-size="17" font-weight="600">與模組功能相關的複雜性，通常由模組內部</text>
    <text x="36.0" y="531.0" font-size="17" font-weight="600">處理：多費一點力氣，讓使用者少費些力氣</text>
