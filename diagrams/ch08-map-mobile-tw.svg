    <text x="74.0" y="221.0" font-size="18" font-weight="600">先問一句</text>
    <text x="74.0" y="246.0" font-size="15" fill="var(--diagram-muted,#5c645d)">這份複雜性和模組提供的功能有關嗎</text>
