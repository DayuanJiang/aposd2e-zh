<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1280" role="img" aria-labelledby="ch19-storym-title ch19-storym-desc">
  <title id="ch19-storym-title">從繼承到 Getter：流行趨勢是否真的降低複雜性</title>
  <desc id="ch19-storym-desc">本章回顧。從繼承到 Getter：流行趨勢是否真的降低複雜性。起點：每種趨勢只問一個問題：它有助於降低複雜性嗎？。物件導向、敏捷、單元測試、測試驅動開發、設計模式、Getter 和 Setter，作者逐一用本書的原則評估。許多提案表面上聽起來不錯，深入研究後有些反而增加複雜性。；繼承：介面繼承降低複雜性，實作繼承要謹慎。同一個 I/O 介面既能讀寫磁碟檔案也能透過網路套接字通訊，實作越多介面越深。實作繼承讓父類和子類共享實例變數，改一處可能要連帶檢查其他類；先考慮用輔助類組合。；測試：單元測試讓開發人員敢於重構，作者堅決擁護。沒有測試套件，重大結構調整很危險，開發人員往往會避免重構。Tcl 把直譯器換成位元組碼編譯器時，現有單元測試非常有效地找出了新引擎的缺陷，alpha 版釋出後只發現一個。；風險：敏捷和測試驅動開發都容易變成戰術式程式設計。敏捷把注意力集中在功能上，推遲設計決策；測試驅動開發忙於讓下一個測試通過，沒有明確的時機做設計。增量開發通常是好主意，但增量應是抽象；修缺陷時先寫測試則很合理。；過度：設計模式和 Getter、Setter：好方法也會被過度使用。適合的設計模式往往比自己從頭設計更整潔；如果自己的方案更整潔，就不要硬套。Getter 和 Setter 是通常只有一行的淺方法，讓類介面雜亂；最好一開始就避免公開實例變數。。這一章最想強調的：遇到新的開發範式，都從複雜性的角度審視：它真的有助於降低大型系統的複雜性嗎 許多提案表面上聽起來不錯，深入研究後有些反而增加複雜性；一種方法是好方法，並不意味著用得越多越好</desc>
