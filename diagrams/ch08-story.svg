<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 719" role="img" aria-labelledby="ch08-story-title ch08-story-desc">
  <title id="ch08-story-title">从把难题推给调用者，到模块自己多费一点力气</title>
  <desc id="ch08-story-desc">本章回顾。从把难题推给调用者，到模块自己多费一点力气。起点：遇到难处理的情况，最省事的是抛异常，或者做成配置参数。拿不准就抛异常，定不了策略就做成配置参数。开发人员轻松了，但每个调用者都得处理那个异常，每个部署的管理员都得学那些参数：一个人的问题变成了许多人的问题。；例子：文本类按行提供接口，用户界面只能自己拆行拼行。按键输入要在一行中间插入一个字符，删除所选区域会改动几行的一部分。面向行的接口让文本类的实现很简单，却把拆分和连接行的工作推给了每一处用到它的界面代码。；转折：下沉复杂性：接口面向字符，拆行拼行封装在文本类内部。界面能直接插入、删除任意范围的文本，文本类内部多做拆行拼行，整体复杂性下降。配置参数同理：网络协议按实际响应时间自己算重试间隔，条件变了还会自动调整。；界限：别做过头：退格键的逻辑放进文本类，是信息泄露。下沉要与类的现有功能密切相关，还要能简化其他部分和类的接口。退格键属于用户界面的知识，与文本类的核心功能无关，放进去对高层代码帮助不大，反而造成信息泄露。。这一章最想强调的：与模块功能相关的复杂性，通常应在模块内部处理；接口简单比实现简单更重要 前提是这份复杂性与类的功能密切相关，且能简化其他部分和接口；像退格键那样下沉，只会造成信息泄露</desc>
