<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 553" role="img" aria-labelledby="ch21-exposure-decision-title ch21-exposure-decision-desc">
  <title id="ch21-exposure-decision-title">以普通檔案匯出呼叫者為參照區分必要資訊和日常設定</title>
  <desc id="ch21-exposure-decision-desc">自擬契約中 finish 成功前輸出可能仍不完整。匯出後需要讀取結果的呼叫者若知道契約，可等 finish 成功再讀；若只知道 write 而過早讀取，可能讀到不完整內容。普通匯出通常可預設緩衝，不必每次指定；特殊需求仍可顯式控制，資訊必要性取決於呼叫者和場景。</desc>
  <defs><marker id="ch21-exposure-decision-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#5c645d)" /></marker></defs>
  <rect width="680" height="553" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" fill="var(--diagram-ink,#303630)">
    <text x="24" y="33" font-size="21" font-weight="600">對這位呼叫者，什麼資訊不能隱藏？</text><text x="24" y="60" font-size="14">21.2–21.4 · 場景：普通檔案匯出，隨後讀取結果</text>
    <text x="24" y="88" font-size="14">教學自擬契約：finish() 成功回傳後，輸出才保證完整可讀；不是 Java API。</text>
    <text x="290" y="130" text-anchor="middle" font-weight="600">介面顯露</text><text x="547" y="130" text-anchor="middle" font-weight="600">內部隱藏</text>
    <text x="24" y="204">需要知道</text><text x="24" y="231">何時可讀</text>
    <rect x="169" y="148" width="240" height="168" fill="var(--diagram-primary-soft,#d6e5dc)" /><rect x="423" y="148" width="233" height="168" fill="var(--diagram-danger-soft,#ead9dc)" />
    <text x="185" y="178">知道 finish() 的完成契約</text><text x="185" y="210">等待 finish() 成功</text>
    <path d="M289 221V247" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch21-exposure-decision-arrow)" /><text x="185" y="272">再讀取完整輸出</text><text x="185" y="301" font-size="14">動作依賴的事實可見</text>
    <text x="439" y="178">只知道 write()，不知完成點</text><text x="439" y="210">寫後立即讀取</text>
    <path d="M539 221V247" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch21-exposure-decision-arrow)" /><text x="439" y="272">可能讀到不完整內容</text><text x="439" y="301" font-size="14">必要事實被隱藏</text>
    <text x="24" y="374">普通匯出</text><text x="24" y="401">的緩衝選擇</text><text x="24" y="430" font-size="14">通常可預設</text>
    <rect x="169" y="332" width="240" height="126" fill="var(--diagram-danger-soft,#ead9dc)" /><rect x="423" y="332" width="233" height="126" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="185" y="362">每次顯式指定</text><text x="185" y="393" font-family="ui-monospace,monospace">buffered = true</text><text x="185" y="430">日常反覆做相同設定</text>
    <text x="439" y="362">預設使用緩衝</text><text x="439" y="393">常規呼叫無需設定</text><text x="439" y="430" font-size="14">不是取消所有控制入口</text>
    <path d="M155 116V467M155 324H656" stroke="var(--diagram-line,#aebbad)" />
    <text x="24" y="493">有不同需求的呼叫者仍可顯式選擇模式；必要性隨場景而變。</text>
    <text x="24" y="524" font-size="14">finish 契約不聲稱磁碟永續性；預設緩衝依據作者對多數呼叫者的論述。</text>
  </g>
</svg>
