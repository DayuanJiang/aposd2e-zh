<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 550" role="img" aria-labelledby="ch01-two-levers-title ch01-two-levers-desc">
  <title id="ch01-two-levers-title">消除规则，还是隔离规则？</title>
  <desc id="ch01-two-levers-desc">教学对照。相同含义的 size 和 length 统一后，命名区别消失。另一组对照中，R 格式识别和 D 解码在封装前属于调用者，封装后同样的 R、D 属于文件模块，调用者使用 load(file)。两种手段可以并用，没有规定顺序。</desc>
  <defs><marker id="ch01-two-levers-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="680" height="550" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="var(--diagram-ink,#303630)">
    <text x="24" y="34" font-size="20" font-weight="600">消除规则，还是隔离规则？</text>
    <text x="24" y="61" font-size="14" fill="var(--diagram-muted,#5c645d)">教学示例：比较“知识消失”与“同一知识改变归属”</text>
    <text x="24" y="99" font-weight="600">消除命名区别：此例中两个名称含义相同</text>
    <rect x="24" y="117" width="280" height="54" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)"/>
    <rect x="376" y="117" width="280" height="54" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/>
    <text x="44" y="150" font-family="ui-monospace,monospace">size / length</text><text x="396" y="150" font-family="ui-monospace,monospace">length</text>
    <path d="M315 144H365" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch01-two-levers-arrow)"/>
    <text x="24" y="198" font-size="14">原有的命名区别不再需要记忆。</text>
    <path d="M24 218H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="248" font-weight="600">封装前</text><text x="376" y="248" font-weight="600">封装后：R、D 仍然存在</text>
    <rect x="24" y="265" width="280" height="169" rx="4" fill="none" stroke="var(--diagram-secondary,#2c6096)"/>
    <text x="42" y="293" font-weight="600">调用者边界</text>
    <rect x="42" y="308" width="244" height="42" fill="var(--diagram-secondary-soft,#dce4ed)"/><text x="58" y="335">R　识别格式</text>
    <rect x="42" y="365" width="244" height="42" fill="var(--diagram-primary-soft,#d6e5dc)"/><text x="58" y="392">D　解码</text>
    <rect x="376" y="265" width="280" height="67" rx="4" fill="none" stroke="var(--diagram-secondary,#2c6096)"/>
    <text x="394" y="290" font-weight="600">调用者边界</text><text x="394" y="316" font-family="ui-monospace,monospace">load(file)</text>
    <path d="M516 338V360" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch01-two-levers-arrow)"/><text x="535" y="355" font-size="13">调用</text>
    <rect x="376" y="371" width="280" height="108" rx="4" fill="none" stroke="var(--diagram-primary,#0b6f5d)"/>
    <text x="394" y="396" font-weight="600">文件模块边界</text>
    <rect x="394" y="407" width="244" height="28" fill="var(--diagram-secondary-soft,#dce4ed)"/><text x="410" y="427">R　识别格式</text>
    <rect x="394" y="443" width="244" height="28" fill="var(--diagram-primary-soft,#d6e5dc)"/><text x="410" y="463">D　解码</text>
    <text x="24" y="508" font-weight="600">两种手段可以并用；本章没有规定先后顺序。</text>
    <text x="24" y="534" font-size="13" fill="var(--diagram-muted,#5c645d)">封装并未消除实现知识，也不意味着模块间没有依赖。</text>
  </g>
</svg>
