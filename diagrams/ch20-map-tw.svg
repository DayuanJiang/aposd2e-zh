<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img" aria-labelledby="ch20-title ch20-desc">
  <title id="ch20-title">追求高效能，設計還能保持整潔嗎？</title>
  <desc id="ch20-desc">本章概覽。追求高效能，設計還能保持整潔嗎？ 本章的主要部分：速度：常見操作執行得多快；整潔：程式碼多容易讀懂；先測量：找出耗時的少數位置；關鍵路徑：常見情況的最少程式碼。一句話：可以兼得：平時選自然高效的簡單設計；確實太慢時先測量，再圍繞關鍵路徑重新設計</desc>
  <rect width="960" height="448" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch20-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">追求高效能，設計還能保持整潔嗎？</text>
