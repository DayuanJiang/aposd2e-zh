    <text x="134.0" y="316.0" font-size="13" fill="var(--diagram-muted,#5c645d)">慢</text>
    <text x="850.0" y="316.0" font-size="13" fill="var(--diagram-muted,#5c645d)" text-anchor="end">快</text>
    <g transform="translate(30.0,82.0) scale(0.917)" fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></g>
    <text x="58.0" y="99.0" font-size="16" font-weight="600">整潔：程式碼多容易讀懂</text>
    <text x="112.0" y="286.0" font-size="13" fill="var(--diagram-muted,#5c645d)" text-anchor="end">複雜</text>
    <text x="112.0" y="126.0" font-size="13" fill="var(--diagram-muted,#5c645d)" text-anchor="end">簡單</text>
    <circle cx="182.0" cy="256.0" r="24" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(168.0,242.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z" /><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12" /><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17" /></g>
