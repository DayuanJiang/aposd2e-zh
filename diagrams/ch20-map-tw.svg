    <text x="721.0" y="222.0" font-size="18" font-weight="600">關鍵路徑</text>
    <text x="721.0" y="246.0" font-size="15" fill="var(--diagram-muted,#5c645d)">常見情況的最少程式碼</text>
    <rect x="32.0" y="352.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
