    <text x="118.0" y="479.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">做法</text>
    <text x="118.0" y="503.0" font-size="19" font-weight="600">让每个设计元素都消除比它自身更多的复杂性</text>
    <text x="118.0" y="529.0" font-size="15">缓冲直接加进基础类；接口面向字符，拆行拼行封装在文本类内部；全局状态放进上下文对象，只经构造函数传递。签</text>
    <text x="118.0" y="552.0" font-size="15">名相同也可以：分发器和同一接口的多种实现都提供了新功能。</text>
    <rect x="32.0" y="590.0" width="896.0" height="101.0" rx="12" fill="var(--diagram-primary-soft,#d6e5dc)"/>
