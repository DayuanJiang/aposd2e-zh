    <text x="118.0" y="160.0" font-size="15">TextDocument 的 insertString 只是把参数交给 TextArea 的同名方法。这样的方法增加了接口却没有增加功能，还</text>
    <text x="118.0" y="183.0" font-size="15">在两个类之间建立了依赖：下层改签名，上层也得改。</text>
