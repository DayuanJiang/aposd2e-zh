    <text x="92.0" y="618.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">这一章最想强调的</text>
    <text x="92.0" y="644.0" font-size="20" font-weight="600">应对复杂性是软件设计中最重要的挑战；对良好设计的投入很快就会得到回报</text>
