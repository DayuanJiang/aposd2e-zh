    <text x="118.0" y="233.0" font-size="12" font-weight="600" fill="var(--diagram-warm,#80531b)">代价</text>
    <text x="118.0" y="257.0" font-size="19" font-weight="600">代价：项目早期要多投入，学的时候进度更慢</text>
    <text x="118.0" y="283.0" font-size="15">如果唯一关心的是让当前代码尽快正常工作，思考设计就会显得是额外负担，妨碍了真正的目标。作者承认这一点：还不习</text>
