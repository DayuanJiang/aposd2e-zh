    <text x="118.0" y="380.0" font-size="19" font-weight="600">回报很快到来：好设计并不比草率的设计多花多少时间</text>
    <text x="118.0" y="406.0" font-size="15">项目开始时精心定义的模块，会在后续反复使用时省下时间；六个月前写下的清晰文档，会在你重读代码、加新功能时省下</text>
    <text x="118.0" y="429.0" font-size="15">时间。设计技能也会随经验提升，做出好设计越来越快。</text>
    <circle cx="74.0" cy="491.0" r="22" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(63.0,480.0) scale(0.917)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></g>
    <text x="118.0" y="479.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">结论</text>
    <text x="118.0" y="503.0" font-size="19" font-weight="600">优秀的设计师把更多时间花在有趣的设计阶段</text>
    <text x="118.0" y="529.0" font-size="15">设计是一个有趣的问题：怎样用尽可能简单的结构解决特定问题。整洁、简单、易理解的设计本身就是美的。糟糕的设计师</text>
    <text x="118.0" y="552.0" font-size="15">则把大部分时间花在复杂而脆弱的代码里追查缺陷。</text>
