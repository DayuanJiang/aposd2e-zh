    <text x="118.0" y="110.0" font-size="12" font-weight="600" fill="var(--diagram-secondary,#2c6096)">起点</text>
    <text x="118.0" y="134.0" font-size="19" font-weight="600">全书只讨论一件事：复杂性</text>
    <text x="118.0" y="160.0" font-size="15">复杂性让系统难以构建和维护，也常常让它运行缓慢。全书讲了它的根源，例如依赖性和模糊性；识别它的危险信号，例如</text>
    <text x="118.0" y="183.0" font-size="15">信息泄露；减少它的思路，例如深而通用的类和通过定义来规避错误。</text>
