<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1233" role="img" aria-labelledby="ch09-storym-title ch09-storym-desc">
  <title id="ch09-storym-title">从“越小越简单”的直觉，到按复杂性决定组合还是分开</title>
  <desc id="ch09-storym-desc">本章回顾。从“越小越简单”的直觉，到按复杂性决定组合还是分开。起点：把系统切成很多小组件，每个看起来都更简单，但细分本身有代价。组件多了更难掌握和查找，接口跟着变多；可能要额外代码管理多个对象；原本挨着的代码被分到不同类甚至不同文件，看不到彼此的依赖；还可能出现重复。；判断：四个相关的迹象：共享信息、一起使用、概念重叠、不看一段就读不懂另一段。读取和解析 HTTP 请求都得懂请求格式，合并后代码更短；文件流默认带缓冲，多数用户不必知道它。“一起使用”要双向成立：块缓存总要用哈希表，哈希表的用途却多得多，应分开。；反例：两次判断失误：光标和所选区域合成一个对象，日志语句拆成单独的类。光标和所选区域合成一个对象后，高层代码仍要分别操作，实现还多了一个布尔值，分开更简单。每条日志只在一处调用，却被拆成单行方法加大段注释，读者要两头来回跳。；分歧：作者与《代码整洁之道》的分歧：方法该多短？。《代码整洁之道》主张函数应该非常短，十行都太长。作者同意短函数通常更易懂，但缩到几十行后继续缩，改善有限；函数太小会失去独立性，成为必须一起读的连体函数。；结论：拆或合，都以复杂性为依据。选择能提供最好的信息隐藏、最少的依赖和最深接口的结构。方法先做到够深，再尽量缩短到易读，不要为了长度牺牲深度。。这一章最想强调的：拆分或组合的依据是复杂性：最好的信息隐藏、最少的依赖、最深的接口 作者不同意仅凭长度拆函数：先让方法足够深，再缩短到易于阅读；重复代码和连体方法都是危险信号</desc>
