    <text x="76.0" y="544.0" font-size="18" font-weight="600">寫的時候多花幾分鐘，讀的人都少花時</text>
    <text x="76.0" y="568.0" font-size="18" font-weight="600">間</text>
    <text x="76.0" y="594.0" font-size="15">為回傳值定義專門的類，元素就有了有意義的名</text>
    <text x="76.0" y="617.0" font-size="15">字；讓宣告型別與分配型別一致；用空行分開代</text>
    <text x="76.0" y="640.0" font-size="15">碼塊，讓註解更醒目。如果讀你程式碼的人說它</text>
    <text x="76.0" y="663.0" font-size="15">難懂，它就是難懂。</text>
    <circle cx="40.0" cy="725.0" r="18" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(31.0,716.0) scale(0.750)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" /></g>
    <text x="76.0" y="713.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">結論</text>
    <text x="76.0" y="737.0" font-size="18" font-weight="600">三種方式讓讀者始終掌握所需資訊</text>
    <text x="76.0" y="763.0" font-size="15">最好的辦法是用抽象、消除特殊情況等設計手</text>
    <text x="76.0" y="786.0" font-size="15">段，減少讀者需要知道的資訊；其次是遵循約</text>
    <text x="76.0" y="809.0" font-size="15">定、符合預期，用讀者已有的知識；最後才是用</text>
    <text x="76.0" y="832.0" font-size="15">好名稱和有針對性的註解直接補上資訊。</text>
