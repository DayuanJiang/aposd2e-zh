    <text x="118.0" y="503.0" font-size="19" font-weight="600">看不出什麼重要時，先假設，再從結果中學</text>
    <text x="118.0" y="529.0" font-size="15">先提出“我認為這是最重要的”，據此構建系統看效果。對了，想想當時有什麼線索；錯了也沒關係，想想哪些線索本可以</text>
