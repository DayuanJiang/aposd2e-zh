<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 947" role="img" aria-labelledby="ch04-storym-title ch04-storym-desc">
  <title id="ch04-storym-title">从 Java 读文件要三个对象，到 Unix 用五个系统调用做完全部文件 I/O</title>
  <desc id="ch04-storym-desc">本章回顾。从 Java 读文件要三个对象，到 Unix 用五个系统调用做完全部文件 I/O。起点：模块化设计：一次只面对一小块复杂性。系统分成类、子系统、服务等模块，每个模块有接口和实现。理想是各模块完全独立，但模块要互相调用，依赖不可避免；目标是让依赖尽量少，接口比实现简单得多。；问题：浅模块与多类症：小类多了接口就多。课程里有个方法只是往表里放一个空值，理解它的接口并不比读实现简单。Java 读一个文件要依次建三个对象，缓冲还得单独请求，忘了就变慢。；转折：最好的模块是深的：接口简单，功能多。Unix 文件 I/O 只有 open、read、write、lseek、close 五个调用，实现却有几十万行。几十年来实现大改，接口没变。垃圾收集器甚至没有接口，也在悄悄回收内存。；做法：让常见情况尽可能简单。几乎所有文件 I/O 都要缓冲，就应该默认提供，不需要的少数人再去关掉。Unix 把顺序读写作为默认，只有随机访问才需要了解 lseek。更多或更大的接口不一定更好。。这一章最想强调的：设计类时最重要的是让它足够深：常见用例接口简单，功能却丰富 链表这样的浅类有时不可避免也有用，只是在管理复杂性上帮不了多少；小模块往往很浅</desc>
