<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 991" role="img" aria-labelledby="ch02-storym-title ch02-storym-desc">
  <title id="ch02-storym-title">從改一個橫幅顏色要改數千個頁面，到複雜性的兩個根源</title>
  <desc id="ch02-storym-desc">本章回顧。從改一個橫幅顏色要改數千個頁面，到複雜性的兩個根源。起點：複雜性：讓系統難以理解和修改的因素。軟體系統結構中，任何讓系統難以理解和修改的因素都是複雜性。它和規模、功能多少沒有必然聯絡，小系統也可能很複雜。讀者比作者更容易察覺複雜性。；症狀：變更放大、認知負荷、未知的未知。改橫幅顏色要逐頁修改；用某個 C 函式得記住釋放它分配的記憶體；改了中心變數，卻不知道哪些頁面還單獨寫了強調色。最後一種最糟，你連該改哪裡都不知道。；根源：兩個根源：依賴性和模糊性。依賴性：改一段程式碼，得顧及甚至修改別的程式碼，例如方法加了參數，所有呼叫都要改。模糊性：重要資訊不明顯，例如變數叫 time 卻沒說單位。；結論：複雜性是一點點積累出來的。單個依賴或一處模糊，本身影響不大。麻煩的是每個人對每次修改都覺得這一點沒什麼大不了，成百上千個小問題積累後，每次修改都會碰到好幾個，也很難再消除。。這一章最想強調的：複雜性來自依賴性和模糊性的積累，讓修改現有程式碼變得困難而危險 依賴無法完全消除，目標是讓它更少、更簡單、更明顯；把複雜性隔離到不必接觸的地方，幾乎等於消除</desc>
