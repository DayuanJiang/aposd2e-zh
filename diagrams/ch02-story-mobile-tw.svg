    <path d="M40 168 V 631" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" />
    <text x="22.0" y="62.0" font-size="21" font-weight="600">從改一個橫幅顏色要改數千個頁面，到</text>
    <text x="22.0" y="90.0" font-size="21" font-weight="600">複雜性的兩個根源</text>
