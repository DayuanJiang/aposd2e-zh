<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="316" viewBox="0 0 1040 316" role="img" aria-labelledby="fig-00019-title fig-00019-desc">
  <title id="fig-00019-title">Figure 9.3: Splitting a method</title>
  <desc id="fig-00019-desc">Four left-to-right arrangements. Interface points to the thick black top of a method rectangle; Implementation points to its gray body. In (a), Callers invoke one method. In (b), the parent method invokes an extracted subtask. In (c), Callers invoke two separate methods, labeled (rarely works). In (d), Callers and a parent invoke several shallow methods, labeled (avoid!). Relative widths and depths reproduce the qualitative original and are not a numeric scale.</desc>
