  <title id="figure-00013-title">Red flag</title>
  <desc id="figure-00013-desc">The original warning emblem: a red waving flag with an overlapping lower fold, on a black pole slanting down to the right. The pale pink background and the gap between the flag's two upper lobes are retained.</desc>
