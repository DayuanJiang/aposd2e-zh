  <g transform="translate(12 12) scale(2)" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">
    <text x="145.5" y="10" text-anchor="middle">Logical Array</text>
    <g stroke="#111" stroke-width="0.8">
      <rect x="47" y="19" width="17" height="13" fill="#aeceff"/>
      <rect x="64" y="19" width="60" height="13" fill="#ffffb9"/>
      <rect x="124" y="19" width="86" height="13" fill="#e4ab5d"/>
      <rect x="210" y="19" width="26" height="13" fill="#b0ffab"/>
      <rect x="236" y="19" width="8" height="13" fill="#d9c9ee"/>
      <rect x="0.5" y="57" width="133" height="81" rx="5" fill="#f8f8f8"/>
      <rect x="77.5" y="74" width="17" height="13" fill="#aeceff"/>
      <rect x="94.5" y="74" width="26" height="13" fill="#b0ffab"/>
      <rect x="77.5" y="109" width="43" height="13" fill="#fff"/>
      <rect x="77.5" y="109" width="8" height="13" fill="#d9c9ee"/>
      <rect x="193.5" y="79" width="85" height="13" fill="#e4ab5d"/>
      <rect x="193.5" y="104" width="60" height="13" fill="#ffffb9"/>
    </g>
    <g fill="none" stroke="#555" stroke-width="0.9" stroke-dasharray="0.6 1.7" stroke-linecap="round">
      <path d="M55.5 25.5 L86 80.5"/>
