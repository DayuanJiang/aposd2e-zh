<svg xmlns="http://www.w3.org/2000/svg" width="594" height="340" viewBox="0 0 594 340" role="img" aria-labelledby="fig-00022-title fig-00022-desc">
  <title id="fig-00022-title">Figure 20.1: Buffer object and memory chunks</title>
  <desc id="fig-00022-desc">A five-part Logical Array runs left to right in blue, yellow, orange, green, and purple. Dotted lines map blue and green to the Built-In Allocation inside the Buffer Object, purple to the occupied beginning of its Extra Allocation, and yellow and orange to two External Chunks at the right. Orange is drawn above yellow in physical storage. The unused end of the Extra Allocation stays white. The five chunk widths and crossing correspondence lines follow the original illustration without assigning byte counts or a quantitative scale.</desc>
