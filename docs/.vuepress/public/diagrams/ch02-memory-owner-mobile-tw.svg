<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 625" role="img" aria-labelledby="ch02-memory-owner-m-title ch02-memory-owner-m-desc">
  <title id="ch02-memory-owner-m-title">誰必須知道何時釋放記憶體？</title>
  <desc id="ch02-memory-owner-m-desc">兩組上下堆疊的責任泳道都以模組在左、呼叫者在右，時間向下。分配和使用位置不變，僅釋放從呼叫者泳道移入模組泳道。此重組要求安全的生命週期協議，圖並未給出該協議。</desc>
  <defs><marker id="ch02-memory-owner-m-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="var(--diagram-muted,#5c645d)" /></marker></defs>
  <rect width="360" height="625" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="var(--diagram-ink,#303630)">
    <text x="16" y="32" font-size="19" font-weight="600">誰必須知道何時釋放記憶體？</text>
    <text x="16" y="58" font-size="14" fill="var(--diagram-muted,#5c645d)">向下：時間先後；左右：責任歸屬</text>
    <text x="16" y="91" font-weight="600">原設計</text>
    <text x="130" y="112">模組</text><text x="246" y="112">呼叫者</text>
    <rect x="99" y="122" width="98" height="143" fill="var(--diagram-secondary-soft,#dce4ed)" /><rect x="221" y="122" width="107" height="143" fill="var(--diagram-warm-soft,#eae2cf)" />
    <path d="M32 127V258" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch02-memory-owner-m-arrow)" />
    <text x="55" y="153">1</text><text x="55" y="196">2</text><text x="55" y="239">3</text>
    <text x="132" y="153">分配</text><text x="258" y="196">使用</text>
    <rect x="231" y="216" width="88" height="35" rx="4" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" /><text x="260" y="239">釋放</text>
    <text x="16" y="293" font-size="14">呼叫者必須掌握釋放義務與時機。</text>
    <path d="M16 312H344" stroke="var(--diagram-line,#aebbad)" />
    <text x="16" y="345" font-weight="600">若能安全重組生命週期</text>
    <text x="130" y="369">模組</text><text x="246" y="369">呼叫者</text>
    <rect x="99" y="379" width="98" height="143" fill="var(--diagram-secondary-soft,#dce4ed)" /><rect x="221" y="379" width="107" height="143" fill="var(--diagram-warm-soft,#eae2cf)" />
    <path d="M32 384V515" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch02-memory-owner-m-arrow)" />
    <text x="55" y="410">1</text><text x="55" y="453">2</text><text x="55" y="496">3</text>
    <text x="132" y="410">分配</text><text x="258" y="453">使用</text>
    <rect x="105" y="473" width="86" height="35" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" /><text x="134" y="496">釋放</text>
    <text x="16" y="550" font-size="14">這部分義務可不再由呼叫者承擔。</text>
    <text x="16" y="579" font-size="13" fill="var(--diagram-muted,#5c645d)">圖不是 API 或所有權協議；安全性未證明。</text>
    <text x="16" y="602" font-size="13" fill="var(--diagram-muted,#5c645d)">這是條件性重組，不是唯一的降負荷辦法。</text>
  </g>
</svg>
