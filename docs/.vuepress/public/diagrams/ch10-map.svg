<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 542" role="img" aria-labelledby="ch10-title ch10-desc">
  <title id="ch10-title">怎样减少必须处理异常的地方？</title>
  <desc id="ch10-desc">本章概览。怎样减少必须处理异常的地方？ 本章的主要部分：通过定义来规避：改一下操作的定义，就没有错误可报；在底层处理掉：TCP 内部重发丢失的包，高层不必知道；顶层集中处理：多种异常传到顶层，交给一个处理程序；让程序崩溃：少见又难处理的错误，例如内存耗尽。一句话：最好重新定义让错误不发生；规避不了的在底层处理掉或顶层集中处理；少见又难办的让程序崩溃</desc>
  <rect width="960" height="542" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch10-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">怎样减少必须处理异常的地方？</text>
    <text x="32.0" y="94.0" font-size="15" fill="var(--diagram-muted,#5c645d)">按错误走多远排列：顶部中止程序，底部根本不发生</text>
    <rect x="32.0" y="114.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-warm-soft,#eae2cf)"/>
    <g transform="translate(50.0,132.0) scale(1.167)" fill="none" stroke="var(--diagram-warm,#80531b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18v-6a5 5 0 1 1 10 0v6"/><path d="M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z"/><path d="M21 12h1"/><path d="M18.5 4.5 18 5"/><path d="M2 12h1"/><path d="M12 2v1"/><path d="m4.929 4.929.707.707"/><path d="M12 12v6"/></g>
    <text x="92.0" y="142.0" font-size="18" font-weight="600">让程序崩溃</text>
    <text x="92.0" y="164.0" font-size="15" fill="var(--diagram-muted,#5c645d)">少见又难处理的错误，例如内存耗尽</text>
    <rect x="32.0" y="186.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <g transform="translate(50.0,204.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></g>
    <text x="92.0" y="214.0" font-size="18" font-weight="600">顶层集中处理</text>
    <text x="92.0" y="236.0" font-size="15" fill="var(--diagram-muted,#5c645d)">多种异常传到顶层，交给一个处理程序</text>
    <rect x="32.0" y="258.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <g transform="translate(50.0,276.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></g>
    <text x="92.0" y="286.0" font-size="18" font-weight="600">在底层处理掉</text>
    <text x="92.0" y="308.0" font-size="15" fill="var(--diagram-muted,#5c645d)">TCP 内部重发丢失的包，高层不必知道</text>
    <rect x="32.0" y="330.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <g transform="translate(50.0,348.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
    <text x="92.0" y="358.0" font-size="18" font-weight="600">通过定义来规避</text>
    <text x="92.0" y="380.0" font-size="15" fill="var(--diagram-muted,#5c645d)">改一下操作的定义，就没有错误可报</text>
    <rect x="32.0" y="416.0" width="896.0" height="98.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="50.0" y="437.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="50.0" y="467.0" font-size="21" font-weight="600">最好重新定义让错误不发生；规避不了的在底层处理掉或顶层集中处理；少见又难办的让</text>
    <text x="50.0" y="497.0" font-size="21" font-weight="600">程序崩溃</text>
  </g>
</svg>
