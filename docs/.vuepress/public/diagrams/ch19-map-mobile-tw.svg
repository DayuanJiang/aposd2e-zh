    <text x="36.0" y="661.0" font-size="17" font-weight="600">介面繼承和單元測試有助於降低複雜性；實作</text>
    <text x="36.0" y="687.0" font-size="17" font-weight="600">繼承、敏捷、設計模式各有風險；作者不熱衷</text>
    <text x="36.0" y="713.0" font-size="17" font-weight="600">測試驅動開發，Getter/Setter 最好避免</text>
  </g>
