<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 550" role="img" aria-labelledby="ch01-two-levers-title ch01-two-levers-desc">
  <title id="ch01-two-levers-title">消除規則，還是隔離規則？</title>
  <desc id="ch01-two-levers-desc">教學對照。相同含義的 size 和 length 統一後，命名區別消失。另一組對照中，R 格式識別和 D 解碼在封裝前屬於呼叫者，封裝後同樣的 R、D 屬於檔案模組，呼叫者使用 load(file)。兩種手段可以並用，沒有規定順序。</desc>
  <defs><marker id="ch01-two-levers-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="var(--diagram-muted,#5c645d)" /></marker></defs>
  <rect width="680" height="550" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="var(--diagram-ink,#303630)">
    <text x="24" y="34" font-size="20" font-weight="600">消除規則，還是隔離規則？</text>
    <text x="24" y="61" font-size="14" fill="var(--diagram-muted,#5c645d)">教學範例：比較“知識消失”與“同一知識改變歸屬”</text>
    <text x="24" y="99" font-weight="600">消除命名區別：此例中兩個名稱含義相同</text>
    <rect x="24" y="117" width="280" height="54" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)" />
    <rect x="376" y="117" width="280" height="54" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" />
    <text x="44" y="150" font-family="ui-monospace,monospace">size / length</text><text x="396" y="150" font-family="ui-monospace,monospace">length</text>
    <path d="M315 144H365" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch01-two-levers-arrow)" />
    <text x="24" y="198" font-size="14">原有的命名區別不再需要記憶。</text>
    <path d="M24 218H656" stroke="var(--diagram-line,#aebbad)" />
    <text x="24" y="248" font-weight="600">封裝前</text><text x="376" y="248" font-weight="600">封裝後：R、D 仍然存在</text>
    <rect x="24" y="265" width="280" height="169" rx="4" fill="none" stroke="var(--diagram-secondary,#2c6096)" />
    <text x="42" y="293" font-weight="600">呼叫者邊界</text>
    <rect x="42" y="308" width="244" height="42" fill="var(--diagram-secondary-soft,#dce4ed)" /><text x="58" y="335">R　識別格式</text>
    <rect x="42" y="365" width="244" height="42" fill="var(--diagram-primary-soft,#d6e5dc)" /><text x="58" y="392">D　解碼</text>
    <rect x="376" y="265" width="280" height="67" rx="4" fill="none" stroke="var(--diagram-secondary,#2c6096)" />
    <text x="394" y="290" font-weight="600">呼叫者邊界</text><text x="394" y="316" font-family="ui-monospace,monospace">load(file)</text>
    <path d="M516 338V360" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch01-two-levers-arrow)" /><text x="535" y="355" font-size="13">呼叫</text>
    <rect x="376" y="371" width="280" height="108" rx="4" fill="none" stroke="var(--diagram-primary,#0b6f5d)" />
    <text x="394" y="396" font-weight="600">檔案模組邊界</text>
    <rect x="394" y="407" width="244" height="28" fill="var(--diagram-secondary-soft,#dce4ed)" /><text x="410" y="427">R　識別格式</text>
    <rect x="394" y="443" width="244" height="28" fill="var(--diagram-primary-soft,#d6e5dc)" /><text x="410" y="463">D　解碼</text>
    <text x="24" y="508" font-weight="600">兩種手段可以並用；本章沒有規定先後順序。</text>
    <text x="24" y="534" font-size="13" fill="var(--diagram-muted,#5c645d)">封裝並未消除實作知識，也不意味著模組間沒有依賴。</text>
  </g>
</svg>
