<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 657" role="img" aria-labelledby="ch14-name-domains-m-t ch14-name-domains-m-d">
  <title id="ch14-name-domains-m-t">名稱的範圍要與概念的範圍吻合</title><desc id="ch14-name-domains-m-d">x在上半部分分叉到螢幕畫素與行內字元兩種解釋，charIndex指向字元。下半部分selection作為range的子集，delete實際覆蓋整個range。</desc>
  <defs><marker id="ch14-name-domains-m-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--diagram-muted,#58636b)" /></marker></defs>
  <rect width="360" height="657" fill="var(--diagram-bg,#f5f7f8)" />
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" fill="var(--diagram-ink,#263239)">
    <text x="20" y="32" font-size="18" font-weight="600">名稱的範圍要與概念的範圍吻合</text>
    <text x="20" y="74" font-weight="600">過寬：x 可以落入不同座標域</text>
    <circle cx="45" cy="153" r="23" fill="var(--diagram-warm-soft,#eae2cf)" /><text x="40" y="159" font-family="monospace" font-size="20">x</text>
    <g fill="none" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch14-name-domains-m-a)"><path d="M69 153H98V120H143" /><path d="M98 153V185H143" /></g>
    <text x="157" y="126">螢幕畫素座標？</text><text x="157" y="191">行內字元索引？</text>
    <rect x="144" y="243" width="196" height="43" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" /><text x="199" y="271" font-family="monospace">charIndex</text>
    <path d="M242 242V206" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" marker-end="url(#ch14-name-domains-m-a)" /><text x="20" y="270" font-size="13">排除座標域歧義</text>
    <path d="M20 311H340" stroke="var(--diagram-line,#aebbad)" /><text x="20" y="343" font-weight="600">過窄：selection 只暗示當前選區</text>
    <rect x="20" y="365" width="320" height="133" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" /><text x="38" y="394">任意文字範圍 range</text>
    <ellipse cx="158" cy="438" rx="108" ry="27" fill="var(--diagram-warm-soft,#eae2cf)" /><text x="81" y="443">當前選區 selection</text><text x="188" y="485" font-size="13">也包含未選中的範圍</text>
    <path d="M22 509V521H338V509" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" />
    <text x="87" y="552" font-family="monospace">delete(range)</text><text x="50" y="581">名稱應覆蓋整個實際能力範圍。</text>
    <text x="20" y="615" font-size="13" fill="var(--diagram-muted,#58636b)">集合是教學示意，不表示機率或比例。</text><text x="20" y="639" font-size="13" fill="var(--diagram-muted,#58636b)">精確不等於越具體越好。</text>
  </g>
</svg>
