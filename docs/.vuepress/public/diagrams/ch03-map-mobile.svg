<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 428" role="img" aria-labelledby="ch03m-title ch03m-desc">
  <title id="ch03m-title">能工作的代码，为什么还不够？</title>
  <desc id="ch03m-desc">本章概览。能工作的代码，为什么还不够？ 本章的主要部分：战术式编程：只求代码尽快工作，复杂性越积越多；战略式编程：把好设计当主要目标，持续小额投资。一句话：只求代码能跑会累积复杂性；持续投入 10% 到 20% 的时间做设计，几个月后更快</desc>
  <rect width="420" height="428" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch03m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">能工作的代码，为什么还不够？</text>
    <rect x="22.0" y="68.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-danger-soft,#ead9dc)"/>
    <circle cx="50.0" cy="94.0" r="14" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" stroke-width="2"/><g transform="translate(42.0,86.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g>
    <text x="74.0" y="99.0" font-size="18" font-weight="600">战术式：先让它跑起来</text>
    <text x="74.0" y="124.0" font-size="15" fill="var(--diagram-muted,#5c645d)">赶期限，不花多少时间找最佳设计；加点复</text>
    <text x="74.0" y="146.0" font-size="15" fill="var(--diagram-muted,#5c645d)">杂性、留个蹩脚实现，没什么；出了问题快</text>
    <text x="74.0" y="168.0" font-size="15" fill="var(--diagram-muted,#5c645d)">速修补，补丁越打越多</text>
    <rect x="22.0" y="188.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <circle cx="50.0" cy="214.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,206.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/><circle cx="12" cy="12" r="10"/></g>
    <text x="74.0" y="219.0" font-size="18" font-weight="600">战略式：好设计是主要目标</text>
    <text x="74.0" y="244.0" font-size="15" fill="var(--diagram-muted,#5c645d)">能工作还不够，最重要是长期结构；为新类</text>
    <text x="74.0" y="266.0" font-size="15" fill="var(--diagram-muted,#5c645d)">多比较几种设计，写好文档；发现设计问题</text>
    <text x="74.0" y="288.0" font-size="15" fill="var(--diagram-muted,#5c645d)">时，花时间真正修复</text>
    <rect x="22.0" y="316.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="36.0" y="337.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="36.0" y="363.0" font-size="17" font-weight="600">只求代码能跑会累积复杂性；持续投入 10</text>
    <text x="36.0" y="389.0" font-size="17" font-weight="600">% 到 20% 的时间做设计，几个月后更快</text>
  </g>
</svg>
