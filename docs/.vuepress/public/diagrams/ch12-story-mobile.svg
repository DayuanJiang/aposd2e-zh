<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1209" role="img" aria-labelledby="ch12-storym-title ch12-storym-desc">
  <title id="ch12-storym-title">从四个不写注释的借口，到注释为什么是抽象的基础</title>
  <desc id="ch12-storym-desc">本章回顾。从四个不写注释的借口，到注释为什么是抽象的基础。起点：很多生产代码几乎没有注释，开发人员有四个常见借口。代码是自解释的；没有时间；注释容易过时并产生误导；见过的注释都毫无价值。作者认为文档不足给开发带来了巨大且不必要的拖累。；反驳：代码能表达的设计信息很少，靠读代码理解会拆出大量浅方法。提取子字符串的方法有起始和结束两个参数，只看声明不知道结果是否包含结束位置。如果预期使用者读实现，就会把方法拆得很短，产生大量浅方法，读者仍要逐个读懂。；算账：时间和过时两个借口，算一算都不成立。键入代码的时间不到开发时间的 10%，即使注释和代码一样多，也只多花约 10%。注释只在代码大改时才需大改，放在代码附近、避免重复，再加代码审查，就能保持更新。；主张：注释记录设计者知道、却无法用代码表达的信息。没有注释，方法唯一的抽象就是声明，使用者必须读代码，复杂性全部暴露出来。好注释提供修改代码所需的信息，减轻认知负荷，也减少未知的未知。；回应：对“注释是一种失败”这一观点的回应。《代码整洁之道》主张把代码块提取成方法，用方法名代替注释。作者认为这样会得到冗长晦涩的名称，每次调用都在重复文档；好注释提升代码价值，是定义抽象的基础。。这一章最想强调的：注释的核心作用，是记录设计者知道、却无法在代码中表达的信息 好的设计能减少对注释的需求，尤其是方法体中的注释，但注释并不代表失败：代码和注释各有所长</desc>
