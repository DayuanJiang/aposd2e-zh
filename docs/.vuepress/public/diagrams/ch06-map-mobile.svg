<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" role="img" aria-labelledby="ch06m-title ch06m-desc">
  <title id="ch06m-title">接口要多通用才合适？</title>
  <desc id="ch06m-desc">本章概览。接口要多通用才合适？ 本章的主要部分：接口足够通用：两个通用方法，替代大量专用方法；三个自问：最简单的接口？几种用途？当前好用吗？；专用代码上移下移：界面细节上移，设备差异下移到驱动；消除特殊情况：用空选区表示没有选区，省去检查。一句话：适度通用：功能反映当前需求，接口不局限于当前用途；专用代码与通用代码分开</desc>
  <rect width="420" height="620" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch06m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">接口要多通用才合适？</text>
    <rect x="22.0" y="68.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <circle cx="50.0" cy="94.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,86.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>
    <text x="74.0" y="99.0" font-size="18" font-weight="600">目标：接口适度通用</text>
    <text x="74.0" y="124.0" font-size="15" fill="var(--diagram-muted,#5c645d)">作者教几轮课后发现，通用类几乎总是优于</text>
    <text x="74.0" y="146.0" font-size="15" fill="var(--diagram-muted,#5c645d)">专用类，代码更少</text>
    <text x="22.0" y="180.0" font-size="16" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">靠什么支撑</text>
    <rect x="22.0" y="196.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <circle cx="50.0" cy="222.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,214.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></g>
    <text x="74.0" y="227.0" font-size="18" font-weight="600">接口足够通用</text>
    <text x="74.0" y="252.0" font-size="15" fill="var(--diagram-muted,#5c645d)">两个通用方法，替代大量专用方法</text>
    <rect x="22.0" y="272.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <circle cx="50.0" cy="298.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,290.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></g>
    <text x="74.0" y="303.0" font-size="18" font-weight="600">三个自问</text>
    <text x="74.0" y="328.0" font-size="15" fill="var(--diagram-muted,#5c645d)">最简单的接口？几种用途？当前好用吗？</text>
    <rect x="22.0" y="348.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <circle cx="50.0" cy="374.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,366.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></g>
    <text x="74.0" y="379.0" font-size="18" font-weight="600">专用代码上移下移</text>
    <text x="74.0" y="404.0" font-size="15" fill="var(--diagram-muted,#5c645d)">界面细节上移，设备差异下移到驱动</text>
    <rect x="22.0" y="424.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <circle cx="50.0" cy="450.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,442.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
    <text x="74.0" y="455.0" font-size="18" font-weight="600">消除特殊情况</text>
    <text x="74.0" y="480.0" font-size="15" fill="var(--diagram-muted,#5c645d)">用空选区表示没有选区，省去检查</text>
    <rect x="22.0" y="508.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="36.0" y="529.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="36.0" y="555.0" font-size="17" font-weight="600">适度通用：功能反映当前需求，接口不局限</text>
    <text x="36.0" y="581.0" font-size="17" font-weight="600">于当前用途；专用代码与通用代码分开</text>
  </g>
</svg>
