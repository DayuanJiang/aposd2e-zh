    <text x="118.0" y="503.0" font-size="19" font-weight="600">持续小额投资，几个月后收回成本</text>
    <text x="118.0" y="529.0" font-size="15">一次设计整个系统是瀑布式，行不通。持续投入起初慢一点，几个月后开发速度反超，省下的时间足够支持后续投资。</text>
