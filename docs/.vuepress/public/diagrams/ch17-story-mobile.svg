<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1064" role="img" aria-labelledby="ch17-storym-title ch17-storym-desc">
  <title id="ch17-storym-title">从行终止符的反复出错，到读者理解一处就能理解全部</title>
  <desc id="ch17-storym-desc">本章回顾。从行终止符的反复出错，到读者理解一处就能理解全部。起点：同一套代码，Unix 用换行，Windows 用回车加换行。编辑器有时会把整个文件的行终止符改成当前系统的格式，于是每一行都显示为已修改，真正的改动反而难以辨认。每来一个新成员，问题就重演一遍。；问题：缺乏一致性时，读者要逐一学习每种情况，还会做出错误假设。两种实际不同的情况看起来一样，开发人员按熟悉的模式猜测，就会猜错。系统一致时，相似的事采用相似做法，理解了一处就能理解其他地方。；做法：写下约定、用工具强制、入乡随俗、不轻易改旧约定。作者写了一个提交前自动运行的脚本，只要有一行含回车符就中止提交，问题一下就解决了。写新代码前先看现有代码怎么组织并照着做；有更好的想法也不足以引入不一致。；限定：一致也要求不同的事采用不同做法。给确实不同的事物用同一个变量名，或把设计模式套在不适合的任务上，只会增加混乱。保持一致是一种投资：定约定、写检查工具都要花时间，回报是代码更快、更准确地被看懂。。这一章最想强调的：相似的事用相似做法：保持一致的收益，几乎总是大于新旧做法之间的优劣差距 一致也要求不同的事采用不同做法；只有当开发人员确信“如果它看起来像 x，它确实是 x”时，一致性才有益</desc>
