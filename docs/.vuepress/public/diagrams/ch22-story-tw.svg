    <text x="118.0" y="356.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">轉折</text>
    <text x="118.0" y="380.0" font-size="19" font-weight="600">回報很快到來：掌握方法後，好設計並不比草率的設計多花多少時間</text>
    <text x="118.0" y="406.0" font-size="15">專案開始時精心定義的模組，會在後續反覆使用時省下時間；六個月前寫下的清晰文件，會在你重讀程式碼、加新功能</text>
    <text x="118.0" y="429.0" font-size="15">時省下時間。設計技能也會隨經驗提升，做出好設計越來越快。</text>
    <circle cx="74.0" cy="491.0" r="22" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(63.0,480.0) scale(0.917)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></g>
    <text x="118.0" y="479.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">結論</text>
    <text x="118.0" y="503.0" font-size="19" font-weight="600">優秀的設計師把更多時間花在有趣的設計階段</text>
    <text x="118.0" y="529.0" font-size="15">設計是一個有趣的問題：怎樣用盡可能簡單的結構解決特定問題。整潔、簡單、易理解的設計本身就是美的。糟糕的設</text>
    <text x="118.0" y="552.0" font-size="15">計師則把大部分時間花在複雜而脆弱的程式碼裡追查缺陷。</text>
    <rect x="32.0" y="590.0" width="896.0" height="101.0" rx="12" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <g transform="translate(50.0,610.0) scale(1.000)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" /><line x1="4" x2="4" y1="22" y2="15" /></g>
    <text x="92.0" y="618.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">這一章最想強調的</text>
