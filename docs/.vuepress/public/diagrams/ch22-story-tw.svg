    <text x="32.0" y="62.0" font-size="26" font-weight="600">從一本只討論複雜性的書，到把更多時間用在有趣的設計上</text>
    <circle cx="74.0" cy="122.0" r="22" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(63.0,111.0) scale(0.917)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14" /><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" /></g>
    <text x="118.0" y="110.0" font-size="12" font-weight="600" fill="var(--diagram-secondary,#2c6096)">起點</text>
    <text x="118.0" y="134.0" font-size="19" font-weight="600">全書只討論一件事：複雜性</text>
    <text x="118.0" y="160.0" font-size="15">複雜性讓系統難以構建和維護，也常讓它執行緩慢。全書講了它的根源，如依賴性和模糊性；識別它的危險訊號，如信</text>
    <text x="118.0" y="183.0" font-size="15">息洩露；減少它的思路，如深而通用的類、透過定義來規避錯誤。</text>
    <circle cx="74.0" cy="245.0" r="22" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)" stroke-width="2" /><g transform="translate(63.0,234.0) scale(0.917)" fill="none" stroke="var(--diagram-warm,#80531b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h14" /><path d="M5 2h14" /><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22" /><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" /></g>
    <text x="118.0" y="233.0" font-size="12" font-weight="600" fill="var(--diagram-warm,#80531b)">代價</text>
    <text x="118.0" y="257.0" font-size="19" font-weight="600">代價：專案早期要多投入，學的時候進度更慢</text>
    <text x="118.0" y="283.0" font-size="15">如果唯一關心的是讓當前程式碼儘快正常工作，思考設計就會顯得是額外負擔，似乎妨礙了真正的目標。作者承認這一</text>
