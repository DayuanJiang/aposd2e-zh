<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 719" role="img" aria-labelledby="ch22-story-title ch22-story-desc">
  <title id="ch22-story-title">從一本只討論複雜性的書，到把更多時間用在有趣的設計上</title>
  <desc id="ch22-story-desc">本章回顧。從一本只討論複雜性的書，到把更多時間用在有趣的設計上。起點：全書只討論一件事：複雜性。複雜性讓系統難以構建和維護，也常讓它執行緩慢。全書講了它的根源，如依賴性和模糊性；識別它的危險訊號，如資訊洩露；減少它的思路，如深而通用的類、透過定義來規避錯誤。；代價：代價：專案早期要多投入，學的時候進度更慢。如果唯一關心的是讓當前程式碼儘快正常工作，思考設計就會顯得是額外負擔，似乎妨礙了真正的目標。作者承認這一點：還不習慣思考設計時，進度確實會慢一些。；轉折：回報很快到來：掌握方法後，好設計並不比草率的設計多花多少時間。專案開始時精心定義的模組，會在後續反覆使用時省下時間；六個月前寫下的清晰文件，會在你重讀程式碼、加新功能時省下時間。設計技能也會隨經驗提升，做出好設計越來越快。；結論：優秀的設計師把更多時間花在有趣的設計階段。設計是一個有趣的問題：怎樣用盡可能簡單的結構解決特定問題。整潔、簡單、易理解的設計本身就是美的。糟糕的設計師則把大部分時間花在複雜而脆弱的程式碼裡追查缺陷。。這一章最想強調的：應對複雜性是軟體設計中最重要的挑戰；對良好設計的投入很快就會得到回報 提高設計技能後，你能更快開發出更高品質的軟體，也能更享受開發的過程</desc>
