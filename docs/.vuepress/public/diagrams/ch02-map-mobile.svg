    <text x="36.0" y="436.0" font-size="17" font-weight="600">让系统难以理解和修改的因素；根源是依赖</text>
    <text x="36.0" y="462.0" font-size="17" font-weight="600">性和模糊性，由成百上千个小问题积累而成</text>
