<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 501" role="img" aria-labelledby="ch02m-title ch02m-desc">
  <title id="ch02m-title">复杂性是什么，怎么看出来，从哪来？</title>
  <desc id="ch02m-desc">本章概览。复杂性是什么，怎么看出来，从哪来？ 本章的主要部分：根源：依赖性、模糊性：改一处得顾及别处；重要信息不明显；症状：变更放大、认知负荷、未知的未知：一改牵连多处；要记的太多；不知该改哪；结果：难理解、难修改：小改进也要花大量工作。一句话：让系统难以理解和修改的因素；根源是依赖性和模糊性，由成百上千个小问题积累而成</desc>
  <rect width="420" height="501" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
