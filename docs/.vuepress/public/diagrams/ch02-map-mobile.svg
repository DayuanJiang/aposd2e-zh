    <text x="22.0" y="44.0" font-size="23" font-weight="600">复杂性是什么，怎么看出来，从哪</text>
    <text x="22.0" y="75.0" font-size="23" font-weight="600">来？</text>
    <text x="22.0" y="113.0" font-size="16" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">从上到下</text>
    <rect x="22.0" y="129.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <circle cx="50.0" cy="155.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,147.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></g>
    <text x="74.0" y="160.0" font-size="18" font-weight="600">结果：难理解、难修改</text>
    <text x="74.0" y="185.0" font-size="15" fill="var(--diagram-muted,#5c645d)">小改进也要花大量工作</text>
    <rect x="22.0" y="205.0" width="376.0" height="90.0" rx="9" fill="var(--diagram-warm-soft,#eae2cf)"/>
    <circle cx="50.0" cy="231.0" r="14" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)" stroke-width="2"/><g transform="translate(42.0,223.0) scale(0.667)" fill="none" stroke="var(--diagram-warm,#80531b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></g>
    <text x="74.0" y="236.0" font-size="18" font-weight="600">症状：变更放大、认知负荷、未知的</text>
    <text x="74.0" y="260.0" font-size="18" font-weight="600">未知</text>
    <text x="74.0" y="285.0" font-size="15" fill="var(--diagram-muted,#5c645d)">一改牵连多处；要记的太多；不知该改哪</text>
    <rect x="22.0" y="305.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-danger-soft,#ead9dc)"/>
    <circle cx="50.0" cy="331.0" r="14" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" stroke-width="2"/><g transform="translate(42.0,323.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g>
    <text x="74.0" y="336.0" font-size="18" font-weight="600">根源：依赖性、模糊性</text>
    <text x="74.0" y="361.0" font-size="15" fill="var(--diagram-muted,#5c645d)">改一处得顾及别处；重要信息不明显</text>
