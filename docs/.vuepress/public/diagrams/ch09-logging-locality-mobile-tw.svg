<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 673" role="img" aria-labelledby="ch09-logging-locality-m-t ch09-logging-locality-m-d">
  <title id="ch09-logging-locality-m-t">這條日誌為什麼不需要一個專用包裝類？</title><desc id="ch09-logging-locality-m-d">上下兩處程式碼之間存在雙向閱讀依賴。將日誌放回檢測點後，錯誤情境和記錄內容相鄰，通用logger保留。</desc>
  <defs><marker id="ch09-logging-locality-m-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--diagram-muted,#58636b)" /></marker></defs>
  <rect width="360" height="673" fill="var(--diagram-bg,#f5f7f8)" />
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" fill="var(--diagram-ink,#263239)">
    <text x="20" y="32" font-size="18" font-weight="600">這條日誌為什麼不需要</text><text x="20" y="58" font-size="18" font-weight="600">一個專用包裝類？</text>
    <rect x="20" y="83" width="320" height="83" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" /><text x="38" y="113">檢測到開啟連線失敗</text><text x="38" y="145" font-family="monospace" font-size="14">logRpcOpenError(req, dest, e)</text>
    <g fill="none" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch09-logging-locality-m-a)"><path d="M74 167V270" /><path d="M286 277V174" /></g>
    <text x="88" y="201" font-size="13">向下：記錄了什麼？</text><text x="88" y="229" font-size="13">向上：為什麼記錄？</text><text x="88" y="256" font-size="12" fill="var(--diagram-muted,#58636b)">閱讀依賴，非執行時呼叫</text>
    <rect x="20" y="277" width="320" height="92" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" /><text x="38" y="306" font-family="monospace" font-size="14">NetworkErrorLogger</text><text x="38" y="333">一行日誌，卻有單獨介面及文件</text><text x="38" y="357" font-size="13">書中每個包裝方法只被呼叫一次</text>
    <path d="M20 396H340" stroke="var(--diagram-line,#aebbad)" />
    <text x="20" y="428" font-weight="600">內聯後：情境和記錄內容相鄰</text>
    <rect x="20" y="446" width="320" height="86" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" /><text x="38" y="475">檢測到開啟連線失敗</text><text x="38" y="505">就地記錄 req、dest、e</text>
    <path d="M180 533V557" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch09-logging-locality-m-a)" /><text x="94" y="584">通用 logger 仍然保留</text>
    <text x="20" y="619" font-size="13" fill="var(--diagram-muted,#58636b)">結論限於淺、單處呼叫、依賴情境的包裝。</text><text x="20" y="643" font-size="13" fill="var(--diagram-muted,#58636b)">不是反對通用日誌基礎設施。</text>
  </g>
</svg>
