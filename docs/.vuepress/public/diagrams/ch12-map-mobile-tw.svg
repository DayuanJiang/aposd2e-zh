<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 406" role="img" aria-labelledby="ch12m-title ch12m-desc">
  <title id="ch12m-title">不寫註解的四個藉口，站得住嗎？</title>
  <desc id="ch12m-desc">本章概覽。不寫註解的四個藉口，站得住嗎？ 本章的主要部分：四個藉口：程式碼自解釋、沒時間、會過時、沒用；作者的回應：逐條回應，都站不住。一句話：四個藉口都站不住：註解記錄設計者知道、卻無法用程式碼表達的資訊</desc>
  <rect width="420" height="406" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch12m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">不寫註解的四個藉口，站得住嗎？</text>
    <rect x="22.0" y="68.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-danger-soft,#ead9dc)" />
    <circle cx="50.0" cy="94.0" r="14" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" stroke-width="2" /><g transform="translate(42.0,86.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" /><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" /><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" /><path d="m2 2 20 20" /></g>
    <text x="74.0" y="99.0" font-size="18" font-weight="600">四個藉口</text>
    <text x="74.0" y="124.0" font-size="15" fill="var(--diagram-muted,#5c645d)">好的程式碼是自解釋的；我沒有時間寫註解；</text>
    <text x="74.0" y="146.0" font-size="15" fill="var(--diagram-muted,#5c645d)">註解很容易過時；見過的註解都毫無價值</text>
    <rect x="22.0" y="166.0" width="376.0" height="110.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="192.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,184.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9" /><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z" /></g>
    <text x="74.0" y="197.0" font-size="18" font-weight="600">作者的回應</text>
    <text x="74.0" y="222.0" font-size="15" fill="var(--diagram-muted,#5c645d)">介面含義只能靠註解說明；最多多花約 10%</text>
    <text x="74.0" y="244.0" font-size="15" fill="var(--diagram-muted,#5c645d)">的開發時間；放在程式碼附近就容易更新；</text>
    <text x="74.0" y="266.0" font-size="15" fill="var(--diagram-muted,#5c645d)">有用的註解怎麼寫，可以學</text>
    <rect x="22.0" y="294.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="36.0" y="315.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="36.0" y="341.0" font-size="17" font-weight="600">四個藉口都站不住：註解記錄設計者知道、</text>
    <text x="36.0" y="367.0" font-size="17" font-weight="600">卻無法用程式碼表達的資訊</text>
  </g>
</svg>
