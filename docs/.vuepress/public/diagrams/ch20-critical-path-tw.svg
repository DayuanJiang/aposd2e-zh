<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" role="img" aria-labelledby="ch20-critical-path-title ch20-critical-path-desc">
  <title id="ch20-critical-path-title">將特殊情況從常見路徑中分流</title>
  <desc id="ch20-critical-path-desc">原結構讓常見路徑經歷檢查、工作 A、檢查、工作 B。目標結構先分流，常見路徑連續執行 A、B，特殊情況走旁路。必須先定位熱點並考慮根本改進，此為理想目標。</desc>
  <defs><marker id="ch20-critical-path-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#5c645d)" /></marker></defs>
  <rect width="680" height="410" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" fill="var(--diagram-ink,#303630)">
    <text x="24" y="34" font-size="21" font-weight="600">常見路徑不必反覆替特殊情況付費</text><text x="24" y="61" font-size="14">20.3 · 教學控制流：A/B 為必要工作，不是 Buffer 程式碼</text>
    <text x="24" y="98" font-weight="600">原結構：正常情況也穿過每次檢查</text>
    <g fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)"><rect x="24" y="116" width="118" height="46" rx="4" /><rect x="364" y="116" width="118" height="46" rx="4" /></g>
    <text x="83" y="145" text-anchor="middle">特殊檢查</text><text x="423" y="145" text-anchor="middle">特殊檢查</text>
    <text x="253" y="145" text-anchor="middle">工作 A</text><text x="592" y="145" text-anchor="middle">工作 B</text>
    <g fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch20-critical-path-arrow)"><path d="M142 139H211" /><path d="M295 139H364" /><path d="M482 139H548" /></g>
    <path d="M24 191H656" stroke="var(--diagram-line,#aebbad)" />
    <text x="24" y="223" font-weight="600">理想目標：入口識別並分流</text>
    <path d="M110 240L196 278L110 316L24 278Z" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)" /><text x="110" y="284" text-anchor="middle">常見情況？</text>
    <rect x="303" y="253" width="353" height="50" rx="5" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" /><text x="385" y="284" text-anchor="middle">工作 A</text><text x="580" y="284" text-anchor="middle">工作 B</text>
    <g fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch20-critical-path-arrow)"><path d="M196 278H303" /><path d="M432 278H533" /><path d="M110 316V343H303" /></g>
    <text x="242" y="265">是</text><text x="123" y="335">否</text><text x="315" y="349">特殊處理：離開常見路徑，優先簡單</text>
    <text x="24" y="389" font-size="14">前提：熱點已測實；先找根本改進。一次分流是目標，不是保證。</text>
  </g>
</svg>
