<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 446" role="img" aria-labelledby="ch13m-title ch13m-desc">
  <title id="ch13m-title">注释应该描述什么信息？</title>
  <desc id="ch13m-desc">本章概览。注释应该描述什么信息？ 本章的主要部分：比代码更详细：提高精确度，补上单位、边界、空值等细节；与代码同一层级：只是重复代码，例如“添加水平滚动条”；比代码更抽象：省略细节，说明代码要做什么和为什么。一句话：描述从代码中不易看出的信息：比代码更详细以求精确，或更抽象以帮助理解</desc>
  <rect width="420" height="446" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
