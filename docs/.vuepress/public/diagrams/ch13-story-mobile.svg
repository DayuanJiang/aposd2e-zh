<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1066" role="img" aria-labelledby="ch13-storym-title ch13-storym-desc">
  <title id="ch13-storym-title">从只会重复代码的注释，到描述代码里看不出的信息</title>
  <desc id="ch13-storym-desc">本章回顾。从只会重复代码的注释，到描述代码里看不出的信息。起点：许多注释在重复代码，读者凭旁边的代码就能写出来。例如 // Add a horizontal scroll bar，或者接口注释只是把方法名和参数名拆成单词再拼成句子。这样的注释没有让代码更易理解，也让一些人认定注释毫无价值。；原则：有用的注释和代码的详细程度不同：更低层级求精确，更高层级助理解。变量注释补上单位、边界、空值含义、不变量等细节。更高层级的注释省略细节，说明这段代码要做什么、为什么需要它，例如“把当前键哈希追加到一个尚未发送的 RPC”。；接口：接口注释定义抽象，与实现注释分开。IndexLookup 类的原注释写了用到哪些 RPC 和私有配置参数，使用者不需要知道；改写后说明每个实例代表一次范围查询及怎样调用。接口注释若必须描述实现，这个类或方法就是浅的。；位置：实现注释说做什么和为什么；跨模块决策放在开发人员自然会看到的地方。较长方法的每个主要代码块前说明它做什么；修复缺陷的代码若目的不明显，要说明为什么。跨多个类的决策放在状态枚举末尾这类必然会看到的位置，或集中到 designNotes 文件。。这一章最想强调的：注释应该描述从代码中不易看出的信息；使用者只读声明和注释就能理解模块的抽象 哪些信息不易看出，要站在第一次读这段代码的人的角度判断；审查者说难懂，那就是难懂</desc>
