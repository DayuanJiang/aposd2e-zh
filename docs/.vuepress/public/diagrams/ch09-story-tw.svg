<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 842" role="img" aria-labelledby="ch09-story-title ch09-story-desc">
  <title id="ch09-story-title">從“越小越簡單”的直覺，到按複雜性決定組合還是分開</title>
  <desc id="ch09-story-desc">本章回顧。從“越小越簡單”的直覺，到按複雜性決定組合還是分開。起點：把系統切成很多小元件，每個看起來都更簡單，但細分本身有代價。元件多了更難掌握和查詢，介面跟著變多；可能要額外程式碼管理多個物件；原本挨著的程式碼被分到不同類甚至不同檔案，看不到彼此的依賴；還可能出現重複。；判斷：四個相關的跡象：共享資訊、一起使用、概念重疊、不看一段就讀不懂另一段。讀取和解析 HTTP 請求都得懂請求格式，合併後代碼更短；若把緩衝合進檔案流，多數使用者不必知道它。“一起使用”要雙向成立：塊快取總要用雜湊表，雜湊表的用途卻多得多，應分開。；反例：兩次判斷失誤：游標和所選區域合成一個物件，日誌語句拆成單獨的類。游標和所選區域合成一個物件後，高層程式碼仍要分別操作，實作還多了一個布林值，分開更簡單。每條日誌只在一處呼叫，卻被拆成單行方法加大段註解，讀者要兩頭來回跳。；分歧：作者與《程式碼整潔之道》的分歧：方法該多短？。《程式碼整潔之道》主張函式應該非常短，十行都太長。作者同意短函式通常更易懂，但縮到幾十行後繼續縮，改善有限；函式太小會失去獨立性，成為必須一起讀的連體函式。；結論：拆或合，都以複雜性為依據。選擇能提供最好的資訊隱藏、最少的依賴和最深介面的結構。方法先做到夠深，再儘量縮短到易讀，不要為了長度犧牲深度。。這一章最想強調的：拆分或組合的依據是複雜性：最好的資訊隱藏、最少的依賴、最深的介面 作者不同意僅憑長度拆函式：先讓方法足夠深，再縮短到易於閱讀；重複程式碼和連體方法都是危險訊號</desc>
