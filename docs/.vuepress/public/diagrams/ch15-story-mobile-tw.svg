    <circle cx="40.0" cy="532.0" r="18" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(31.0,523.0) scale(0.750)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></g>
    <text x="76.0" y="520.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">發現</text>
    <text x="76.0" y="544.0" font-size="18" font-weight="600">註解是設計工具：方法需要很長的註解，</text>
    <text x="76.0" y="568.0" font-size="18" font-weight="600">就是抽象不夠好的危險訊號</text>
    <text x="76.0" y="594.0" font-size="15">註解是完整描述抽象的唯一方式。介面註解簡短</text>
    <text x="76.0" y="617.0" font-size="15">又完整，說明介面簡單；介面註解必須描述實作</text>
    <text x="76.0" y="640.0" font-size="15">的主要特性，說明方法是淺的。先寫註解，就能</text>
    <text x="76.0" y="663.0" font-size="15">在寫實作之前檢查和調整抽象。</text>
    <circle cx="40.0" cy="725.0" r="18" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(31.0,716.0) scale(0.750)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></g>
    <text x="76.0" y="713.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">算賬</text>
    <text x="76.0" y="737.0" font-size="18" font-weight="600">先寫註解不貴，還可能更省時間，而且</text>
    <text x="76.0" y="761.0" font-size="18" font-weight="600">更有趣</text>
    <text x="76.0" y="787.0" font-size="15">鍵入程式碼和註解不太可能超過開發總時間的約</text>
    <text x="76.0" y="810.0" font-size="15">10%；即使一半程式碼行是註解，寫註解也很可</text>
    <text x="76.0" y="833.0" font-size="15">能不到 5%，推遲只省一小部分。先寫註解讓抽</text>
    <text x="76.0" y="856.0" font-size="15">象更早穩定、改動更少；作者也覺得最有趣。</text>
