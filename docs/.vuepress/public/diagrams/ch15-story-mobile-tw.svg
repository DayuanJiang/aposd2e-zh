<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1111" role="img" aria-labelledby="ch15-storym-title ch15-storym-desc">
  <title id="ch15-storym-title">從拖到最後補的註解，到用註解檢驗設計</title>
  <desc id="ch15-storym-desc">本章回顧。從拖到最後補的註解，到用註解檢驗設計。起點：作者見過的開發人員幾乎都把註解推遲到編碼和測試之後。理由是程式碼還在變，等穩定了再寫。結果往往是拖到最後根本不寫；即使回頭補，心思已在下一個專案上，設計時的考慮也記不清了，寫出來的多半只是在重複程式碼。；做法：作者的順序：類介面註解、方法介面註解和簽名、實例變數、方法體。方法體先留空，反覆修改介面註解直到基本結構合理。寫每個方法體之前先寫它的介面註解，這樣能專注於抽象和介面，程式碼寫完時註解也寫完了。；發現：註解是設計工具：方法需要很長的註解，就是抽象不夠好的危險訊號。註解是完整描述抽象的唯一方式。介面註解簡短又完整，說明介面簡單；介面註解必須描述實作的主要特性，說明方法是淺的。先寫註解，就能在寫實作之前檢查和調整抽象。；算賬：先寫註解不貴，還可能更省時間，而且更有趣。鍵入程式碼和註解不太可能超過開發總時間的約 10%；即使一半程式碼行是註解，寫註解也很可能不到 5%，推遲只省一小部分。先寫註解讓抽象更早穩定、改動更少；作者也覺得最有趣。。這一章最想強調的：編寫註解的最佳時機是開發之初；先寫註解，文件就成了設計過程的一部分 只有完整、清晰的註解才能反映複雜性；描述方法或變數的註解若很難寫得簡單而完整，設計可能有問題</desc>
