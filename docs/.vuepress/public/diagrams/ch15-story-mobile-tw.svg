    <text x="78.0" y="1041.0" font-size="14" fill="var(--diagram-muted,#5c645d)">法或變數的註解若很難寫得簡單而完整，設計可</text>
    <text x="78.0" y="1062.0" font-size="14" fill="var(--diagram-muted,#5c645d)">能有問題</text>
