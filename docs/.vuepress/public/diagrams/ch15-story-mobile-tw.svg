    <text x="76.0" y="208.0" font-size="15">理由是程式碼還在變，等穩定了再寫。結果往往</text>
    <text x="76.0" y="231.0" font-size="15">是拖到最後根本不寫；即使回頭補，心思已在下</text>
    <text x="76.0" y="254.0" font-size="15">一個專案上，設計時的考慮也記不清了，寫出來</text>
    <text x="76.0" y="277.0" font-size="15">的多半只是在重複程式碼。</text>
    <circle cx="40.0" cy="339.0" r="18" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(31.0,330.0) scale(0.750)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9" /><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z" /></g>
    <text x="76.0" y="327.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">做法</text>
    <text x="76.0" y="351.0" font-size="18" font-weight="600">作者的順序：類介面註解、方法介面注</text>
    <text x="76.0" y="375.0" font-size="18" font-weight="600">釋和簽名、實例變數、方法體</text>
    <text x="76.0" y="401.0" font-size="15">方法體先留空，反覆修改介面註解直到基本結構</text>
    <text x="76.0" y="424.0" font-size="15">合理。寫每個方法體之前先寫它的介面註解，這</text>
    <text x="76.0" y="447.0" font-size="15">樣能專注於抽象和介面，程式碼寫完時註解也寫</text>
