<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1063" role="img" aria-labelledby="ch07-storym-title ch07-storym-desc">
  <title id="ch07-storym-title">从一个几乎全是透传方法的类，到每一层都提供不同的抽象</title>
  <desc id="ch07-storym-desc">本章回顾。从一个几乎全是透传方法的类，到每一层都提供不同的抽象。起点：学生的文本编辑器里，一个类 15 个方法有 13 个只是转调另一个类。TextDocument 的 insertString 只是把参数交给 TextArea 的同名方法。这样的方法增加了接口却没有增加功能，还在两个类之间建立了依赖：下层改签名，上层也得改。；判断：问一句：这两个类各自负责什么？。透传方法说明两个类的职责划分不清：插入文本的接口在 TextDocument，实现却全在 TextArea。接口和实现应放在同一个类里。学生把三个类调整成两个，透传方法就消失了。；推广：同样的问题还会出现在装饰器、类的接口与实现、透传变量上。为加缓冲单独包一层 BufferedInputStream，样板多、方法浅；文本内部按行存储，接口就照搬按行，类就不深；证书参数从 main 一路传到 m3，中间方法都得知道它。；做法：让每个设计元素都消除比它自身更多的复杂性。缓冲直接加进基础类；接口面向字符，拆行拼行封装在文本类内部；全局状态放进上下文对象，只经构造函数传递。签名相同也可以：分发器和同一接口的多种实现都提供了新功能。。这一章最想强调的：每个接口、参数或类都会增加复杂性，只有消除更多复杂性时才值得引入 透传方法、层层包装的装饰器和透传变量都没通过这个检验；上下文对象也远非理想，是作者目前找到的最好办法</desc>
