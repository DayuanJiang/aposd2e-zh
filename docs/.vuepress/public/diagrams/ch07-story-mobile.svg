    <text x="76.0" y="182.0" font-size="18" font-weight="600">有 13 个只是转调另一个类</text>
    <text x="76.0" y="208.0" font-size="15">TextDocument 的 insertString 只是把参数交</text>
    <text x="76.0" y="231.0" font-size="15">给 TextArea 的同名方法。这样的方法增加了接</text>
    <text x="76.0" y="254.0" font-size="15">口却没有增加功能，还在两个类之间建立了依赖：</text>
    <text x="76.0" y="277.0" font-size="15">下层改签名，上层也得改。</text>
