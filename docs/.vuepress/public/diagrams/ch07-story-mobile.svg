    <circle cx="40.0" cy="701.0" r="18" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(31.0,692.0) scale(0.750)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></g>
    <text x="76.0" y="689.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">做法</text>
    <text x="76.0" y="713.0" font-size="18" font-weight="600">让每个设计元素都消除比它自身更多的复</text>
    <text x="76.0" y="737.0" font-size="18" font-weight="600">杂性</text>
    <text x="76.0" y="763.0" font-size="15">缓冲直接加进基础类；接口面向字符，拆行拼行</text>
    <text x="76.0" y="786.0" font-size="15">封装在文本类内部；全局状态放进上下文对象，</text>
    <text x="76.0" y="809.0" font-size="15">只经构造函数传递。签名相同也可以：分发器和</text>
    <text x="76.0" y="832.0" font-size="15">同一接口的多种实现都提供了新功能。</text>
