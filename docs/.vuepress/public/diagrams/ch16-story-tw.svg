<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 842" role="img" aria-labelledby="ch16-story-title ch16-story-desc">
  <title id="ch16-story-title">從“最少改哪些程式碼”的心態，到每次修改都改善設計</title>
  <desc id="ch16-story-desc">本章回顧。從“最少改哪些程式碼”的心態，到每次修改都改善設計。起點：修復缺陷或加功能時，典型心態是“最少需要改動哪些程式碼”。開發人員對要改的程式碼沒有把握，擔心改動越大風險越大。但每次最小改動都會加進一些特殊情況和依賴，設計就變差一點；系統每演進一步，問題就多積累一些。；主張：理想情況下，每次修改完成後，系統結構都應如同一開始就考慮了這次變更。面對變更先問現有設計是否仍然最佳，需要就重構。作者承認期限緊迫時，可能只能用兩小時的修補代替三個月的重構；但要問自己在當前限制下是否已做到最好。；位置：註解放在開發人員修改程式碼時最容易看到的地方。介面註解最好緊靠方法體，改方法時就能看到並更新；實作註解放到各階段程式碼正上方。變更的微妙原因若只寫在提交訊息裡，後人可能撤銷它而重新引入缺陷，所以要寫進程式碼。；去重：每個設計決策儘量只記錄一次，其他地方用一句話指向它。影響多處的變數行為寫在宣告旁；找不到自然位置就集中到 designNotes 檔案，程式碼裡一句註解指過去。HTTP 協議、使用者手冊裡已有的內容，附上引用即可。；收尾：提交前檢查一遍變更；更高層級的註解更容易維護。提交之前，花幾分鐘確認文件準確反映了每項變更，也可能順帶發現遺留的除錯程式碼。比程式碼更抽象的註解只在整體行為變化時才需要更新，最有用的註解往往也最容易維護。。這一章最想強調的：修改現有程式碼時也要戰略式思考：如果沒有讓設計變好，你就很可能正在讓它變壞 確保註解及時更新的最佳方法，是把它放在所描述的程式碼附近，並且每個設計決策儘量只記錄一次</desc>
