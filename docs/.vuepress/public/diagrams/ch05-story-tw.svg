<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 719" role="img" aria-labelledby="ch05-story-title ch05-story-desc">
  <title id="ch05-story-title">從先讀請求再解析的兩個類，到把 HTTP 的全部知識放進一個類</title>
  <desc id="ch05-story-desc">本章回顧。從先讀請求再解析的兩個類，到把 HTTP 的全部知識放進一個類。起點：資訊隱藏：每個模組封裝一些設計決策。B 樹怎樣存資料、TCP 怎樣實作、JSON 怎樣解析，這些知識放在實作裡，介面看不到。好處有兩個：介面更簡單，使用者認知負荷更低；這項決策要改時，只動這一個模組。；問題：資訊洩露：同一項知識出現在多個模組。讀檔案和寫檔案兩個類都懂同一種檔案格式，格式一變兩個類都得改，這種後門洩露比介面洩露更隱蔽。常見原因是時間順序分解：按先做什麼、後做什麼來拆類。；例子：HTTP 專案裡學生做對和做淺的地方。先讀請求再解析，拆成兩個類，兩個類都得懂請求結構，合併成一個更好。回傳整個參數對映的方法太淺，應按名字回傳單個參數值。響應版本、日期標頭應由函式庫自動填好。；結論：按完成任務需要的知識來劃分模組。讓類稍大一些常能改善資訊隱藏：相關程式碼放在一起，介面的抽象層級更高。類內部同樣適用：每個私有方法藏一點資訊，實例變數儘量少地方用。。這一章最想強調的：設計模組時，專注於完成每個任務需要哪些知識，讓每個模組封裝其中幾項 隱藏有限度：模組外部確實需要的資訊（例如需要調整的效能參數）必須公開</desc>
