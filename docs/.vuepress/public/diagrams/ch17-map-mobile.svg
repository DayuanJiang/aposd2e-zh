<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 622" role="img" aria-labelledby="ch17m-title ch17m-desc">
  <title id="ch17m-title">一致性为什么重要，怎么保持？</title>
  <desc id="ch17m-desc">本章概览。一致性为什么重要，怎么保持？ 本章的主要部分：写下约定：全局约定写成文档，局部约定写进代码；自动检查：写工具自动检查，通过才能提交；入乡随俗：先看现有代码怎么做，照着做；不改旧约定：有更好的想法也不足以引入不一致。一句话：理解一处就能理解其他地方，失误更少；靠写下约定、自动检查、入乡随俗来保持</desc>
  <rect width="420" height="622" fill="var(--diagram-bg,#e7eae6)"/>
