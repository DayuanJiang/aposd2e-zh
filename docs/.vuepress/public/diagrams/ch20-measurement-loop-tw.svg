<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 565" role="img" aria-labelledby="ch20-measurement-loop-title ch20-measurement-loop-desc">
  <title id="ch20-measurement-loop-title">實測收益是否值得新增複雜性</title>
  <desc id="ch20-measurement-loop-desc">當前測量保留基線並深入定位熱點，熱點修改後的測量與基線在同條件比較處匯合。統一判斷實測收益是否值得新增複雜性：值得才有保留理由，無可測收益或收益不足都走撤銷一支。獨立簡化設計是另一個可評估的保留依據，沒有數值閾值。</desc>
  <defs><marker id="ch20-measurement-loop-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#5c645d)" /></marker></defs>
  <rect width="680" height="565" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" fill="var(--diagram-ink,#303630)">
    <text x="24" y="33" font-size="21" font-weight="600">有可測提升，還要問是否值得</text><text x="24" y="60" font-size="14">20.2 · 定位熱點與前後比較是兩個問題；不設虛構的數值門檻</text>
    <rect x="24" y="87" width="190" height="51" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" /><text x="119" y="118" text-anchor="middle">測量當前系統</text>
    <rect x="280" y="87" width="190" height="51" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)" /><text x="375" y="118" text-anchor="middle">深入定位具體熱點</text>
    <rect x="24" y="208" width="190" height="54" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" /><text x="119" y="241" text-anchor="middle">儲存修改前基線</text>
    <rect x="280" y="208" width="190" height="54" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" /><text x="375" y="241" text-anchor="middle">修改熱點，再測量</text>
    <g fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch20-measurement-loop-arrow)"><path d="M214 112H280" /><path d="M119 138V208" /><path d="M375 138V208" /><path d="M119 262V287H224V320" /><path d="M375 262V287H446V320" /></g>
    <text x="493" y="218" font-size="14">基線不參與修改，</text><text x="493" y="244" font-size="14">留作可比的參照。</text>
    <rect x="119" y="320" width="442" height="72" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)" />
    <text x="340" y="348" text-anchor="middle">同條件比較後，實測收益</text><text x="340" y="377" text-anchor="middle" font-weight="600">值得新增複雜性嗎？</text>
    <g fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch20-measurement-loop-arrow)"><path d="M224 392V415H164V439" /><path d="M446 392V415H509V439" /></g>
    <text x="164" y="462" text-anchor="middle" fill="var(--diagram-primary,#0b6f5d)">是：有理由保留</text>
    <text x="509" y="462" text-anchor="middle" fill="var(--diagram-danger,#a03946)">否：無收益，或收益不足</text>
    <text x="509" y="488" text-anchor="middle">撤銷新增複雜性</text>
    <path d="M24 507H656" stroke="var(--diagram-line,#aebbad)" />
    <text x="24" y="533" font-size="14">若改動獨立簡化設計，可據此另行評估保留；仍須滿足行為要求。</text>
    <text x="24" y="556" font-size="14">“收益不足”包含雖能測到提升、卻不足以抵償複雜性的情況。</text>
  </g>
</svg>
