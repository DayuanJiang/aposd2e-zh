<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 364" role="img" aria-labelledby="ch05-title ch05-desc">
  <title id="ch05-title">模块里该藏什么，泄露了怎么看出来？</title>
  <desc id="ch05-desc">本章概览。模块里该藏什么，泄露了怎么看出来？ 本章的主要部分：信息泄露：同一知识在多个模块，改一处得改多处；信息隐藏：设计决策只放在一个模块的实现里。一句话：每个模块封装一些设计决策，不让别的模块看到；同一项知识出现在多处，就是泄露</desc>
  <rect width="960" height="364" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch05-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">模块里该藏什么，泄露了怎么看出来？</text>
    <rect x="32.0" y="84.0" width="418.0" height="162.0" rx="12" fill="var(--diagram-danger-soft,#ead9dc)"/>
    <g transform="translate(52.0,102.0) scale(1.083)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></g>
    <text x="88.0" y="122.0" font-size="20" font-weight="600">信息泄露：同一知识散在多处</text>
    <g transform="translate(52.0,146.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
    <text x="76.0" y="159.0" font-size="15">读、写两个类都懂同一文件格式</text>
    <g transform="translate(52.0,176.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
    <text x="76.0" y="189.0" font-size="15">按先后顺序拆类，都得懂同一结构</text>
    <g transform="translate(52.0,206.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
    <text x="76.0" y="219.0" font-size="15">内部怎么存数据，原样交给调用者</text>
    <rect x="510.0" y="84.0" width="418.0" height="162.0" rx="12" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <g transform="translate(530.0,102.0) scale(1.083)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
    <text x="566.0" y="122.0" font-size="20" font-weight="600">信息隐藏：知识只在一处</text>
    <g transform="translate(530.0,146.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
    <text x="554.0" y="159.0" font-size="15">文件格式的知识只放在一个类里</text>
    <g transform="translate(530.0,176.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
    <text x="554.0" y="189.0" font-size="15">合并成一个类，调用一个方法就够</text>
    <g transform="translate(530.0,206.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
    <text x="554.0" y="219.0" font-size="15">按名字取值，内部怎么存不用管</text>
    <path d="M462.0 165.0 L498.0 165.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch05-arrow)"/>
    <text x="480.0" y="151.0" font-size="13" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">改为</text>
    <rect x="32.0" y="268.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="50.0" y="289.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="50.0" y="319.0" font-size="21" font-weight="600">每个模块封装一些设计决策，不让别的模块看到；同一项知识出现在多处，就是泄露</text>
  </g>
</svg>
