<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" role="img" aria-labelledby="ch06-title ch06-desc">
  <title id="ch06-title">介面要多通用才合適？</title>
  <desc id="ch06-desc">本章概覽。介面要多通用才合適？ 本章的主要部分：介面足夠通用：兩個通用方法，替代大量專用方法；三個自問：最簡單的介面？幾種用途？當前好用嗎？；專用程式碼上移下移：介面細節上移，裝置差異下移到驅動；消除特殊情況：用空選區表示沒有選區，省去檢查。一句話：適度通用：功能反映當前需求，介面不侷限於當前用途；專用程式碼與通用程式碼分開</desc>
  <rect width="960" height="452" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch06-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">介面要多通用才合適？</text>
    <rect x="32.0" y="84.0" width="896.0" height="70.0" rx="12" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <g transform="translate(52.0,105.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></g>
    <text x="94.0" y="114.0" font-size="20" font-weight="600">目標：介面適度通用</text>
    <text x="94.0" y="138.0" font-size="15" fill="var(--diagram-muted,#5c645d)">作者教幾輪課後發現，通用類幾乎總是優於專用類，程式碼更少</text>
    <rect x="32.0" y="172.0" width="210.5" height="162.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <rect x="46.0" y="260" width="182.5" height="1" fill="var(--diagram-line,#aebbad)" />
    <g transform="translate(46.0,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6" /><polyline points="8 6 2 12 8 18" /></g>
    <text x="46.0" y="248.0" font-size="18" font-weight="600">介面足夠通用</text>
    <text x="46.0" y="282.0" font-size="15" fill="var(--diagram-muted,#5c645d)">兩個通用方法，替代大量</text>
    <text x="46.0" y="304.0" font-size="15" fill="var(--diagram-muted,#5c645d)">專用方法</text>
    <rect x="260.5" y="172.0" width="210.5" height="162.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <rect x="274.5" y="260" width="182.5" height="1" fill="var(--diagram-line,#aebbad)" />
    <g transform="translate(274.5,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" /></g>
    <text x="274.5" y="248.0" font-size="18" font-weight="600">三個自問</text>
    <text x="274.5" y="282.0" font-size="15" fill="var(--diagram-muted,#5c645d)">最簡單的介面？幾種用途？</text>
    <text x="274.5" y="304.0" font-size="15" fill="var(--diagram-muted,#5c645d)">當前好用嗎？</text>
    <rect x="489.0" y="172.0" width="210.5" height="162.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <rect x="503.0" y="260" width="182.5" height="1" fill="var(--diagram-line,#aebbad)" />
    <g transform="translate(503.0,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5" /><path d="M8 3H3v5" /><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3" /><path d="m15 9 6-6" /></g>
    <text x="503.0" y="248.0" font-size="18" font-weight="600">專用程式碼上移下移</text>
    <text x="503.0" y="282.0" font-size="15" fill="var(--diagram-muted,#5c645d)">介面細節上移，裝置差異</text>
    <text x="503.0" y="304.0" font-size="15" fill="var(--diagram-muted,#5c645d)">下移到驅動</text>
    <rect x="717.5" y="172.0" width="210.5" height="162.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <rect x="731.5" y="260" width="182.5" height="1" fill="var(--diagram-line,#aebbad)" />
    <g transform="translate(731.5,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></g>
    <text x="731.5" y="248.0" font-size="18" font-weight="600">消除特殊情況</text>
    <text x="731.5" y="282.0" font-size="15" fill="var(--diagram-muted,#5c645d)">用空選區表示沒有選區，</text>
    <text x="731.5" y="304.0" font-size="15" fill="var(--diagram-muted,#5c645d)">省去檢查</text>
    <rect x="32.0" y="356.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="50.0" y="377.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="50.0" y="407.0" font-size="21" font-weight="600">適度通用：功能反映當前需求，介面不侷限於當前用途；專用程式碼與通用程式碼分開</text>
  </g>
