<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 716" role="img" aria-labelledby="ch01-two-levers-m-title ch01-two-levers-m-desc">
  <title id="ch01-two-levers-m-title">消除规则，还是隔离规则？</title>
  <desc id="ch01-two-levers-m-desc">教学示例。两个同义名称合为一个，区别消失。封装前调用者包含 R 识别格式和 D 解码，封装后调用者只调用 load(file)，R 和 D 完整保留在文件模块内。两种方法可并用，无强制顺序。</desc>
  <defs><marker id="ch01-two-levers-m-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="360" height="716" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="var(--diagram-ink,#303630)">
    <text x="16" y="32" font-size="19" font-weight="600">消除规则，还是隔离规则？</text>
    <text x="16" y="59" font-size="14" fill="var(--diagram-muted,#5c645d)">教学示例：知识消失，或改变归属</text>
    <text x="16" y="96" font-weight="600">消除：本例中两个名称含义相同</text>
    <rect x="16" y="114" width="138" height="53" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)"/>
    <rect x="212" y="114" width="132" height="53" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/>
    <text x="28" y="146" font-family="ui-monospace,monospace" font-size="14">size / length</text><text x="232" y="146" font-family="ui-monospace,monospace">length</text>
    <path d="M163 140H202" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch01-two-levers-m-arrow)"/>
    <text x="16" y="196" font-size="14">不再需要记住这条命名区别。</text>
    <path d="M16 213H344" stroke="var(--diagram-line,#aebbad)"/>
    <text x="16" y="244" font-weight="600">封装前：R、D 都由调用者掌握</text>
    <rect x="16" y="260" width="328" height="133" rx="4" fill="none" stroke="var(--diagram-secondary,#2c6096)"/>
    <text x="32" y="285" font-weight="600">调用者边界</text>
    <rect x="32" y="299" width="296" height="32" fill="var(--diagram-secondary-soft,#dce4ed)"/><text x="48" y="321">R　识别格式</text>
    <rect x="32" y="345" width="296" height="32" fill="var(--diagram-primary-soft,#d6e5dc)"/><text x="48" y="367">D　解码</text>
    <text x="16" y="428" font-weight="600">封装后：R、D 原样移入模块</text>
    <rect x="16" y="444" width="328" height="51" rx="4" fill="none" stroke="var(--diagram-secondary,#2c6096)"/>
    <text x="32" y="475">调用者：load(file)</text>
    <path d="M180 501V523" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch01-two-levers-m-arrow)"/><text x="196" y="518" font-size="13">调用</text>
    <rect x="16" y="534" width="328" height="106" rx="4" fill="none" stroke="var(--diagram-primary,#0b6f5d)"/>
    <text x="32" y="559" font-weight="600">文件模块边界</text>
    <rect x="32" y="570" width="296" height="26" fill="var(--diagram-secondary-soft,#dce4ed)"/><text x="48" y="589">R　识别格式</text>
    <rect x="32" y="604" width="296" height="26" fill="var(--diagram-primary-soft,#d6e5dc)"/><text x="48" y="623">D　解码</text>
    <text x="16" y="670" font-weight="600">两种手段可以并用，没有规定顺序。</text>
    <text x="16" y="696" font-size="13" fill="var(--diagram-muted,#5c645d)">封装不意味着模块间没有依赖。</text>
  </g>
</svg>
