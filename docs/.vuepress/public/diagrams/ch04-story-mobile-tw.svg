<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 947" role="img" aria-labelledby="ch04-storym-title ch04-storym-desc">
  <title id="ch04-storym-title">從 Java 讀檔案要三個物件，到 Unix 用五個系統呼叫做完全部檔案 I/O</title>
  <desc id="ch04-storym-desc">本章回顧。從 Java 讀檔案要三個物件，到 Unix 用五個系統呼叫做完全部檔案 I/O。起點：模組化設計：一次只面對一小塊複雜性。系統分成類、子系統、服務等模組，每個模組有介面和實作。理想是各模組完全獨立，但模組要互相呼叫，依賴不可避免；目標是讓依賴儘量少，介面比實作簡單得多。；問題：淺模組與多類症：小類多了介面就多。課程裡有個方法只是往表裡放一個空值，理解它的介面並不比讀實作簡單。Java 讀一個檔案要依次建三個物件，緩衝還得單獨請求，忘了就變慢。；轉折：最好的模組是深的：介面簡單，功能多。Unix 檔案 I/O 只有 open、read、write、lseek、close 五個呼叫，實作卻有幾十萬行。幾十年來實作大改，介面沒變。垃圾收集器甚至沒有介面，也在悄悄回收記憶體。；做法：讓常見情況儘可能簡單。幾乎所有檔案 I/O 都要緩衝，就應該預設提供，不需要的少數人再去關掉。Unix 把順序讀寫作為預設，只有隨機存取才需要了解 lseek。更多或更大的介面不一定更好。。這一章最想強調的：設計類時最重要的是讓它足夠深：常見用例介面簡單，功能卻豐富 連結串列這樣的淺類有時不可避免也有用，只是在管理複雜性上幫不了多少；小模組往往很淺</desc>
