    <text x="118.0" y="503.0" font-size="19" font-weight="600">增量开发意味着持续重新设计</text>
    <text x="118.0" y="529.0" font-size="15">瀑布式把设计集中在开始，问题要到实现推进很久后才显现，只能修修补补。增量开发在系统还小时就修正设计问题，所以</text>
