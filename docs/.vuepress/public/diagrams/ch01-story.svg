<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 719" role="img" aria-labelledby="ch01-story-title ch01-story-desc">
  <title id="ch01-story-title">写软件不受物理定律约束，真正的限制是我们能理解多复杂的系统</title>
  <desc id="ch01-story-desc">本章回顾。写软件不受物理定律约束，真正的限制是我们能理解多复杂的系统。起点：写软件几乎不受现实条件约束。写软件不像造桥，不受物理定律限制，脑中构想出的系统很可能就能实现。于是最大的限制变成了我们理解自己所造系统的能力。；问题：复杂性日积月累，拖慢开发、带来缺陷。程序不断演进、功能不断增加，组件之间产生微妙的依赖。复杂性减慢开发速度并导致缺陷，缺陷又进一步拖慢开发。好工具有帮助，但仅靠工具终究有限。；转折：两条路：消除复杂性，或封装复杂性。第一条路是消除复杂性，例如消除特殊情况、一致地使用标识符。第二条路是模块化设计：把系统分成相对独立的模块，开发一个模块时不必同时面对全部复杂性。；做法：增量开发意味着持续重新设计。瀑布式把设计集中在开始，问题要到实现推进很久后才显现，只能修修补补。增量开发在系统还小时就修正设计问题，所以要始终考虑设计，并在计划里为改进留出时间。。这一章最想强调的：降低复杂性是软件设计最重要的要素，开发人员应始终考虑复杂性 这些原则用来比较备选方案，每条都有例外，用过头会适得其反，要把握分寸</desc>
