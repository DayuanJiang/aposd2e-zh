    <text x="118.0" y="380.0" font-size="19" font-weight="600">两条路：消除复杂性，或封装复杂性</text>
    <text x="118.0" y="406.0" font-size="15">第一条路是消除复杂性，例如消除特殊情况、一致地使用标识符。第二条路是模块化设计：把系统分成相对独立的模块，开</text>
