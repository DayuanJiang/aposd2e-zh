<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 842" role="img" aria-labelledby="ch10-story-title ch10-story-desc">
  <title id="ch10-story-title">从 Tcl 中会报错的 unset 命令，到在定义上让错误消失</title>
  <desc id="ch10-story-desc">本章回顾。从 Tcl 中会报错的 unset 命令，到在定义上让错误消失。起点：异常处理代码本来就难写、难测，还占了系统很大一部分。从文件读一组 tweet，光是 try-catch 样板就比正常代码多。处理代码还会引发新异常：重发的包也许只是延迟，对端又收到重复的包。这些代码很少运行，缺陷长期发现不了。；反思：作者自己的错误：Tcl 的 unset 在变量不存在时报错。本意是帮开发者发现缺陷，可 unset 最常见的用途是清理临时状态，操作中途中止时说不清建了哪些变量，大家只好用 catch 捕获后忽略。作者称这是 Tcl 设计中最大的错误之一。；转折：通过定义来规避错误：把 unset 定义成“确保变量不再存在”。Unix 删除正在使用的文件时先标记、让删除成功返回，所有进程关闭后再释放数据；Java 的 substring 若能自动调整越界索引，接口更简单，功能却更多，方法更深。；做法：规避不了的：在底层屏蔽，或传到顶层聚合，或者让程序崩溃。TCP 在内部重发丢包，NFS 客户端一直重试让应用挂起等待；Web 服务器让参数缺失的异常传到分发器统一生成错误响应；内存耗尽这类少见又难处理的错误，打印信息后中止。；界限：做过头了：屏蔽所有网络异常的模块，让应用程序无法知道消息是否丢失。处理异常和其他设计问题一样，要分清什么重要、什么不重要：不重要的信息尽量隐藏，调用者真正需要的信息必须暴露，即使这会让接口更复杂。。这一章最想强调的：减少必须处理异常的地方；最好的办法是重新定义语义，让错误条件消失 前提是模块外部用不到这些异常信息；作者认为减少代码缺陷的最好方法是简化软件</desc>
