<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 708" role="img" aria-labelledby="ch18-event-trace-m-title ch18-event-trace-m-desc">
  <title id="ch18-event-trace-m-title">應用登記資料決定同一派發點的目標</title>
  <desc id="ch18-event-trace-m-desc">自擬的兩次獨立執行先由應用初始化程式碼分別記錄 E 到 A 和 E 到 B，再由同一派發程式碼查詢各自關係而呼叫 A 或 B。虛線從應用初始化出發，實線用於讀取與呼叫，不表示處理函式自注冊。原 failed 註解只補呼叫條件和執行緒上下文。</desc>
  <defs><marker id="ch18-event-trace-m-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#5c645d)" /></marker></defs>
  <rect width="360" height="708" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" fill="var(--diagram-ink,#303630)">
    <text x="16" y="31" font-size="19" font-weight="600">同一呼叫點，不同登記目標</text><text x="16" y="57" font-size="14">18.2 · E、A/B 為教學示意，不是具體 API</text>
    <rect x="16" y="80" width="296" height="58" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" /><text x="164" y="104" text-anchor="middle">應用初始化程式碼登記</text><text x="164" y="127" text-anchor="middle" font-size="14">下面是兩次獨立執行，不是同時登記</text>
    <g fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" stroke-dasharray="5 4"><path d="M312 108H336V370" /><path d="M336 200H312" marker-end="url(#ch18-event-trace-m-arrow)" /><path d="M336 370H312" marker-end="url(#ch18-event-trace-m-arrow)" /></g>
    <rect x="16" y="174" width="296" height="52" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)" /><text x="164" y="206" text-anchor="middle">執行甲：登記 E → A</text>
    <path d="M164 226V260" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch18-event-trace-m-arrow)" />
    <text x="16" y="286">同一派發程式碼收到 E，查登記關係</text><text x="16" y="313" fill="var(--diagram-primary,#0b6f5d)">查到 A → 呼叫處理函式 A</text>
    <rect x="16" y="344" width="296" height="52" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)" /><text x="164" y="376" text-anchor="middle">執行乙：登記 E → B</text>
    <path d="M164 396V430" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch18-event-trace-m-arrow)" />
    <text x="16" y="456">同一派發程式碼收到 E，查登記關係</text><text x="16" y="483" fill="var(--diagram-primary,#0b6f5d)">查到 B → 呼叫處理函式 B</text>
    <path d="M16 508H344" stroke="var(--diagram-line,#aebbad)" />
    <text x="16" y="538" font-weight="600">原例 failed() 的註解另補充：</text>
    <text x="16" y="566" font-size="14">傳輸錯誤使 RPC 無法完成時，</text><text x="16" y="590" font-size="14">由 transport 在 dispatch thread 呼叫。</text>
    <text x="16" y="620" font-size="14">這不替代具體登記資料；不是自注冊迴路。</text>
    <text x="16" y="653" font-size="14">虛線：應用初始化寫入關係。</text><text x="16" y="678" font-size="14">實線：派發時讀取並呼叫。</text>
  </g>
</svg>
