<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 542" role="img" aria-labelledby="ch22-title ch22-desc">
  <title id="ch22-title">全書只討論一件事，是什麼？</title>
  <desc id="ch22-desc">本章概覽。全書只討論一件事，是什麼？ 本章的主要部分：根本原因：依賴性：牽連別處；模糊性：資訊不顯眼；危險訊號：資訊洩露、不必要的錯誤情況等；減少複雜性的思路：深而通用的類，透過定義來規避錯誤；投資思維：早期多花時間做設計，回報很快到來。一句話：複雜性：找到根源，用危險訊號識別它，用深模組等思路減少它，堅持投資思維</desc>
  <rect width="960" height="542" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch22-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">全書只討論一件事，是什麼？</text>
    <text x="32.0" y="94.0" font-size="15" fill="var(--diagram-muted,#5c645d)">應對複雜性是軟體設計最重要的挑戰</text>
    <rect x="32.0" y="114.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <g transform="translate(50.0,132.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></g>
    <text x="92.0" y="142.0" font-size="18" font-weight="600">投資思維</text>
    <text x="92.0" y="164.0" font-size="15" fill="var(--diagram-muted,#5c645d)">早期多花時間做設計，回報很快到來</text>
    <rect x="32.0" y="186.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <g transform="translate(50.0,204.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" /><path d="M12 22V12" /><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7" /><path d="m7.5 4.27 9 5.15" /></g>
    <text x="92.0" y="214.0" font-size="18" font-weight="600">減少複雜性的思路</text>
    <text x="92.0" y="236.0" font-size="15" fill="var(--diagram-muted,#5c645d)">深而通用的類，透過定義來規避錯誤</text>
    <rect x="32.0" y="258.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <g transform="translate(50.0,276.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></g>
    <text x="92.0" y="286.0" font-size="18" font-weight="600">危險訊號</text>
    <text x="92.0" y="308.0" font-size="15" fill="var(--diagram-muted,#5c645d)">資訊洩露、不必要的錯誤情況等</text>
    <rect x="32.0" y="330.0" width="896.0" height="64.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <g transform="translate(50.0,348.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1" /><rect x="2" y="16" width="6" height="6" rx="1" /><rect x="9" y="2" width="6" height="6" rx="1" /><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3" /><path d="M12 12V8" /></g>
    <text x="92.0" y="358.0" font-size="18" font-weight="600">根本原因</text>
    <text x="92.0" y="380.0" font-size="15" fill="var(--diagram-muted,#5c645d)">依賴性：牽連別處；模糊性：資訊不顯眼</text>
    <text x="928.0" y="416.0" font-size="13" fill="var(--diagram-muted,#5c645d)" text-anchor="end">閱讀順序：先根源，再識別和減少，最後是投入的心態</text>
    <rect x="32.0" y="446.0" width="896.0" height="68.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="50.0" y="467.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="50.0" y="497.0" font-size="21" font-weight="600">複雜性：找到根源，用危險訊號識別它，用深模組等思路減少它，堅持投資思維</text>
  </g>
</svg>
