    <text x="74.0" y="129.0" font-size="18" font-weight="600">绕不开的复杂性</text>
    <text x="74.0" y="154.0" font-size="15" fill="var(--diagram-muted,#5c645d)">文本按行存储，界面却要在行中插入</text>
