    <text x="22.0" y="44.0" font-size="23" font-weight="600">绕不开的复杂性，该由谁来处理？</text>
    <text x="22.0" y="80.0" font-size="13" fill="var(--diagram-muted,#5c645d)">接口简单比实现简单更重要：使用者比开发人员多</text>
