    <text x="36.0" y="479.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="36.0" y="505.0" font-size="17" font-weight="600">与模块功能相关的复杂性，通常由模块内部</text>
    <text x="36.0" y="531.0" font-size="17" font-weight="600">处理：多费一点力气，让使用者少费些力气</text>
