<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 570" role="img" aria-labelledby="ch08m-title ch08m-desc">
  <title id="ch08m-title">绕不开的复杂性，该由谁来处理？</title>
  <desc id="ch08m-desc">本章概览。绕不开的复杂性，该由谁来处理？ 本章的主要部分：绕不开的复杂性：文本按行存储，界面却要在行中插入；先问一句：这份复杂性和模块提供的功能有关吗；多数时候自己解决：文本类拆行拼行，协议自己算重试间隔；别做过头：与本类功能密切相关，简化别处和接口。一句话：与模块功能相关的复杂性，通常由模块内部处理：多费一点力气，让使用者少费些力气</desc>
  <rect width="420" height="570" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
