<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 842" role="img" aria-labelledby="ch12-story-title ch12-story-desc">
  <title id="ch12-story-title">從四個不寫註解的藉口，到註解為什麼是抽象的基礎</title>
  <desc id="ch12-story-desc">本章回顧。從四個不寫註解的藉口，到註解為什麼是抽象的基礎。起點：很多生產程式碼幾乎沒有註解，開發人員有四個常見藉口。程式碼是自解釋的；沒有時間；註解容易過時併產生誤導；見過的註解都毫無價值。作者認為文件不足給開發帶來了巨大且不必要的拖累。；反駁：程式碼能表達的設計資訊很少，靠讀程式碼理解會拆出大量淺方法。提取子字串的方法有起始和結束兩個參數，只看宣告不知道結果是否包含結束位置。如果預期使用者讀實作，就會把方法拆得很短，產生大量淺方法，讀者仍要逐個讀懂。；算賬：時間和過時兩個藉口，算一算都不成立。鍵入程式碼的時間不到開發時間的 10%，即使註解和程式碼一樣多，也只多花約 10%。註解只在程式碼大改時才需大改，放在程式碼附近、避免重複，再加程式碼審查，就能保持更新。；主張：註解記錄設計者知道、卻無法用程式碼表達的資訊。沒有註解，方法唯一的抽象就是宣告，使用者必須讀程式碼，複雜性全部暴露出來。好註解提供修改程式碼所需的資訊，減輕認知負荷，也減少未知的未知。；回應：對“註解是一種失敗”這一觀點的回應。《程式碼整潔之道》主張把程式碼塊提取成方法，用方法名代替註解。作者認為這樣會得到冗長晦澀的名稱，每次呼叫都在重複文件；好註解提升程式碼價值，是定義抽象的基礎。。這一章最想強調的：註解的核心作用，是記錄設計者知道、卻無法在程式碼中表達的資訊 好的設計能減少對註解的需求，尤其是方法體中的註解，但註解並不代表失敗：程式碼和註解各有所長</desc>
