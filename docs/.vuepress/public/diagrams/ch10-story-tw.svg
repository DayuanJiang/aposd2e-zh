<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 842" role="img" aria-labelledby="ch10-story-title ch10-story-desc">
  <title id="ch10-story-title">從 Tcl 中會報錯的 unset 命令，到在定義上讓錯誤消失</title>
  <desc id="ch10-story-desc">本章回顧。從 Tcl 中會報錯的 unset 命令，到在定義上讓錯誤消失。起點：例外處理程式碼本來就難寫、難測，還可能佔系統很大一部分。從檔案讀一組 tweet，光是 try-catch 樣板就比正常程式碼多。處理程式碼還可能引發新例外：重發的包也許只是延遲，對端收到重複包。這些程式碼很少執行，缺陷可能長期發現不了。；反思：作者自己的錯誤：Tcl 的 unset 在變數不存在時報錯。本意是幫開發者發現缺陷，可 unset 最常見的用途是清理臨時狀態，操作中途中止時說不清建了哪些變數，大家只好用 catch 捕獲後忽略。作者稱這是 Tcl 設計中最大的錯誤之一。；轉折：透過定義來規避錯誤：unset 本應定義成“確保變數不再存在”。Unix 刪除正在使用的檔案時先標記、讓刪除成功回傳，所有行程關閉後再釋放資料；Java 的 substring 若能自動調整越界索引，介面更簡單，功能卻更多，方法更深。；做法：規避不了的：在底層遮蔽，或傳到頂層聚合，或者讓程式崩潰。TCP 在內部重發丟包，NFS 客戶端一直重試讓應用掛起等待；Web 伺服器讓參數缺失的例外傳到分發器統一生成錯誤響應；記憶體耗盡這類少見又難處理的錯誤，列印資訊後中止。；界限：做過頭了：遮蔽所有網路例外的模組，讓應用程式無法知道訊息是否丟失。處理例外和其他設計問題一樣，要分清什麼重要、什麼不重要：不重要的資訊儘量隱藏，呼叫者真正需要的資訊必須暴露，即使這會讓介面更複雜。。這一章最想強調的：減少必須處理例外的地方；最好的辦法是重新定義語義，讓錯誤條件消失 前提是模組外部用不到這些例外資訊；作者認為減少程式碼缺陷的最好方法是簡化軟體</desc>
