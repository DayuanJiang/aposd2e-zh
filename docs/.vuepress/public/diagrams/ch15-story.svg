<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 719" role="img" aria-labelledby="ch15-story-title ch15-story-desc">
  <title id="ch15-story-title">从拖到最后补的注释，到用注释检验设计</title>
  <desc id="ch15-story-desc">本章回顾。从拖到最后补的注释，到用注释检验设计。起点：几乎所有人都把注释推迟到编码和测试完成之后。理由是代码还在变，等稳定了再写。结果往往是拖到最后根本不写；即使回头补，心思已在下一个项目上，设计时的考虑也记不清了，写出来的多半只是在重复代码。；做法：作者的顺序：类接口注释、方法接口注释和签名、实例变量、方法体。方法体先留空，反复修改接口注释直到基本结构合理。写每个方法体之前先写它的接口注释，这样能专注于抽象和接口，代码写完时注释也写完了。；发现：注释是设计工具：方法需要很长的注释，就是抽象不够好的危险信号。注释是完整描述抽象的唯一方式。接口注释简短又完整，说明接口简单；接口注释必须描述实现的主要特性，说明方法是浅的。先写注释，就能在写实现之前检查和调整抽象。；算账：先写注释不贵，还可能更省时间，而且更有趣。键入代码和注释的时间不到开发总时间的 10%，注释很可能不到 5%，推迟只省下其中一小部分。先写注释让抽象在编码前更稳定，改动更少；作者也觉得这一阶段最有趣。。这一章最想强调的：编写注释的最佳时机是开发之初；先写注释，文档就成了设计过程的一部分 只有完整、清晰的注释才能反映复杂性；描述方法或变量的注释若很难写得简单而完整，设计可能有问题</desc>
