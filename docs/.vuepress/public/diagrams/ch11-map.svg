<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 754" role="img" aria-labelledby="ch11-title ch11-desc">
  <title id="ch11-title">最先想到的设计，为什么不该直接采用？</title>
  <desc id="ch11-desc">本章概览。最先想到的设计，为什么不该直接采用？ 本章的主要部分：勾勒几种方案：文本类可以按行、按单个字符或按任意范围操作。挑差异大的方案，勾勒最重要的几个方法就够；列出各自的优缺点：先看高层软件好不好用：按行接口让界面自己拆行，按字符要写循环；再比通用性和效率；比较后选择或组合：比较之后更容易看出哪个最好：可能是其中一个，也可能把几个方案的特点组合成更好的新设计；都不理想就再来一轮：按行和按字符都让高层软件自己做文本操作，是危险信号；从这个问题出发找到面向范围的接口。一句话：设计很难，第一个想法很少是最好的。每个主要决策都勾勒几种差异大的方案，比较优缺点再选，花的时间远少于实现</desc>
  <rect width="960" height="754" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch11-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">最先想到的设计，为什么不该直接采用？</text>
    <text x="32.0" y="94.0" font-size="15" fill="var(--diagram-muted,#5c645d)">每个主要设计决策都走一遍：就算确定只有一种合理方案，也要想第二种；先选接口，再选实现，更高层级也一样</text>
    <path d="M514.3 257.1 L753.8 334.3" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch11-arrow)"/>
    <path d="M755.7 357.1 L516.2 434.3" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch11-arrow)"/>
    <path d="M445.7 434.9 L206.2 357.7" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch11-arrow)"/>
    <path d="M204.3 334.9 L443.8 257.7" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch11-arrow)"/>
    <circle cx="480.0" cy="246.0" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(466.0,232.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></g>
    <text x="480.0" y="164.0" font-size="18" font-weight="600" text-anchor="middle">勾勒几种方案</text>
    <text x="480.0" y="186.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">文本类可以按行、按单个字符或按任意范围操作。</text>
    <text x="480.0" y="206.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">挑差异大的方案，勾勒最重要的几个方法就够</text>
    <circle cx="790.0" cy="346.0" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(776.0,332.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></g>
    <text x="790.0" y="400.0" font-size="18" font-weight="600" text-anchor="middle">列出各自的优缺点</text>
    <text x="790.0" y="422.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">先看高层软件好不好用：按行接口让</text>
    <text x="790.0" y="442.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">界面自己拆行，按字符要写循环；再</text>
    <text x="790.0" y="462.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">比通用性和效率</text>
    <circle cx="480.0" cy="446.0" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(466.0,432.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></g>
    <text x="480.0" y="500.0" font-size="18" font-weight="600" text-anchor="middle">比较后选择或组合</text>
    <text x="480.0" y="522.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">比较之后更容易看出哪个最好：可能是其中一个，</text>
    <text x="480.0" y="542.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">也可能把几个方案的特点组合成更好的新设计</text>
    <circle cx="170.0" cy="346.0" r="28" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(156.0,332.0) scale(1.167)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></g>
    <text x="170.0" y="400.0" font-size="18" font-weight="600" text-anchor="middle">都不理想就再来一轮</text>
    <text x="170.0" y="422.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">按行和按字符都让高层软件自己做文</text>
    <text x="170.0" y="442.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">本操作，是危险信号；从这个问题出</text>
    <text x="170.0" y="462.0" font-size="14" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">发找到面向范围的接口</text>
    <text x="32.0" y="590.0" font-size="14" fill="var(--diagram-muted,#5c645d)">找到满意的设计就停下，再对下一个决策（例如实现）做同样的事。对一个类，这通常只需一两个小时，远少于实现所需的几天或几周</text>
    <rect x="32.0" y="628.0" width="896.0" height="98.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="50.0" y="649.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="50.0" y="679.0" font-size="21" font-weight="600">设计很难，第一个想法很少是最好的。每个主要决策都勾勒几种差异大的方案，比较优缺点</text>
    <text x="50.0" y="709.0" font-size="21" font-weight="600">再选，花的时间远少于实现</text>
  </g>
</svg>
