    <text x="76.0" y="713.0" font-size="18" font-weight="600">讓每個設計元素都消除比它自身更多的</text>
    <text x="76.0" y="737.0" font-size="18" font-weight="600">複雜性</text>
    <text x="76.0" y="763.0" font-size="15">緩衝直接加進基礎類；介面字元導向，拆行拼行</text>
    <text x="76.0" y="786.0" font-size="15">封裝在文字類內部；全域狀態放進上下文物件，</text>
    <text x="76.0" y="809.0" font-size="15">只經建構函式傳遞。簽名相同也可以：分發器和</text>
    <text x="76.0" y="832.0" font-size="15">同一介面的多種實作都提供了新功能。</text>
