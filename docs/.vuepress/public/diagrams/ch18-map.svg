<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" role="img" aria-labelledby="ch18-title ch18-desc">
  <title id="ch18-title">什么让代码难理解，什么让它易理解？</title>
  <desc id="ch18-desc">本章概览。什么让代码难理解，什么让它易理解？ 本章的主要部分：难理解：读者缺少信息；易理解：把信息交给读者。一句话：写代码时多花几分钟，读者就能快速读懂：靠好名称、一致性、空格和注释，避开 Pair 这类通用容器</desc>
  <rect width="960" height="424" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch18-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="32.0" y="52.0" font-size="30" font-weight="600">什么让代码难理解，什么让它易理解？</text>
    <text x="32.0" y="94.0" font-size="15" fill="var(--diagram-muted,#5c645d)">是否易理解，由读者判断</text>
    <rect x="32.0" y="114.0" width="418.0" height="162.0" rx="12" fill="var(--diagram-danger-soft,#ead9dc)"/>
    <g transform="translate(52.0,132.0) scale(1.083)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></g>
    <text x="88.0" y="152.0" font-size="20" font-weight="600">让读者缺少信息</text>
    <g transform="translate(52.0,176.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
    <text x="76.0" y="189.0" font-size="15">Pair 的两个值只能叫 getKey、getValue</text>
    <g transform="translate(52.0,206.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
    <text x="76.0" y="219.0" font-size="15">看不出事件处理函数何时调用</text>
    <g transform="translate(52.0,236.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
    <text x="76.0" y="249.0" font-size="15">main 返回后，RaftClient 的线程仍在运行</text>
    <rect x="510.0" y="114.0" width="418.0" height="162.0" rx="12" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <g transform="translate(530.0,132.0) scale(1.083)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></g>
    <text x="566.0" y="152.0" font-size="20" font-weight="600">把信息交给读者</text>
    <g transform="translate(530.0,176.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
    <text x="554.0" y="189.0" font-size="15">名称精确，不必通读代码去猜</text>
    <g transform="translate(530.0,206.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
    <text x="554.0" y="219.0" font-size="15">做法一致，见过的模式就懂</text>
    <g transform="translate(530.0,236.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>
    <text x="554.0" y="249.0" font-size="15">注释补上缺少的信息</text>
    <path d="M462.0 195.0 L498.0 195.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch18-arrow)"/>
    <text x="480.0" y="181.0" font-size="13" fill="var(--diagram-muted,#5c645d)" text-anchor="middle">对照</text>
    <rect x="32.0" y="298.0" width="896.0" height="98.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="50.0" y="319.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="50.0" y="349.0" font-size="21" font-weight="600">写代码时多花几分钟，读者就能快速读懂：靠好名称、一致性、空格和注释，避开 Pair</text>
    <text x="50.0" y="379.0" font-size="21" font-weight="600">这类通用容器</text>
  </g>
</svg>
