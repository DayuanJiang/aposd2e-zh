<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 603" role="img" aria-labelledby="ch05m-title ch05m-desc">
  <title id="ch05m-title">模块里该藏什么，泄露了怎么看出来？</title>
  <desc id="ch05m-desc">本章概览。模块里该藏什么，泄露了怎么看出来？ 本章的主要部分：信息泄露：同一设计决策出现在多个模块，改一处就得改多处；信息隐藏：设计决策只在一个模块的实现里，接口更简单，改动只影响这一个模块。一句话：每个模块封装一些设计决策，不让别的模块看到；同一项知识出现在多处，就是泄露</desc>
  <rect width="420" height="603" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch05m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">模块里该藏什么，泄露了怎么看出</text>
    <text x="22.0" y="75.0" font-size="23" font-weight="600">来？</text>
    <text x="22.0" y="111.0" font-size="13" fill="var(--diagram-muted,#5c645d)">每个模块应封装一些设计决策，只放在实现里；同一项知识出现</text>
    <text x="22.0" y="131.0" font-size="13" fill="var(--diagram-muted,#5c645d)">在多个模块，就是泄露，改一处就得改多处</text>
    <rect x="22.0" y="149.0" width="376.0" height="132.0" rx="9" fill="var(--diagram-danger-soft,#ead9dc)"/>
    <circle cx="50.0" cy="175.0" r="14" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" stroke-width="2"/><g transform="translate(42.0,167.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></g>
    <text x="74.0" y="180.0" font-size="18" font-weight="600">信息泄露：同一知识散在多处</text>
    <text x="74.0" y="205.0" font-size="15" fill="var(--diagram-muted,#5c645d)">读文件和写文件两个类都懂同一种文件格式；</text>
    <text x="74.0" y="227.0" font-size="15" fill="var(--diagram-muted,#5c645d)">先读请求、再解析请求，拆成两个类；</text>
    <text x="74.0" y="249.0" font-size="15" fill="var(--diagram-muted,#5c645d)">getParams 直接交出内部的参数映射；让调用</text>
    <text x="74.0" y="271.0" font-size="15" fill="var(--diagram-muted,#5c645d)">者自己填 HTTP 响应版本号</text>
    <rect x="22.0" y="291.0" width="376.0" height="132.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <circle cx="50.0" cy="317.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,309.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
    <text x="74.0" y="322.0" font-size="18" font-weight="600">信息隐藏：知识只在一处</text>
    <text x="74.0" y="347.0" font-size="15" fill="var(--diagram-muted,#5c645d)">文件格式的知识只放在一个类里；读取和解析</text>
    <text x="74.0" y="369.0" font-size="15" fill="var(--diagram-muted,#5c645d)">合并成一个类，只需调用一个方法；</text>
    <text x="74.0" y="391.0" font-size="15" fill="var(--diagram-muted,#5c645d)">getParameter 按名字取值，藏住内部表示；</text>
    <text x="74.0" y="413.0" font-size="15" fill="var(--diagram-muted,#5c645d)">响应版本、日期标头由 HTTP 类自动填好</text>
    <text x="22.0" y="445.0" font-size="13" fill="var(--diagram-muted,#5c645d)">时间顺序分解（按先做什么后做什么拆类）是泄露的常见原因；</text>
    <text x="22.0" y="465.0" font-size="13" fill="var(--diagram-muted,#5c645d)">隐藏有限度，模块外部确实需要的信息必须公开</text>
    <rect x="22.0" y="491.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="36.0" y="512.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="36.0" y="538.0" font-size="17" font-weight="600">每个模块封装一些设计决策，不让别的模块看</text>
    <text x="36.0" y="564.0" font-size="17" font-weight="600">到；同一项知识出现在多处，就是泄露</text>
  </g>
</svg>
