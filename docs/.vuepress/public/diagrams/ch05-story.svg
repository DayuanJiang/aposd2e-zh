<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 719" role="img" aria-labelledby="ch05-story-title ch05-story-desc">
  <title id="ch05-story-title">从先读请求再解析的两个类，到把 HTTP 的全部知识放进一个类</title>
  <desc id="ch05-story-desc">本章回顾。从先读请求再解析的两个类，到把 HTTP 的全部知识放进一个类。起点：信息隐藏：每个模块封装一些设计决策。B 树怎样存数据、TCP 怎样实现、JSON 怎样解析，这些知识放在实现里，接口看不到。好处有两个：接口更简单，使用者认知负荷更低；这项决策要改时，只动这一个模块。；问题：信息泄露：同一项知识出现在多个模块。读文件和写文件两个类都懂同一种文件格式，格式一变两个类都得改，这种后门泄露比接口泄露更隐蔽。常见原因是时间顺序分解：按先做什么、后做什么来拆类。；例子：HTTP 项目里学生做对和做浅的地方。先读请求再解析，拆成两个类，两个类都得懂请求结构，合并成一个更好。返回整个参数映射的方法太浅，应按名字返回单个参数值。响应版本、日期标头应由库自动填好。；结论：按完成任务需要的知识来划分模块。让类稍大一些常能改善信息隐藏：相关代码放在一起，接口的抽象层级更高。类内部同样适用：每个私有方法藏一点信息，实例变量尽量少地方用。。这一章最想强调的：设计模块时，专注于完成每个任务需要哪些知识，让每个模块封装其中几项 隐藏有限度：模块外部确实需要的信息（例如需要调整的性能参数）必须公开</desc>
