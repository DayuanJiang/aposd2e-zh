    <text x="118.0" y="503.0" font-size="19" font-weight="600">按完成任务需要的知识来划分模块</text>
    <text x="118.0" y="529.0" font-size="15">让类稍大一些常能改善信息隐藏：相关代码放在一起，接口的抽象层级更高。类内部同样适用：每个私有方法藏一点信息，</text>
