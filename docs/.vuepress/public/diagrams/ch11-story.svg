<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 842" role="img" aria-labelledby="ch11-story-title ch11-story-desc">
  <title id="ch11-story-title">从直接实现第一个想法，到给每个主要决策想两种以上方案</title>
  <desc id="ch11-story-desc">本章回顾。从直接实现第一个想法，到给每个主要决策想两种以上方案。起点：给文本编辑器设计文本类，最先想到的很可能是面向行的接口。设计很难，最初的想法不太可能就是最佳设计。文本类的接口至少有三种：按行、按单个字符、按任意范围操作。勾勒最重要的几个方法就够，方案之间差异越大，学到的越多。；比较：列出优缺点：按行和按字符的接口，都让高层软件做额外的工作。按行接口下，剪切粘贴跨行内容要界面自己拆行合并；按字符接口下，改多个字符要写循环，还可能慢很多，因为每个字符都要调用一次。还要比接口是否更简单、更通用。；转折：都不理想？以发现的问题为起点，再想新方案。两种方案都让高层软件自己做文本操作，这是危险信号：既然有了文本类，它就该处理所有文本操作。顺着这个问题找，就得到面向范围的接口。最佳选择也可能是几个方案的组合。；做法：每个主要决策都设计两次：接口一次，实现一次，更高层级也一样。实现阶段再比一轮：行的链表、固定大小的字符块、间隙缓冲区，这时最看重简单和性能。对一个类，这只要一两个小时，远少于实现的几天几周，而且会让你越来越会判断好坏设计。；提醒：聪明人反而更难接受设计两次。他们习惯了第一个想法就足够好，尝试多种设计好像就等于承认自己不聪明。作者的看法：大型软件系统的设计真的很难，没有人能靠第一次尝试就做好，这与是否聪明无关。。这一章最想强调的：在每个主要设计决策上都考虑多个方案，最初的想法很少是最好的 花的时间通常远少于实现；对一个类只需一两个小时，收益是明显更好的设计和更强的设计能力</desc>
