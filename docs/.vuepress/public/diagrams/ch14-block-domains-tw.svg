<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 448" role="img" aria-labelledby="ch14-block-domains-t ch14-block-domains-d">
  <title id="ch14-block-domains-t">同一個數字，兩個地址域</title><desc id="ch14-block-domains-d">教學例中檔案塊2對應磁碟塊9。若把邏輯值2直接當作物理塊號，會把無關磁碟塊2清零。不同名稱顯示地址域區別，不可互換型別可進一步限制誤用。</desc>
  <defs><marker id="ch14-block-domains-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--diagram-muted,#58636b)" /></marker></defs>
  <rect width="680" height="448" fill="var(--diagram-bg,#f5f7f8)" />
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" fill="var(--diagram-ink,#263239)">
    <text x="24" y="34" font-size="21" font-weight="600">同一個數字，兩個地址域</text><text x="24" y="69">教學例：檔案內的第 2 號塊，對應磁碟上的第 9 號塊。</text>
    <text x="24" y="109" font-weight="600">檔案邏輯域</text><text x="490" y="109" font-weight="600">磁碟物理域</text>
    <rect x="24" y="128" width="167" height="74" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" /><text x="46" y="155">fileBlock = 2</text><text x="46" y="184">檔案內部的索引</text>
    <rect x="275" y="133" width="131" height="64" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" /><text x="301" y="159">地址對映</text><text x="307" y="183">2 → 9</text>
    <rect x="490" y="128" width="166" height="74" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" /><text x="510" y="155">diskBlock = 9</text><text x="510" y="184">真正對應的塊</text>
    <g stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch14-block-domains-a)"><path d="M192 165H267" /><path d="M407 165H482" /></g>
    <path d="M106 203V292H482" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" marker-end="url(#ch14-block-domains-a)" />
    <text x="138" y="260" fill="var(--diagram-danger,#a03946)">錯誤：把數值 2 直接當作磁碟塊號</text><text x="138" y="317" font-size="14">都叫 block，掩蓋了這次跨域誤用</text>
    <rect x="490" y="254" width="166" height="77" rx="4" fill="var(--diagram-danger-soft,#ead9dc)" /><text x="510" y="281">磁碟塊 2</text><text x="510" y="308">無關資料被清零</text>
    <path d="M24 355H656" stroke="var(--diagram-line,#aebbad)" />
    <text x="24" y="384">名稱區分地址域；不可互換的型別進一步限制混用。</text>
    <text x="24" y="414" font-size="13" fill="var(--diagram-muted,#58636b)">2、9與對映是教學自擬，不是 Sprite 歷史事故的實際塊號或程式碼。</text>
    <text x="24" y="436" font-size="13" fill="var(--diagram-muted,#58636b)">名稱有助於暴露錯誤，但本身不是型別安全保證。</text>
  </g>
</svg>
