    <text x="94.0" y="114.0" font-size="20" font-weight="600">目标：相似的事采用相似做法，不同的事采用不同做法</text>
    <text x="94.0" y="138.0" font-size="15" fill="var(--diagram-muted,#5c645d)">已有知识可以复用，不必从头学习</text>
