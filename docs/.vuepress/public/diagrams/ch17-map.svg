    <text x="503.0" y="248.0" font-size="18" font-weight="600">入乡随俗</text>
    <text x="503.0" y="282.0" font-size="15" fill="var(--diagram-muted,#5c645d)">先看现有代码怎么做，</text>
    <text x="503.0" y="304.0" font-size="15" fill="var(--diagram-muted,#5c645d)">照着做</text>
