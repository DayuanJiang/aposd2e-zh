    <rect x="46.0" y="260" width="182.5" height="1" fill="var(--diagram-line,#aebbad)"/>
    <g transform="translate(46.0,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g>
    <text x="46.0" y="248.0" font-size="18" font-weight="600">写下约定</text>
    <text x="46.0" y="282.0" font-size="15" fill="var(--diagram-muted,#5c645d)">全局约定写成文档，局</text>
    <text x="46.0" y="304.0" font-size="15" fill="var(--diagram-muted,#5c645d)">部约定写进代码</text>
    <rect x="260.5" y="172.0" width="210.5" height="162.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <rect x="274.5" y="260" width="182.5" height="1" fill="var(--diagram-line,#aebbad)"/>
    <g transform="translate(274.5,188.0) scale(1.333)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
    <text x="274.5" y="248.0" font-size="18" font-weight="600">自动检查</text>
    <text x="274.5" y="282.0" font-size="15" fill="var(--diagram-muted,#5c645d)">写工具自动检查，通过才</text>
    <text x="274.5" y="304.0" font-size="15" fill="var(--diagram-muted,#5c645d)">能提交</text>
    <rect x="489.0" y="172.0" width="210.5" height="162.0" rx="10" fill="var(--diagram-secondary-soft,#dce4ed)"/>
