<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 842" role="img" aria-labelledby="ch06-story-title ch06-story-desc">
  <title id="ch06-story-title">从为退格键专门写一个方法，到两个通用方法管所有文本修改</title>
  <desc id="ch06-story-desc">本章回顾。从为退格键专门写一个方法，到两个通用方法管所有文本修改。起点：学生按界面操作给文本类加方法。退格键一个方法，删除键一个方法，删除所选区域再一个。许多方法只在一处调用，界面开发人员却要学一大堆方法；每加一种界面操作，还得去改文本类。；问题：专用化造成信息泄露，还是错误的抽象。退格键、所选区域这些界面概念出现在文本类里，两个类绑在一起，无法独立开发。backspace 方法想藏住删哪些字符，可界面恰恰需要知道这一点，只能去读它的代码。；转折：通用 API 只需 insert 和 delete。退格键写成删除光标前一个字符，删除键写成删除光标后一个字符。代码略长，但一眼能看出删的是什么；文本类总代码更少，还能直接用于查找替换程序。；做法：专用代码总会有，把它和通用代码分开。界面细节上移到界面层，设备差异下移到驱动程序。撤销机制中，History 类只管操作列表，各种具体操作由懂它的模块实现，将来加新操作不用改它。；细节：方法体里也一样：消除特殊情况。学生用一个状态变量表示有没有所选区域，结果到处都是检查。让所选区域始终存在，没有时就是起止相同的空选区，复制、删除的代码不用特殊处理也能正确。。这一章最想强调的：过度专用化可能是软件最大的复杂性来源；通用的模块更深、代码更少 要适度：功能反映当前需求，接口不局限于当前用途；对当前需求不好用，说明通用过头了</desc>
