<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 455" role="img" aria-labelledby="ch09-logging-locality-t ch09-logging-locality-d">
  <title id="ch09-logging-locality-t">這條日誌為什麼不需要一個專用包裝類？</title><desc id="ch09-logging-locality-d">分離的錯誤檢測點和日誌包裝方法要來回閱讀才能知道記錄了什麼及為什麼記錄。內聯後相關資訊相鄰，仍使用通用logger。結論限於單處呼叫的淺包裝。</desc>
  <defs><marker id="ch09-logging-locality-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--diagram-muted,#58636b)" /></marker></defs>
  <rect width="680" height="455" fill="var(--diagram-bg,#f5f7f8)" />
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" fill="var(--diagram-ink,#263239)">
    <text x="24" y="34" font-size="21" font-weight="600">這條日誌為什麼不需要一個專用包裝類？</text>
    <text x="24" y="70" fill="var(--diagram-muted,#58636b)">箭頭表示閱讀依賴，不是兩次執行時呼叫</text>
    <rect x="24" y="106" width="238" height="109" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" /><text x="42" y="135" font-weight="600">檢測到開啟連線失敗</text><text x="42" y="166" font-family="monospace" font-size="14">logRpcOpenError</text><text x="42" y="194" font-family="monospace" font-size="14">(req, dest, e)</text>
    <rect x="415" y="106" width="241" height="109" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" /><text x="433" y="135" font-family="monospace" font-size="14">NetworkErrorLogger</text><text x="433" y="166">一行實際日誌</text><text x="433" y="194">卻有一個單獨介面及文件</text>
    <g fill="none" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch09-logging-locality-a)"><path d="M263 142H407" /><path d="M414 188H270" /></g>
    <text x="277" y="129" font-size="13">究竟記錄了什麼？</text><text x="277" y="213" font-size="13">為何要記錄這些？</text>
    <path d="M24 248H656" stroke="var(--diagram-line,#aebbad)" />
    <text x="24" y="280" font-weight="600">把需要一起理解的內容放回一起</text>
    <rect x="24" y="299" width="420" height="96" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" /><text x="44" y="329">檢測到開啟連線失敗</text><text x="44" y="358">就地記錄請求、目標、例外</text><text x="44" y="382" font-family="monospace" font-size="13">req / dest / e</text>
    <path d="M444 348H489" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch09-logging-locality-a)" /><text x="507" y="343">通用 logger</text><text x="507" y="368" font-size="13">仍然保留</text>
    <text x="24" y="430" font-size="13" fill="var(--diagram-muted,#58636b)">限定：原例包裝方法很淺、各只呼叫一次，且依賴呼叫情境；不是反對通用日誌設施。</text>
  </g>
</svg>
