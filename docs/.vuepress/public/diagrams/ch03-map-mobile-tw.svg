<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 572" role="img" aria-labelledby="ch03m-title ch03m-desc">
  <title id="ch03m-title">能工作的程式碼，為什麼還不夠？</title>
  <desc id="ch03m-desc">本章概覽。能工作的程式碼，為什麼還不夠？ 本章的主要部分：戰術式程式設計：只求儘快讓程式碼工作，每次添一點複雜性，很快一團糟；戰略式程式設計：把好設計當主要目標，持續投入 10% 到 20% 的時間。一句話：只求程式碼能跑會累積複雜性；持續投入 10% 到 20% 的時間做設計，幾個月後更快</desc>
  <rect width="420" height="572" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch03m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">能工作的程式碼，為什麼還不夠？</text>
    <text x="22.0" y="80.0" font-size="13" fill="var(--diagram-muted,#5c645d)">大多數程式設計師用戰術式思維寫程式碼：先讓它跑起來。作者主張換</text>
    <text x="22.0" y="100.0" font-size="13" fill="var(--diagram-muted,#5c645d)">成戰略式：主要目標是好的設計，同時讓程式碼能工作</text>
    <rect x="22.0" y="118.0" width="376.0" height="132.0" rx="9" fill="var(--diagram-danger-soft,#ead9dc)" />
    <circle cx="50.0" cy="144.0" r="14" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" stroke-width="2" /><g transform="translate(42.0,136.0) scale(0.667)" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></g>
    <text x="74.0" y="149.0" font-size="18" font-weight="600">戰術式：先讓它跑起來</text>
    <text x="74.0" y="174.0" font-size="15" fill="var(--diagram-muted,#5c645d)">有截止期限，不花時間找最佳設計；加點複雜</text>
    <text x="74.0" y="196.0" font-size="15" fill="var(--diagram-muted,#5c645d)">性、留個蹩腳實作，覺得沒什麼；問題出現後</text>
    <text x="74.0" y="218.0" font-size="15" fill="var(--diagram-muted,#5c645d)">快速修補，補丁越打越多；戰術龍捲風：產出</text>
    <text x="74.0" y="240.0" font-size="15" fill="var(--diagram-muted,#5c645d)">最快，留下的混亂要別人清理</text>
    <rect x="22.0" y="260.0" width="376.0" height="132.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="286.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,278.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z" /><circle cx="12" cy="12" r="10" /></g>
    <text x="74.0" y="291.0" font-size="18" font-weight="600">戰略式：好設計是主要目標</text>
    <text x="74.0" y="316.0" font-size="15" fill="var(--diagram-muted,#5c645d)">能工作的程式碼是不夠的，最重要的是長期結</text>
    <text x="74.0" y="338.0" font-size="15" fill="var(--diagram-muted,#5c645d)">構；主動投資：新類多比較幾種設計，寫好文</text>
    <text x="74.0" y="360.0" font-size="15" fill="var(--diagram-muted,#5c645d)">檔；被動投資：發現設計問題就真正修復；總</text>
    <text x="74.0" y="382.0" font-size="15" fill="var(--diagram-muted,#5c645d)">開發時間的 10% 到 20% 用於投資</text>
    <text x="22.0" y="414.0" font-size="13" fill="var(--diagram-muted,#5c645d)">技術債：現在快一點，以後一直慢；作者估計 6 到 18 個月能收回</text>
    <text x="22.0" y="434.0" font-size="13" fill="var(--diagram-muted,#5c645d)">投資，但他說明這只是個人意見，沒有資料支援</text>
    <rect x="22.0" y="460.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="36.0" y="481.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="36.0" y="507.0" font-size="17" font-weight="600">只求程式碼能跑會累積複雜性；持續投入 10% 到</text>
    <text x="36.0" y="533.0" font-size="17" font-weight="600">20% 的時間做設計，幾個月後更快</text>
  </g>
</svg>
