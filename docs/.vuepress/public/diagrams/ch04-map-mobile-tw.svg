<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 750" role="img" aria-labelledby="ch04m-title ch04m-desc">
  <title id="ch04m-title">什麼樣的模組算好模組？</title>
  <desc id="ch04m-desc">本章概覽。什麼樣的模組算好模組？ 本章的主要部分：功能：模組替你做了多少事；隱藏：多少細節不用你知道；常見情況要簡單：順序讀寫是預設；別把類拆得太碎：小類多了介面就多。一句話：深模組：簡單的介面後面藏著大量功能，例如 Unix 檔案 I/O 只有五個系統呼叫</desc>
  <rect width="420" height="750" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch04m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)" /></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">什麼樣的模組算好模組？</text>
    <text x="22.0" y="82.0" font-size="16" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">兩個變化的方向</text>
    <rect x="22.0" y="98.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="124.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,116.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z" /><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" /><path d="M12 2v2" /><path d="M12 22v-2" /><path d="m17 20.66-1-1.73" /><path d="M11 10.27 7 3.34" /><path d="m20.66 17-1.73-1" /><path d="m3.34 7 1.73 1" /><path d="M14 12h8" /><path d="M2 12h2" /><path d="m20.66 7-1.73 1" /><path d="m3.34 17 1.73-1" /><path d="m17 3.34-1 1.73" /><path d="m11 13.73-4 6.93" /></g>
    <text x="74.0" y="129.0" font-size="18" font-weight="600">功能</text>
    <text x="74.0" y="154.0" font-size="15" fill="var(--diagram-muted,#5c645d)">模組替你做了多少事</text>
    <rect x="22.0" y="174.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="200.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,192.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" /><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" /><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" /><path d="m2 2 20 20" /></g>
    <text x="74.0" y="205.0" font-size="18" font-weight="600">隱藏</text>
    <text x="74.0" y="230.0" font-size="15" fill="var(--diagram-muted,#5c645d)">多少細節不用你知道</text>
    <text x="22.0" y="264.0" font-size="16" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">從淺模組到深模組</text>
    <rect x="22.0" y="280.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)" />
    <circle cx="50.0" cy="306.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(42.0,298.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" /><path d="M12 22V12" /><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7" /><path d="m7.5 4.27 9 5.15" /></g>
    <text x="74.0" y="311.0" font-size="18" font-weight="600">淺模組</text>
    <text x="74.0" y="336.0" font-size="15" fill="var(--diagram-muted,#5c645d)">介面和實作差不多複雜</text>
    <path d="M210.0 348.0 L210.0 364.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch04m-arrow)" />
    <rect x="22.0" y="372.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="398.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,390.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" /><line x1="4" x2="4" y1="22" y2="15" /></g>
    <text x="74.0" y="403.0" font-size="18" font-weight="600">深模組</text>
    <text x="74.0" y="428.0" font-size="15" fill="var(--diagram-muted,#5c645d)">簡單的介面後藏著許多功能</text>
    <text x="22.0" y="462.0" font-size="16" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">在這裡要注意的事</text>
    <rect x="22.0" y="478.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="504.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,496.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="6" ry="6" /><circle cx="16" cy="12" r="2" /></g>
    <text x="74.0" y="509.0" font-size="18" font-weight="600">常見情況要簡單</text>
    <text x="74.0" y="534.0" font-size="15" fill="var(--diagram-muted,#5c645d)">順序讀寫是預設</text>
    <rect x="22.0" y="554.0" width="376.0" height="66.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <circle cx="50.0" cy="580.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" /><g transform="translate(42.0,572.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></g>
    <text x="74.0" y="585.0" font-size="18" font-weight="600">別把類拆得太碎</text>
    <text x="74.0" y="610.0" font-size="15" fill="var(--diagram-muted,#5c645d)">小類多了介面就多</text>
    <rect x="22.0" y="638.0" width="376.0" height="90.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)" />
    <text x="36.0" y="659.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句話</text>
    <text x="36.0" y="685.0" font-size="17" font-weight="600">深模組：簡單的介面後面藏著大量功能，例</text>
    <text x="36.0" y="711.0" font-size="17" font-weight="600">如 Unix 檔案 I/O 只有五個系統呼叫</text>
  </g>
</svg>
