<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 455" role="img" aria-labelledby="ch09-logging-locality-t ch09-logging-locality-d">
  <title id="ch09-logging-locality-t">这条日志为什么不需要一个专用包装类？</title><desc id="ch09-logging-locality-d">分离的错误检测点和日志包装方法要来回阅读才能知道记录了什么及为什么记录。内联后相关信息相邻，仍使用通用logger。结论限于单处调用的浅包装。</desc>
  <defs><marker id="ch09-logging-locality-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--diagram-muted,#58636b)"/></marker></defs>
  <rect width="680" height="455" fill="var(--diagram-bg,#f5f7f8)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" fill="var(--diagram-ink,#263239)">
    <text x="24" y="34" font-size="21" font-weight="600">这条日志为什么不需要一个专用包装类？</text>
    <text x="24" y="70" fill="var(--diagram-muted,#58636b)">箭头表示阅读依赖，不是两次运行时调用</text>
    <rect x="24" y="106" width="238" height="109" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)"/><text x="42" y="135" font-weight="600">检测到打开连接失败</text><text x="42" y="166" font-family="monospace" font-size="14">logRpcOpenError</text><text x="42" y="194" font-family="monospace" font-size="14">(req, dest, e)</text>
    <rect x="415" y="106" width="241" height="109" rx="4" fill="var(--diagram-warm-soft,#eae2cf)"/><text x="433" y="135" font-family="monospace" font-size="14">NetworkErrorLogger</text><text x="433" y="166">一行实际日志</text><text x="433" y="194">却有一个单独接口及文档</text>
    <g fill="none" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch09-logging-locality-a)"><path d="M263 142H407"/><path d="M414 188H270"/></g>
    <text x="277" y="129" font-size="13">究竟记录了什么？</text><text x="277" y="213" font-size="13">为何要记录这些？</text>
    <path d="M24 248H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="280" font-weight="600">把需要一起理解的内容放回一起</text>
    <rect x="24" y="299" width="420" height="96" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)"/><text x="44" y="329">检测到打开连接失败</text><text x="44" y="358">就地记录请求、目标、异常</text><text x="44" y="382" font-family="monospace" font-size="13">req / dest / e</text>
    <path d="M444 348H489" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch09-logging-locality-a)"/><text x="507" y="343">通用 logger</text><text x="507" y="368" font-size="13">仍然保留</text>
    <text x="24" y="430" font-size="13" fill="var(--diagram-muted,#58636b)">限定：原例包装方法很浅、各只调用一次，且依赖调用情境；不是反对通用日志设施。</text>
  </g>
</svg>
