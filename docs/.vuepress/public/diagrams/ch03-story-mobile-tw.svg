<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 991" role="img" aria-labelledby="ch03-storym-title ch03-storym-desc">
  <title id="ch03-storym-title">從“先讓它跑起來”到“好設計是今天要做的事”</title>
  <desc id="ch03-storym-desc">本章回顧。從“先讓它跑起來”到“好設計是今天要做的事”。起點：戰術式程式設計：先讓功能跑起來。大多數程式設計師這樣工作。為了更快完成當前任務，加一點複雜性、留一兩處蹩腳實作，似乎都是合理的折衷。但每個任務都這樣，複雜性就迅速累積。；代價：修補引來更多修補，很快一團糟。問題出現後，你告訴自己下個功能比重構更重要，於是快速修補，補丁又帶來新問題。戰術龍捲風產出最快，管理層視為英雄，留下的混亂卻要別人清理。；轉折：能工作的程式碼不夠，目標是出色的設計。大多數程式碼都是在擴充現有程式碼時寫的，最重要的工作是讓未來的擴充更容易。主動投資：為新類多比較幾種設計，寫好文件。被動投資：發現設計問題就真正修復。；做法：持續小額投資，幾個月後收回成本。一次設計整個系統是瀑布式，行不通。持續投入起初慢一點，幾個月後開發速度反超，省下的時間足夠支援後續投資。初創公司也一樣，戰術式未必能讓首個產品更早釋出。。這一章最想強調的：能工作的程式碼是不夠的；把好設計當作今天要做的事，持續做小額投資 一旦開始把清理推遲到忙完這陣，就很容易一直拖下去；投資比例和回本時間是作者的估計，沒有資料</desc>
