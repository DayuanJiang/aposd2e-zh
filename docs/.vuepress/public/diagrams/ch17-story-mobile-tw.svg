    <text x="76.0" y="594.0" font-size="15">作者寫了一個提交前自動執行的腳本，只要有一</text>
    <text x="76.0" y="617.0" font-size="15">行含回車符就中止提交，問題一下就解決了。寫</text>
    <text x="76.0" y="640.0" font-size="15">新程式碼前先看現有程式碼怎麼組織並照著做；</text>
    <text x="76.0" y="663.0" font-size="15">有更好的想法也不足以引入不一致。</text>
    <circle cx="40.0" cy="725.0" r="18" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)" stroke-width="2" /><g transform="translate(31.0,716.0) scale(0.750)" fill="none" stroke="var(--diagram-warm,#80531b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="M7 21h10" /><path d="M12 3v18" /><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" /></g>
    <text x="76.0" y="713.0" font-size="12" font-weight="600" fill="var(--diagram-warm,#80531b)">限定</text>
    <text x="76.0" y="737.0" font-size="18" font-weight="600">一致也要求不同的事採用不同做法</text>
    <text x="76.0" y="763.0" font-size="15">給確實不同的事物用同一個變數名，或把設計模</text>
