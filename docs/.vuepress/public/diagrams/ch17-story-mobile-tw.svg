<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1087" role="img" aria-labelledby="ch17-storym-title ch17-storym-desc">
  <title id="ch17-storym-title">從行終止符的反覆出錯，到理解一處就能理解其他地方</title>
  <desc id="ch17-storym-desc">本章回顧。從行終止符的反覆出錯，到理解一處就能理解其他地方。起點：同一套程式碼，Unix 用換行，Windows 用回車加換行。編輯器有時會把整個檔案的行終止符改成當前系統的格式，於是每一行都顯示為已修改，真正的改動反而難以辨認。每來一個新成員，問題就重演一遍。；問題：缺乏一致性時，讀者要逐一學習每種情況，還會做出錯誤假設。兩種實際不同的情況看起來一樣，開發人員按熟悉的模式猜測，可能猜錯。系統一致時，相似的事採用相似做法，理解了一處就能理解其他地方。；做法：寫下約定、用工具強制、入鄉隨俗、不輕易改舊約定。作者寫了一個提交前自動執行的腳本，只要有一行含回車符就中止提交，問題一下就解決了。寫新程式碼前先看現有程式碼怎麼組織並照著做；有更好的想法也不足以引入不一致。；限定：一致也要求不同的事採用不同做法。給確實不同的事物用同一個變數名，或把設計模式套在不適合的任務上，只會增加混亂。保持一致是一種投資：定約定、寫檢查工具都要花時間，回報是程式碼更快、更準確地被看懂。。這一章最想強調的：相似的事用相似做法：保持一致的收益，幾乎總是大於新舊做法之間的優劣差距 一致也要求不同的事採用不同做法；只有當開發人員確信“如果它看起來像 x，它確實是 x”時，一致性才有益</desc>
