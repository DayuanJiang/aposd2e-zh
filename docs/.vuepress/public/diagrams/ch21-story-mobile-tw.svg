<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1042" role="img" aria-labelledby="ch21-storym-title ch21-storym-desc">
  <title id="ch21-storym-title">從一個介面該不該知道退格鍵，到什麼是好品味</title>
  <desc id="ch21-storym-desc">本章回顧。從一個介面該不該知道退格鍵，到什麼是好品味。起點：文字類需要知道使用者按了退格鍵嗎？。文字類只需要知道要刪除一段字元；呼叫者是因為退格還是別的原因並不重要。通用的插入刪除介面解決很多問題，專用的退格方法只解決一個：收益更廣的做法，往往更重要。；問題：兩類錯誤：把太多事看成重要，或漏掉真正重要的事。Java 的 I/O 介面迫使開發人員區分緩衝與非緩衝，而這個區別幾乎從來不重要，結果是淺類。沒認出重要的事，則會隱藏重要資訊或缺少重要功能，開發人員只能反覆實作。；做法：重要的事要少，而且醒目、重複、處於核心地位。先減少要關注的事：構造物件少要參數、給預設值，例外在低層處理完。真正重要的，放進介面文件、名稱、常用參數，讓它反覆出現，並處於核心地位，例如裝置驅動介面。；結論：看不出什麼重要時，先假設，再從結果中學。先提出“我認為這是最重要的”，據此構建系統看效果。對了，想想當時有什麼線索；錯了也沒關係，想想哪些線索本可以避免這個選擇。區分重要與不重要的能力，就是“好品味”。。這一章最想強調的：圍繞重要的事設計系統：重要的加以強調，不重要的儘可能隱藏 這個想法也適用於寫文件和生活：先確定幾件最重要的事，把精力盡可能放在上面</desc>
