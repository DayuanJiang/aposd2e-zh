<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 557" role="img" aria-labelledby="ch15-design-feedback-m-title ch15-design-feedback-m-desc">
  <title id="ch15-design-feedback-m-title">先寫註解不是凍結設計</title>
  <desc id="ch15-design-feedback-m-desc">這是作者設計新類的順序：先介面說明，再變數和實作。右側迴路把編碼測試發現的問題送回介面說明。應隨變化維護註解，不把這個順序當成每種任務的要求或自動消除積壓的保證。</desc>
  <defs><marker id="ch15-design-feedback-m-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#5c645d)" /></marker></defs>
  <rect width="360" height="557" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" fill="var(--diagram-ink,#303630)">
    <text x="16" y="31" font-size="19" font-weight="600">先寫註解，仍然持續迭代</text>
    <text x="16" y="58" font-size="14">15.2 · 作者設計新類的做法，非通則</text>
    <rect x="16" y="82" width="294" height="158" rx="5" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" />
    <text x="32" y="112" font-weight="600">先看抽象</text><text x="32" y="142">類介面說明</text><text x="32" y="170">主要公有方法：說明 + 簽名</text><text x="32" y="198">方法體留空</text><text x="32" y="224" font-size="14">反覆調整，直到基本結構合理</text>
    <path d="M163 240V290" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch15-design-feedback-m-arrow)" />
    <rect x="16" y="290" width="294" height="140" rx="5" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" />
    <text x="32" y="320" font-weight="600">再寫實作並檢驗</text><text x="32" y="350">主要變數：宣告 + 註解</text><text x="32" y="378">方法體 + 所需實作註解</text><text x="32" y="406">編碼、測試中發現問題</text>
    <path d="M310 382H334V135H310" fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch15-design-feedback-m-arrow)" />
    <text x="16" y="465">迴路：修正介面說明</text><text x="16" y="492">新方法也先寫說明，再寫方法體</text>
    <path d="M16 511H344" stroke="var(--diagram-line,#aebbad)" />
    <text x="16" y="539">設計改變時，也要同步維護註解。</text>
  </g>
</svg>
