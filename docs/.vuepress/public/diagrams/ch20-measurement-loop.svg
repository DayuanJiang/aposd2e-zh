<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 565" role="img" aria-labelledby="ch20-measurement-loop-title ch20-measurement-loop-desc">
  <title id="ch20-measurement-loop-title">实测收益是否值得新增复杂性</title>
  <desc id="ch20-measurement-loop-desc">当前测量保留基线并深入定位热点，热点修改后的测量与基线在同条件比较处汇合。统一判断实测收益是否值得新增复杂性：值得才有保留理由，无可测收益或收益不足都走撤销一支。独立简化设计是另一个可评估的保留依据，没有数值阈值。</desc>
  <defs><marker id="ch20-measurement-loop-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="680" height="565" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" fill="var(--diagram-ink,#303630)">
    <text x="24" y="33" font-size="21" font-weight="600">有可测提升，还要问是否值得</text><text x="24" y="60" font-size="14">20.2 · 定位热点与前后比较是两个问题；不设虚构的数值门槛</text>
    <rect x="24" y="87" width="190" height="51" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)"/><text x="119" y="118" text-anchor="middle">测量当前系统</text>
    <rect x="280" y="87" width="190" height="51" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)"/><text x="375" y="118" text-anchor="middle">深入定位具体热点</text>
    <rect x="24" y="208" width="190" height="54" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)"/><text x="119" y="241" text-anchor="middle">保存修改前基线</text>
    <rect x="280" y="208" width="190" height="54" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/><text x="375" y="241" text-anchor="middle">修改热点，再测量</text>
    <g fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch20-measurement-loop-arrow)"><path d="M214 112H280"/><path d="M119 138V208"/><path d="M375 138V208"/><path d="M119 262V287H224V320"/><path d="M375 262V287H446V320"/></g>
    <text x="493" y="218" font-size="14">基线不参与修改，</text><text x="493" y="244" font-size="14">留作可比的参照。</text>
    <rect x="119" y="320" width="442" height="72" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)"/>
    <text x="340" y="348" text-anchor="middle">同条件比较后，实测收益</text><text x="340" y="377" text-anchor="middle" font-weight="600">值得新增复杂性吗？</text>
    <g fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch20-measurement-loop-arrow)"><path d="M224 392V415H164V439"/><path d="M446 392V415H509V439"/></g>
    <text x="164" y="462" text-anchor="middle" fill="var(--diagram-primary,#0b6f5d)">是：有理由保留</text>
    <text x="509" y="462" text-anchor="middle" fill="var(--diagram-danger,#a03946)">否：无收益，或收益不足</text>
    <text x="509" y="488" text-anchor="middle">撤销新增复杂性</text>
    <path d="M24 507H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="533" font-size="14">若改动独立简化设计，可据此另行评估保留；仍须满足行为要求。</text>
    <text x="24" y="556" font-size="14">“收益不足”包含虽能测到提升、却不足以抵偿复杂性的情况。</text>
  </g>
</svg>
