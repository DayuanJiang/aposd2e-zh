<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img" aria-labelledby="ch04-title ch04-desc">
  <title id="ch04-title">什麼樣的模組算好模組？</title>
  <desc id="ch04-desc">本章概覽。什麼樣的模組算好模組？ 本章的主要部分：功能：模組替你做了多少事；隱藏：多少細節不用你知道；常見情況要簡單：順序讀寫是預設；警惕多類症：小類多了介面就多。一句話：深模組：簡單的介面後面藏著大量功能，例如 Unix 檔案 I/O 只有五個系統呼叫</desc>
  <rect width="960" height="448" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
