    <text x="588.0" y="324.0" font-size="16" font-weight="600">功能：模組替你做了多少事</text>
    <text x="134.0" y="316.0" font-size="13" fill="var(--diagram-muted,#5c645d)">幾行程式碼</text>
    <text x="850.0" y="316.0" font-size="13" fill="var(--diagram-muted,#5c645d)" text-anchor="end">幾十萬行</text>
    <g transform="translate(30.0,82.0) scale(0.917)" fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" /><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" /><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" /><path d="m2 2 20 20" /></g>
    <text x="58.0" y="99.0" font-size="16" font-weight="600">隱藏：多少細節不用你知道</text>
    <text x="112.0" y="286.0" font-size="13" fill="var(--diagram-muted,#5c645d)" text-anchor="end">幾乎不藏</text>
    <text x="112.0" y="126.0" font-size="13" fill="var(--diagram-muted,#5c645d)" text-anchor="end">幾乎全藏</text>
    <circle cx="182.0" cy="256.0" r="24" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" /><g transform="translate(168.0,242.0) scale(1.167)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" /><path d="M12 22V12" /><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7" /><path d="m7.5 4.27 9 5.15" /></g>
    <text x="216.0" y="252.0" font-size="20" font-weight="600">淺模組</text>
