    <text x="444.0" y="142.0" font-size="22" font-weight="600">深模組</text>
    <text x="444.0" y="166.0" font-size="15" fill="var(--diagram-muted,#5c645d)">Unix 檔案 I/O：五個系統呼叫背後是幾十萬行實作</text>
