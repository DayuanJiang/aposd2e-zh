    <text x="498.0" y="222.0" font-size="18" font-weight="600">常見情況要簡單</text>
    <text x="498.0" y="246.0" font-size="15" fill="var(--diagram-muted,#5c645d)">順序讀寫是預設</text>
    <g transform="translate(669.0,200.0) scale(1.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></g>
    <text x="721.0" y="222.0" font-size="18" font-weight="600">警惕多類症</text>
    <text x="721.0" y="246.0" font-size="15" fill="var(--diagram-muted,#5c645d)">小類多了介面就多</text>
