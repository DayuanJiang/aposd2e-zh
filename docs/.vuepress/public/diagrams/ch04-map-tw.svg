    <text x="32.0" y="52.0" font-size="30" font-weight="600">什麼樣的模組算好模組？</text>
    <path d="M120.0 296.0 L900.0 296.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch04-arrow)" />
    <path d="M120.0 296.0 L120.0 92.0" fill="none" stroke="var(--diagram-line,#aebbad)" stroke-width="2" marker-end="url(#ch04-arrow)" />
