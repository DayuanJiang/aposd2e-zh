    <text x="118.0" y="380.0" font-size="19" font-weight="600">写的时候多花几分钟，读的人少花很多时间</text>
    <text x="118.0" y="406.0" font-size="15">为返回值定义专门的类，元素就有了有意义的名字；让声明类型与分配类型一致；用空行分开代码块，让注释更醒目。如果</text>
    <text x="118.0" y="429.0" font-size="15">读你代码的人说它难懂，它就是难懂。</text>
    <circle cx="74.0" cy="491.0" r="22" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(63.0,480.0) scale(0.917)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></g>
    <text x="118.0" y="479.0" font-size="12" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">结论</text>
    <text x="118.0" y="503.0" font-size="19" font-weight="600">三种方式让读者始终掌握所需信息</text>
    <text x="118.0" y="529.0" font-size="15">最好的办法是用抽象、消除特殊情况等设计手段，减少读者需要知道的信息；其次是遵循约定、符合预期，用读者已有的知</text>
    <text x="118.0" y="552.0" font-size="15">识；最后才是用好名称和有针对性的注释直接补上信息。</text>
    <rect x="32.0" y="590.0" width="896.0" height="101.0" rx="12" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <g transform="translate(50.0,610.0) scale(1.000)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></g>
    <text x="92.0" y="618.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">这一章最想强调的</text>
    <text x="92.0" y="644.0" font-size="20" font-weight="600">软件应设计得易于阅读：写代码的人多花几分钟，每个读者都少花时间</text>
    <text x="92.0" y="670.0" font-size="15" fill="var(--diagram-muted,#5c645d)">事件驱动这类做法有时仍要用，这时用注释补上读者缺少的信息，例如说明处理函数何时会被调用</text>
