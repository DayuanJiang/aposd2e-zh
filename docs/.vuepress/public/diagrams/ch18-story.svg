    <text x="118.0" y="134.0" font-size="19" font-weight="600">方法用 Pair 返回当前任期和一个布尔值</text>
    <text x="118.0" y="160.0" font-size="15">调用者只能写 result.getKey() 和 result.getValue()，这两个名字说不出值的含义。写的人省了几分钟，之后每个读</text>
    <text x="118.0" y="183.0" font-size="15">者都要去查。</text>
    <circle cx="74.0" cy="245.0" r="22" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)" stroke-width="2"/><g transform="translate(63.0,234.0) scale(0.917)" fill="none" stroke="var(--diagram-warm,#80531b)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></g>
    <text x="118.0" y="233.0" font-size="12" font-weight="600" fill="var(--diagram-warm,#80531b)">问题</text>
    <text x="118.0" y="257.0" font-size="19" font-weight="600">危险信号：快速阅读却读不懂，说明读者缺了某条重要信息</text>
    <text x="118.0" y="283.0" font-size="15">List 变量实际是 ArrayList；事件处理函数由事件模块间接调用，看不出何时执行；RaftClient 的构造函数开了新线</text>
    <text x="118.0" y="306.0" font-size="15">程，main 返回后程序仍在运行。</text>
