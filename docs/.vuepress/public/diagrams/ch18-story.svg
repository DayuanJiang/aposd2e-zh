<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 719" role="img" aria-labelledby="ch18-story-title ch18-story-desc">
  <title id="ch18-story-title">从一对叫 getKey 的返回值，到让读者始终掌握所需信息</title>
  <desc id="ch18-story-desc">本章回顾。从一对叫 getKey 的返回值，到让读者始终掌握所需信息。起点：方法用 Pair 返回当前任期和一个布尔值。调用者只能写 result.getKey() 和 result.getValue()，这两个名字说不出值的含义。写的人省了几分钟，之后每个读者都要去查。；问题：危险信号：快速阅读却读不懂，说明读者缺了某条重要信息。List 变量实际是 ArrayList；事件处理函数由事件模块间接调用，看不出何时执行；RaftClient 的构造函数开了新线程，main 返回后程序仍在运行。；转折：写的时候多花几分钟，读的人少花很多时间。为返回值定义专门的类，元素就有了有意义的名字；让声明类型与分配类型一致；用空行分开代码块，让注释更醒目。如果读你代码的人说它难懂，它就是难懂。；结论：三种方式让读者始终掌握所需信息。最好的办法是用抽象、消除特殊情况等设计手段，减少读者需要知道的信息；其次是遵循约定、符合预期，用读者已有的知识；最后才是用好名称和有针对性的注释直接补上信息。。这一章最想强调的：软件应设计得易于阅读：写代码的人多花几分钟，每个读者都少花时间 事件驱动这类做法有时仍要用，这时用注释补上读者缺少的信息，例如说明处理函数何时会被调用</desc>
