<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1042" role="img" aria-labelledby="ch14-storym-title ch14-storym-desc">
  <title id="ch14-storym-title">从一个叫 block 的变量引出的六个月追查，到把命名当作投资</title>
  <desc id="ch14-storym-desc">本章回顾。从一个叫 block 的变量引出的六个月追查，到把命名当作投资。起点：Sprite 文件系统偶尔把文件的一个数据块清零，追了六个月。变量 block 有时指磁盘上的物理块号，有时指文件中的逻辑块号，某处把两者用混了。几个人读过这段代码都没发现：看到 block 被当作物理块号，就本能地以为它确实是。；判断：多数人拿最先想到、大致相符的名称就用，作者认为这不够。“块”看起来并不糟，却让人花了大量时间追一个微妙的缺陷。好名称要让读者在没看到声明和用法时，就能准确猜出它指什么：突出最重要的特征，省去次要细节。；做法：精确、一致、没有多余的词。getCount 太笼统，numActiveIndexlets 让人不看文档就能猜到返回什么；同一用途始终用同一个名称，i 总用于外层循环；名称里的每个词都要提供信息。短循环用 i、j 是合理的例外。；分歧：Go 风格偏爱单字母名，作者认为可读性应由读者判断。Go 演讲认为长名称模糊了代码的作用。作者读单字母版本时得通读代码才知道 n 是什么，count 就不用；若系统里 n 始终表示计数，短名也说得通。读者抱怨含糊，就该改长。。这一章最想强调的：不要满足于“大致相符”的名称，多花一点时间选出准确、明确而直观的名称 这是一项投资：一开始会觉得费时，随着经验积累，几乎不用多花时间就能选出好名称</desc>
