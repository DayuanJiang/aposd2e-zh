<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 909" role="img" aria-labelledby="ch09m-title ch09m-desc">
  <title id="ch09m-title">两个功能放在一起实现，还是分开实现？</title>
  <desc id="ch09m-desc">本章概览。两个功能放在一起实现，还是分开实现？ 本章的主要部分：共享信息就组合：读 HTTP 请求的代码不解析标头就找不到结尾，与解析合在一个类里，代码更短；简化接口就组合：合并后中间传字符串的接口没了；若把缓冲合进文件流，多数用户不必知道缓冲；组合来消除重复：几种数据包各写一遍同样的日志语句；提取成方法，或用 goto 让它只留一份；通用与专用分开：文本类提供通用操作；删除所选区域这类界面操作归界面模块，否则信息泄露；方法看深度：拆分多出接口。方法够深、签名简单，几百行也行；必须一起读才懂的是连体方法。一句话：依据是整个系统的复杂性：共享信息或能简化接口就组合，通用机制与专用代码分开，方法先求深再求短</desc>
  <rect width="420" height="909" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <defs><marker id="ch09m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9Z" fill="var(--diagram-line,#aebbad)"/></marker></defs>
    <text x="22.0" y="44.0" font-size="23" font-weight="600">两个功能放在一起实现，还是分开实</text>
    <text x="22.0" y="75.0" font-size="23" font-weight="600">现？</text>
    <rect x="22.0" y="99.0" width="376.0" height="134.0" rx="9" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <circle cx="50.0" cy="125.0" r="14" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><g transform="translate(42.0,117.0) scale(0.667)" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>
    <text x="74.0" y="130.0" font-size="18" font-weight="600">目标：整个系统的复杂性最低，信息</text>
    <text x="74.0" y="154.0" font-size="18" font-weight="600">隐藏最好、依赖最少、接口最深</text>
    <text x="74.0" y="179.0" font-size="15" fill="var(--diagram-muted,#5c645d)">细分本身也有代价：组件更多、接口更多、需</text>
    <text x="74.0" y="201.0" font-size="15" fill="var(--diagram-muted,#5c645d)">要额外的管理代码、相关代码被分散、还可能</text>
    <text x="74.0" y="223.0" font-size="15" fill="var(--diagram-muted,#5c645d)">重复</text>
    <text x="22.0" y="257.0" font-size="16" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">靠什么支撑</text>
    <rect x="22.0" y="273.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <circle cx="50.0" cy="299.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,291.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g>
    <text x="74.0" y="304.0" font-size="18" font-weight="600">共享信息就组合</text>
    <text x="74.0" y="329.0" font-size="15" fill="var(--diagram-muted,#5c645d)">读 HTTP 请求的代码不解析标头就找不到结</text>
    <text x="74.0" y="351.0" font-size="15" fill="var(--diagram-muted,#5c645d)">尾，与解析合在一个类里，代码更短</text>
    <rect x="22.0" y="371.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <circle cx="50.0" cy="397.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,389.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></g>
    <text x="74.0" y="402.0" font-size="18" font-weight="600">简化接口就组合</text>
    <text x="74.0" y="427.0" font-size="15" fill="var(--diagram-muted,#5c645d)">合并后中间传字符串的接口没了；若把缓冲合</text>
    <text x="74.0" y="449.0" font-size="15" fill="var(--diagram-muted,#5c645d)">进文件流，多数用户不必知道缓冲</text>
    <rect x="22.0" y="469.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <circle cx="50.0" cy="495.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,487.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="m14 16-3 3 3 3"/><path d="M8.293 13.596 7.196 9.5 3.1 10.598"/><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/><path d="m13.378 9.633 4.096 1.098 1.097-4.096"/></g>
    <text x="74.0" y="500.0" font-size="18" font-weight="600">组合来消除重复</text>
    <text x="74.0" y="525.0" font-size="15" fill="var(--diagram-muted,#5c645d)">几种数据包各写一遍同样的日志语句；提取成</text>
    <text x="74.0" y="547.0" font-size="15" fill="var(--diagram-muted,#5c645d)">方法，或用 goto 让它只留一份</text>
    <rect x="22.0" y="567.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <circle cx="50.0" cy="593.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,585.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></g>
    <text x="74.0" y="598.0" font-size="18" font-weight="600">通用与专用分开</text>
    <text x="74.0" y="623.0" font-size="15" fill="var(--diagram-muted,#5c645d)">文本类提供通用操作；删除所选区域这类界面</text>
    <text x="74.0" y="645.0" font-size="15" fill="var(--diagram-muted,#5c645d)">操作归界面模块，否则信息泄露</text>
    <rect x="22.0" y="665.0" width="376.0" height="88.0" rx="9" fill="var(--diagram-secondary-soft,#dce4ed)"/>
    <circle cx="50.0" cy="691.0" r="14" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2"/><g transform="translate(42.0,683.0) scale(0.667)" fill="none" stroke="var(--diagram-secondary,#2c6096)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></g>
    <text x="74.0" y="696.0" font-size="18" font-weight="600">方法看深度</text>
    <text x="74.0" y="721.0" font-size="15" fill="var(--diagram-muted,#5c645d)">拆分多出接口。方法够深、签名简单，几百行</text>
    <text x="74.0" y="743.0" font-size="15" fill="var(--diagram-muted,#5c645d)">也行；必须一起读才懂的是连体方法</text>
    <rect x="22.0" y="771.0" width="376.0" height="116.0" rx="10" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="36.0" y="792.0" font-size="13" font-weight="600" fill="var(--diagram-primary,#0b6f5d)">一句话</text>
    <text x="36.0" y="818.0" font-size="17" font-weight="600">依据是整个系统的复杂性：共享信息或能简化</text>
    <text x="36.0" y="844.0" font-size="17" font-weight="600">接口就组合，通用机制与专用代码分开，方法</text>
    <text x="36.0" y="870.0" font-size="17" font-weight="600">先求深再求短</text>
  </g>
</svg>
