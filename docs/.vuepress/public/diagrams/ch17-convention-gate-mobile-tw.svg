<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 580" role="img" aria-labelledby="ch17-convention-gate-m-title ch17-convention-gate-m-desc">
  <title id="ch17-convention-gate-m-title">作者專案中提交前自動檢查換行符</title>
  <desc id="ch17-convention-gate-m-desc">作者的專案在提交前自動檢查改動檔案，含回車則阻止；手動修復後重檢，不含回車才放行。不是所有儲存庫應採用的約定，也不會自動修復。</desc>
  <defs><marker id="ch17-convention-gate-m-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#5c645d)" /></marker></defs>
  <rect width="360" height="580" fill="var(--diagram-bg,#e7eae6)" />
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" fill="var(--diagram-ink,#303630)">
    <text x="16" y="31" font-size="19" font-weight="600">這個專案如何攔住違規提交？</text><text x="16" y="57" font-size="14">17.2 · 作者專案案例，不是通用規則</text>
    <rect x="48" y="84" width="264" height="54" rx="5" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)" /><text x="180" y="117" text-anchor="middle">提交前自動檢查改動檔案</text>
    <path d="M180 138V176" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch17-convention-gate-m-arrow)" />
    <path d="M180 176L310 230L180 284L50 230Z" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)" /><text x="180" y="236" text-anchor="middle">含 CR？</text>
    <g fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch17-convention-gate-m-arrow)"><path d="M114 257V332" /><path d="M250 257V332" /><path d="M48 386H25V230H50" /></g>
    <text x="85" y="311">是</text><text x="263" y="311">否</text>
    <rect x="48" y="332" width="137" height="113" rx="5" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)" /><text x="116" y="360" text-anchor="middle">中止提交</text><text x="116" y="388" text-anchor="middle">手動修復</text><text x="116" y="417" text-anchor="middle">CRLF → LF</text>
    <rect x="211" y="332" width="117" height="68" rx="5" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)" /><text x="269" y="373" text-anchor="middle">允許提交</text>
    <text x="48" y="475" font-size="14">左側迴路：修復後重新檢查</text>
    <path d="M16 495H344" stroke="var(--diagram-line,#aebbad)" /><text x="16" y="523">CR 是回車，LF 是換行。</text><text x="16" y="551">自動檢查不等於自動修復。</text>
  </g>
</svg>
