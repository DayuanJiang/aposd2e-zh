<svg xmlns="http://www.w3.org/2000/svg" width="684" height="410" viewBox="0 0 684 410" role="img" aria-labelledby="fig-00015-title fig-00015-desc">
  <title id="fig-00015-title">Figure 7.1: Pass-through methods</title>
  <desc id="fig-00015-desc">Four panels preserve the original method-signature symbols and calls. In (a), C1 has a green square, blue star, yellow circle, and purple pentagon; the last three call identical methods in C2, which also has a red four-point star. In (b), callers access C2 directly. In (c), the five methods are divided between C1 and C2 without calls between the classes. In (d), all five methods belong to C1.</desc>
