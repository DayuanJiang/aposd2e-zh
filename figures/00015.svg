    <marker id="fig-00015-arrow" markerWidth="9" markerHeight="5" refX="8" refY="2.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 2.5 L0 5 L2 2.5 Z" fill="#111"/>
    </marker>
    <g id="fig-00015-square">
      <rect x="-5.5" y="-5.5" width="11" height="11" rx="2" fill="#e4f7d3" stroke="#111" stroke-width="1"/>
    </g>
    <g id="fig-00015-star">
      <path d="M0 -7 L2.1 -2.4 L7 -2 L3.4 1.5 L4.3 6.5 L0 4 L-4.3 6.5 L-3.4 1.5 L-7 -2 L-2.1 -2.4 Z" fill="#c5dcf7" stroke="#111" stroke-width="1"/>
    </g>
    <g id="fig-00015-circle">
      <circle r="6" fill="#ffffbe" stroke="#111" stroke-width="1"/>
    </g>
    <g id="fig-00015-pentagon">
      <path d="M0 -6.5 L6.2 -2 L3.8 5.5 L-3.8 5.5 L-6.2 -2 Z" fill="#a45cf2" stroke="#111" stroke-width="1"/>
    </g>
