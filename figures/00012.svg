<svg xmlns="http://www.w3.org/2000/svg" width="259" height="167" viewBox="-4 -4 259 167" role="img" aria-labelledby="figure-00012-title figure-00012-desc">
  <title id="figure-00012-title">Figure 4.1: Deep and shallow modules</title>
  <desc id="figure-00012-desc">A tall narrow Deep Module and a short wide Shallow Module have heavy black top edges. Two arrows from Interface (cost: less is better) point to those top edges. Two arrows from Functionality (benefit: more is better) point into the rectangles. The top-edge length represents interface complexity, while rectangle area represents functionality. The original relative geometry is preserved without adding a numeric scale.</desc>
  <defs>
    <marker id="figure-00012-arrow" viewBox="0 0 9 6" refX="9" refY="3" markerWidth="9" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L9 3L0 6L2.5 3Z" fill="#000"/>
    </marker>
  </defs>
  <rect x="-4" y="-4" width="259" height="167" fill="#fff"/>
  <g fill="#eee" stroke="#000" stroke-width="1">
    <rect x="13.5" y="51.5" width="46" height="92"/>
    <rect x="105.5" y="123.5" width="138" height="20"/>
  </g>
  <g fill="#000">
    <rect x="13" y="49" width="47" height="5"/>
    <rect x="105" y="121" width="139" height="5"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="0.8" marker-end="url(#figure-00012-arrow)">
    <path d="M91 25L49 48"/>
    <path d="M101 25L144.5 119"/>
    <path d="M169 61L45 93"/>
    <path d="M178.5 61V135"/>
  </g>
  <g fill="#000" font-family="Verdana, Geneva, sans-serif" font-size="11.4">
    <text x="96" y="9" text-anchor="middle">Interface (cost:<tspan x="96" dy="11.5">less is better)</tspan></text>
    <text x="124" y="42.5">Functionality (benefit:</text>
    <text x="145" y="57">more is better)</text>
    <text x="0" y="157">Deep Module</text>
    <text x="129" y="157">Shallow Module</text>
  </g>
</svg>
