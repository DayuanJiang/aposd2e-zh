<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 462" role="img" aria-labelledby="ch06-empty-selection-title ch06-empty-selection-desc">
  <title id="ch06-empty-selection-title">没有选区，也能走同一条路径</title>
  <desc id="ch06-empty-selection-desc">教学单行 ABCDE。统一规则为前缀 text[0:start] 拼接后缀 text[end:]。删除 [1,4) 得 A 加 E 为 AE；空选区 [2,2) 得 AB 加 CDE 为原文。合法空范围自然变为空操作，不需选区存在分支。</desc>
  <defs><marker id="ch06-empty-selection-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="680" height="462" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)" font-size="15">
    <text x="24" y="34" font-size="20" font-weight="600">没有选区，也能走同一条路径</text>
    <text x="24" y="61" font-size="14" fill="var(--diagram-muted,#5c645d)">教学演算：单行 ABCDE；位置是字符间隙，范围合法</text>
    <rect x="24" y="88" width="632" height="56" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/>
    <text x="40" y="122" font-family="ui-monospace,monospace">result = text[0:start] + text[end:]</text>
    <text x="24" y="187" font-weight="600">普通选区 [1, 4)</text><text x="374" y="187" font-weight="600">空选区 [2, 2)</text>
    <rect x="24" y="211" width="50" height="46" fill="var(--diagram-secondary-soft,#dce4ed)"/><rect x="74" y="211" width="150" height="46" fill="var(--diagram-danger-soft,#ead9dc)"/><rect x="224" y="211" width="50" height="46" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <g font-family="ui-monospace,monospace" font-size="21"><text x="42" y="241">A</text><text x="92" y="241">B</text><text x="142" y="241">C</text><text x="192" y="241">D</text><text x="242" y="241">E</text></g>
    <path d="M84 233H214" stroke="var(--diagram-danger,#a03946)" stroke-width="2"/>
    <rect x="374" y="211" width="100" height="46" fill="var(--diagram-secondary-soft,#dce4ed)"/><rect x="474" y="211" width="150" height="46" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <g font-family="ui-monospace,monospace" font-size="21"><text x="392" y="241">A</text><text x="442" y="241">B</text><text x="492" y="241">C</text><text x="542" y="241">D</text><text x="592" y="241">E</text></g>
    <path d="M474 203V265" stroke="var(--diagram-warm,#80531b)" stroke-width="3"/>
    <text x="78" y="284" font-size="14">中间 BCD 被删除</text><text x="418" y="284" font-size="14">起点 = 终点，没有中间字符</text>
    <g stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch06-empty-selection-arrow)"><path d="M149 296V324"/><path d="M499 296V324"/></g>
    <text x="44" y="354" font-family="ui-monospace,monospace" font-size="19">A + E = AE</text>
    <text x="385" y="354" font-family="ui-monospace,monospace" font-size="19">AB + CDE = ABCDE</text>
    <path d="M24 387H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="419" font-weight="600">统一表示后，普通规则自然覆盖“无可见选区”。</text>
    <text x="24" y="445" font-size="13" fill="var(--diagram-muted,#5c645d)">只消除“是否存在选区”分支，不表示可以省略所有范围校验。</text>
  </g>
</svg>
