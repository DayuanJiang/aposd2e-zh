<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" role="img" aria-labelledby="ch04-depth-m-title ch04-depth-m-desc">
  <title id="ch04-depth-m-title">接口小，隐藏的功能就少吗？</title>
  <desc id="ch04-depth-m-desc">上下对比浅方法和深模块。浅方法只包装一条赋值语句；Unix 文件接口隐藏路径、权限、调度、缓存和设备等实现问题。</desc>
  <defs><marker id="ch04-depth-m-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="360" height="720" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <text x="16" y="31" font-size="19" font-weight="600">接口小，隐藏的功能就少吗？</text>
    <text x="16" y="57" font-size="14" fill="var(--diagram-muted,#5c645d)">同时看接口成本与被隐藏的实现</text>
    <text x="16" y="99" font-size="17" font-weight="600">浅方法：包装一次赋值</text>
    <rect x="16" y="116" width="328" height="68" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)"/>
    <text x="34" y="143" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">addNullValueForAttribute</text>
    <text x="34" y="166" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">(attribute)</text>
    <path d="M180 192V215" stroke="var(--diagram-muted,#5c645d)" stroke-width="1.5" marker-end="url(#ch04-depth-m-arrow)"/>
    <text x="198" y="210" font-size="12" fill="var(--diagram-muted,#5c645d)">调用</text>
    <rect x="16" y="226" width="328" height="69" rx="4" fill="none" stroke="var(--diagram-line,#aebbad)"/>
    <text x="34" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">data.put(attribute, null)</text>
    <text x="34" y="278" font-size="14" fill="var(--diagram-muted,#5c645d)">接口几乎没有隐藏复杂性</text>
    <text x="16" y="338" font-size="17" font-weight="600">深模块：文件 I/O</text>
    <rect x="16" y="355" width="328" height="65" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/>
    <text x="34" y="382" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">open · read · write</text>
    <text x="34" y="405" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">lseek · close</text>
    <path d="M180 428V451" stroke="var(--diagram-muted,#5c645d)" stroke-width="1.5" marker-end="url(#ch04-depth-m-arrow)"/>
    <text x="198" y="446" font-size="12" fill="var(--diagram-muted,#5c645d)">调用</text>
    <rect x="16" y="462" width="328" height="144" rx="4" fill="none" stroke="var(--diagram-line,#aebbad)"/>
    <text x="34" y="490" font-size="16">路径解析　·　权限检查</text>
    <text x="34" y="517" font-size="16">并发调度　·　数据缓存</text>
    <text x="34" y="544" font-size="16">磁盘布局　·　不同存储设备</text>
    <text x="34" y="582" font-size="14" fill="var(--diagram-muted,#5c645d)">调用者不必了解这些实现细节</text>
    <path d="M16 634H344" stroke="var(--diagram-line,#aebbad)"/>
    <text x="16" y="662" font-size="16" font-weight="600">以较小的理解成本，获得较多功能。</text>
    <text x="16" y="690" font-size="12" fill="var(--diagram-muted,#5c645d)">概念示意，面积不代表代码行数或比例。</text>
  </g>
</svg>
