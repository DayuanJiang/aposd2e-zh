<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 441" role="img" aria-labelledby="ch16-single-source-title ch16-single-source-desc">
  <title id="ch16-single-source-title">副本漏改难察觉，引用失效可发现</title>
  <desc id="ch16-single-source-desc">规则变化需要传播到 A、B、C 三个说明副本，C 漏改却仍显示旧版。引用结构只维护一份说明，三个使用处指向它；若目标被移动，则引用显式找不到。占位名为教学示例。</desc>
  <defs><marker id="ch16-single-source-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="680" height="441" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" fill="var(--diagram-ink,#303630)">
    <text x="24" y="34" font-size="21" font-weight="600">说明复制与引用，失效方式不同</text>
    <text x="24" y="61" font-size="14">16.4 · 教学示例：A/B/C 是使用处，旧版/新版是规则版本</text>
    <path d="M340 85V365" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="106" font-weight="600">复制：每一份都要同步改</text>
    <text x="366" y="106" font-weight="600">引用：只维护一份说明</text>
    <rect x="80" y="127" width="186" height="45" rx="5" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)"/>
    <text x="173" y="156" text-anchor="middle">规则发生变化</text>
    <g fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch16-single-source-arrow)">
      <path d="M173 172V196H66V226"/><path d="M173 196V226"/><path d="M173 196H280V226" stroke-dasharray="5 4"/>
      <path d="M396 226V196H511V172"/><path d="M511 226V172"/><path d="M626 226V196H511"/>
    </g>
    <g fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"><rect x="24" y="226" width="86" height="66" rx="5"/><rect x="130" y="226" width="86" height="66" rx="5"/></g>
    <rect x="236" y="226" width="86" height="66" rx="5" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)"/>
    <text x="67" y="253" text-anchor="middle">A 新版</text><text x="67" y="279" text-anchor="middle" font-size="14">已更新</text>
    <text x="173" y="253" text-anchor="middle">B 新版</text><text x="173" y="279" text-anchor="middle" font-size="14">已更新</text>
    <text x="279" y="253" text-anchor="middle">C 旧版</text><text x="279" y="279" text-anchor="middle" font-size="14">漏改</text>
    <rect x="419" y="127" width="184" height="45" rx="5" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/>
    <text x="511" y="156" text-anchor="middle">唯一说明：新版</text>
    <text x="396" y="251" text-anchor="middle">A 引用</text><text x="511" y="251" text-anchor="middle">B 引用</text><text x="626" y="251" text-anchor="middle">C 引用</text>
    <text x="24" y="329" fill="var(--diagram-danger,#a03946)">危险：旧说明仍然看似可信</text>
    <text x="366" y="306">若主说明被移走：</text><text x="366" y="333" fill="var(--diagram-warm,#80531b)">引用找不到目标，失效可见</text>
    <path d="M24 382H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="412">引用不是不会坏，而是更容易发现坏在哪里。</text>
  </g>
</svg>
