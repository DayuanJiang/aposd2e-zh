<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 448" role="img" aria-labelledby="ch09-http-knowledge-t ch09-http-knowledge-d">
  <title id="ch09-http-knowledge-t">读取与解析共享了哪份知识？</title><desc id="ch09-http-knowledge-d">分开时读取类为判断请求结束也要理解HTTP格式，与解析类重复，另有传递请求字符串的接口。合并后格式知识集中，中间字符串不再跨接口。</desc>
  <defs><marker id="ch09-http-knowledge-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--diagram-muted,#58636b)"/></marker></defs>
  <rect width="680" height="448" fill="var(--diagram-bg,#f5f7f8)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" fill="var(--diagram-ink,#263239)">
    <text x="24" y="34" font-size="21" font-weight="600">读取与解析共享了哪份知识？</text>
    <text x="24" y="77" font-weight="600">分开：同一份格式知识出现在两处</text>
    <g fill="var(--diagram-warm-soft,#eae2cf)"><rect x="24" y="95" width="225" height="40" rx="4"/><rect x="431" y="95" width="225" height="40" rx="4"/></g>
    <text x="61" y="121">HTTP 格式知识</text><text x="468" y="121">HTTP 格式知识</text>
    <g fill="none" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch09-http-knowledge-a)"><path d="M136 136V159"/><path d="M543 136V159"/><path d="M249 199H423"/></g>
    <g fill="var(--diagram-secondary-soft,#dce4ed)"><rect x="24" y="163" width="225" height="70" rx="4"/><rect x="431" y="163" width="225" height="70" rx="4"/></g>
    <text x="43" y="188" font-weight="600">读取类</text><text x="43" y="214">必须判断请求在哪里结束</text><text x="450" y="188" font-weight="600">解析类</text><text x="450" y="214">提取请求的组成部分</text>
    <text x="280" y="183">请求字符串</text><text x="280" y="226" font-size="13" fill="var(--diagram-muted,#58636b)">跨类中间接口</text>
    <path d="M24 257H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="288" font-weight="600">合并：格式知识与处理放在同一处</text>
    <rect x="24" y="307" width="450" height="88" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)"/>
    <text x="44" y="334">读取 + 解析</text><text x="44" y="362" font-weight="600">HTTP 格式知识</text><text x="44" y="383" font-size="13">不再把原始请求字符串暴露为两个类间的接口</text>
    <path d="M475 350H519" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch09-http-knowledge-a)"/>
    <text x="536" y="355">解析结果</text>
    <text x="24" y="428" font-size="13" fill="var(--diagram-muted,#58636b)">知识与接口示意；不是某一版本 HTTP 的完整消息边界算法。</text>
  </g>
</svg>
