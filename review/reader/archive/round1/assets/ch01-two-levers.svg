<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" role="img" aria-labelledby="ch01-two-levers-title ch01-two-levers-desc">
  <title id="ch01-two-levers-title">消除规则，还是隔离规则？</title>
  <desc id="ch01-two-levers-desc">教学示例。统一表示相同含义的 size 和 length，消除命名区别；将识别格式和解码放入 load 模块，保留必要实现但不让调用者理解全部细节。两种手段可以同时使用。</desc>
  <defs><marker id="ch01-two-levers-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="680" height="480" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)" font-size="15">
    <text x="24" y="34" font-size="20" font-weight="600">消除规则，还是隔离规则？</text>
    <text x="24" y="61" font-size="14" fill="var(--diagram-muted,#5c645d)">教学示例：相同含义的命名，与必要的文件解码</text>
    <text x="24" y="103" font-weight="600">① 消除：规则本身变少</text>
    <rect x="24" y="121" width="244" height="72" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)"/>
    <text x="40" y="149" font-family="ui-monospace,monospace">size / length</text>
    <text x="40" y="175">同一含义，却要记两套名字</text>
    <path d="M280 157H386" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch01-two-levers-arrow)"/>
    <text x="304" y="144" font-size="14">统一</text>
    <rect x="400" y="121" width="256" height="72" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/>
    <text x="416" y="149" font-family="ui-monospace,monospace">length</text>
    <text x="416" y="175">不再需要那条命名区别</text>
    <path d="M24 222H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="252" font-weight="600">② 封装：规则仍在，但改变谁需要知道</text>
    <rect x="24" y="274" width="180" height="80" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)"/>
    <text x="40" y="304">调用者只需</text><text x="40" y="332" font-family="ui-monospace,monospace">load(file)</text>
    <path d="M216 314H330" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch01-two-levers-arrow)"/>
    <text x="239" y="300" font-size="14">调用</text>
    <rect x="344" y="271" width="312" height="119" rx="4" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="1.5"/>
    <text x="362" y="300" font-weight="600">文件模块内部</text>
    <path d="M344 313H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="362" y="340">识别格式 → 解码 → 返回内容</text>
    <text x="362" y="367" font-size="14" fill="var(--diagram-muted,#5c645d)">必要规则没有消失，只是不外露</text>
    <text x="24" y="439" font-weight="600">先去掉无谓区别，再把必要细节放在合适边界内。</text>
    <text x="24" y="464" font-size="13" fill="var(--diagram-muted,#5c645d)">概念示意；不表示封装可以让模块之间完全没有依赖。</text>
  </g>
</svg>
