<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 792" role="img" aria-labelledby="ch07-context-instances-m-title ch07-context-instances-m-desc">
  <title id="ch07-context-instances-m-title">不透传之后，两实例会串值吗？</title>
  <desc id="ch07-context-instances-m-desc">教学例子先展示进程共享 globalCert，被 A 和 B 先后写入会覆盖；再分别展示 Context A 到网络对象 A，以及 Context B 到网络对象 B 的构造引用。Context 不消除隐藏依赖，也不自动保证线程安全。</desc>
  <defs><marker id="ch07-context-instances-m-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="360" height="792" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)" font-size="15">
    <text x="16" y="32" font-size="19" font-weight="600">不透传之后，两实例会串值吗？</text>
    <text x="16" y="59" font-size="14" fill="var(--diagram-muted,#5c645d)">教学示例：同一进程，两个系统实例</text>
    <text x="16" y="100" font-weight="600">进程全局：只有一个位置</text>
    <text x="16" y="131">A 写 cert-A → B 再写 cert-B</text>
    <path d="M180 143V170" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch07-context-instances-m-arrow)"/>
    <rect x="16" y="183" width="328" height="78" rx="4" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)"/>
    <text x="32" y="213" font-family="ui-monospace,monospace">globalCert = cert-B</text><text x="32" y="242">后写覆盖先写，A 也可能读到 B</text>
    <path d="M16 285H344" stroke="var(--diagram-line,#aebbad)"/>
    <text x="16" y="317" font-weight="600">每实例 Context：各自保存配置</text>
    <rect x="16" y="337" width="328" height="65" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/>
    <text x="32" y="364" font-weight="600">Context A</text><text x="32" y="389" font-family="ui-monospace,monospace">cert = cert-A</text>
    <path d="M64 410V443" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch07-context-instances-m-arrow)"/>
    <text x="84" y="431" font-size="14">构造时传引用</text>
    <text x="32" y="474">网络对象 A 只读取 Context A</text>
    <rect x="16" y="503" width="328" height="65" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)"/>
    <text x="32" y="530" font-weight="600">Context B</text><text x="32" y="555" font-family="ui-monospace,monospace">cert = cert-B</text>
    <path d="M64 576V609" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch07-context-instances-m-arrow)"/>
    <text x="84" y="597" font-size="14">构造时传引用</text>
    <text x="32" y="640">网络对象 B 只读取 Context B</text>
    <text x="16" y="680" font-weight="600">无需日常透传，不等于没有依赖。</text>
    <text x="16" y="712" font-size="14" fill="var(--diagram-muted,#5c645d)">仍须管理字段用途与共享可变状态。</text>
    <text x="16" y="739" font-size="14" fill="var(--diagram-muted,#5c645d)">不可变配置可减轻风险。</text>
    <text x="16" y="770" font-size="12" fill="var(--diagram-muted,#5c645d)">只读取是本例用法，并非所有 Context 的保证。</text>
  </g>
</svg>
