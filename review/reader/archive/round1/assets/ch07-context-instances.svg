<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 528" role="img" aria-labelledby="ch07-context-instances-title ch07-context-instances-desc">
  <title id="ch07-context-instances-title">不透传之后，两实例会串值吗？</title>
  <desc id="ch07-context-instances-desc">教学场景中两个系统实例在同一进程内使用不同证书。globalCert 是同一个位置，B 写入可覆盖 A。每实例 Context 各自存证书，构造时给网络对象保存引用，日常方法不必透传 cert。隐藏依赖和共享可变状态风险仍需管理。</desc>
  <defs><marker id="ch07-context-instances-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="680" height="528" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)" font-size="15">
    <text x="24" y="34" font-size="20" font-weight="600">不透传之后，两实例会串值吗？</text>
    <text x="24" y="61" font-size="14" fill="var(--diagram-muted,#5c645d)">教学示例：同一进程，A 需要 cert-A，B 需要 cert-B</text>
    <text x="24" y="104" font-weight="600">进程全局：只有一个存储位置</text>
    <text x="24" y="157">A 写 cert-A</text><text x="548" y="157">B 写 cert-B</text>
    <rect x="218" y="127" width="244" height="64" rx="4" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)"/>
    <text x="238" y="154" font-family="ui-monospace,monospace">globalCert</text><text x="238" y="180" font-size="14">后写覆盖先写，A 可能读到 B</text>
    <g stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch07-context-instances-arrow)"><path d="M125 154H207"/><path d="M538 154H473"/></g>
    <path d="M24 220H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="252" font-weight="600">每实例 Context：各自保存配置</text>
    <rect x="24" y="270" width="296" height="70" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/>
    <rect x="360" y="270" width="296" height="70" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)"/>
    <text x="40" y="298" font-weight="600">Context A</text><text x="40" y="326" font-family="ui-monospace,monospace">cert = cert-A</text>
    <text x="376" y="298" font-weight="600">Context B</text><text x="376" y="326" font-family="ui-monospace,monospace">cert = cert-B</text>
    <g stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch07-context-instances-arrow)"><path d="M172 350V392"/><path d="M508 350V392"/></g>
    <text x="187" y="376" font-size="13">构造时传引用</text><text x="523" y="376" font-size="13">构造时传引用</text>
    <text x="48" y="421">网络对象 A → 只读 Context A</text><text x="384" y="421">网络对象 B → 只读 Context B</text>
    <text x="24" y="465" font-weight="600">日常调用不用层层带 cert，但依赖并未消失。</text>
    <text x="24" y="495" font-size="14" fill="var(--diagram-muted,#5c645d)">仍需管理字段用途与使用范围；不可变配置可减轻共享可变状态风险。</text>
    <text x="24" y="518" font-size="12" fill="var(--diagram-muted,#5c645d)">此处“只读”描述教学对象的使用方式，不是声称所有 Context 都不可变。</text>
  </g>
</svg>
