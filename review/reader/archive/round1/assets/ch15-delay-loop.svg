<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="ch15-delay-loop-title ch15-delay-loop-desc">
  <title id="ch15-delay-loop-title">为什么越等越难补注释？</title>
  <desc id="ch15-delay-loop-desc">推迟使未记录代码积压，补写任务变大，转做下一项工作又使推迟持续。另一条支路是设计记忆模糊，后来补写只能重复代码并遗漏理由。箭头表示定性因果。</desc>
  <defs><marker id="ch15-delay-loop-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="680" height="400" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" fill="var(--diagram-ink,#303630)">
    <text x="24" y="34" font-size="21" font-weight="600">等待代码稳定，可能让补写更难</text>
    <text x="24" y="61" font-size="14" fill="var(--diagram-muted,#5c645d)">15.1 · 闭环是积压机制；旁支是信息损失</text>
    <g fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch15-delay-loop-arrow)">
      <path d="M194 116H258"/><path d="M350 150V215"/><path d="M258 247H194"/><path d="M102 215V150"/>
      <path d="M109 84V74H468V154" stroke-dasharray="5 4"/><path d="M551 218V258"/>
    </g>
    <rect x="24" y="84" width="170" height="66" rx="5" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)"/>
    <text x="109" y="123" text-anchor="middle">推迟写注释</text>
    <rect x="258" y="84" width="170" height="66" rx="5" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)"/>
    <text x="343" y="111" text-anchor="middle">未记录的代码</text><text x="343" y="135" text-anchor="middle">继续增加</text>
    <rect x="258" y="215" width="170" height="66" rx="5" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)"/>
    <text x="343" y="242" text-anchor="middle">补写任务变大</text><text x="343" y="266" text-anchor="middle">更不愿着手</text>
    <rect x="24" y="215" width="170" height="66" rx="5" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)"/>
    <text x="109" y="242" text-anchor="middle">先做下一项工作</text><text x="109" y="266" text-anchor="middle">继续往后拖</text>
    <text x="214" y="188" text-anchor="middle" font-size="14">越积越难补</text>
    <rect x="458" y="154" width="198" height="64" rx="5" fill="var(--diagram-secondary-soft,#dce4ed)" stroke="var(--diagram-secondary,#2c6096)"/>
    <text x="557" y="192" text-anchor="middle">设计记忆逐渐模糊</text>
    <text x="470" y="283">后来对照代码补写</text><text x="470" y="309" fill="var(--diagram-danger,#a03946)">易重复代码、漏掉理由</text>
    <path d="M24 343H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="371">即使最终补写，代码也未必能还原当时的设计思路。</text>
  </g>
</svg>
