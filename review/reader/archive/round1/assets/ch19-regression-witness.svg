<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 373" role="img" aria-labelledby="ch19-regression-witness-title ch19-regression-witness-desc">
  <title id="ch19-regression-witness-title">测试先失败，才留下触发缺陷的证据</title>
  <desc id="ch19-regression-witness-desc">上路在缺陷版运行测试失败，再修复并让同一测试通过。下路先修再写测试并通过，缺失旧版失败证据，无法知道是否真正触发原缺陷。通过测试不保证设计好或无其他缺陷。</desc>
  <defs><marker id="ch19-regression-witness-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="680" height="373" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="16" fill="var(--diagram-ink,#303630)">
    <text x="24" y="34" font-size="21" font-weight="600">测试通过之前，先证明它会失败</text><text x="24" y="61" font-size="14">19.4 · 修复缺陷时，作者明确赞成先写测试</text>
    <rect x="24" y="89" width="220" height="71" rx="5" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)"/><text x="134" y="118" text-anchor="middle">缺陷版本 + 测试</text><text x="134" y="144" text-anchor="middle">因该缺陷失败</text>
    <text x="331" y="130" text-anchor="middle">修复</text>
    <rect x="417" y="89" width="239" height="71" rx="5" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/><text x="536" y="118" text-anchor="middle">修复版本 + 同一测试</text><text x="536" y="144" text-anchor="middle">通过</text>
    <g stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch19-regression-witness-arrow)"><path d="M244 124H293"/><path d="M366 124H417"/></g>
    <path d="M24 181V190H656V181" fill="none" stroke="var(--diagram-primary,#0b6f5d)" stroke-width="2"/><text x="340" y="213" text-anchor="middle" font-size="14">同一测试的前后结果：留下触发与修复的证据</text>
    <text x="24" y="263" fill="var(--diagram-warm,#80531b)">反例：先修复</text><path d="M139 257H191" stroke="var(--diagram-muted,#5c645d)" stroke-width="2" marker-end="url(#ch19-regression-witness-arrow)"/>
    <text x="203" y="263">后写测试，通过</text><text x="420" y="263" fill="var(--diagram-danger,#a03946)">缺少旧版失败证据</text>
    <path d="M24 291H656" stroke="var(--diagram-line,#aebbad)"/><text x="24" y="321">立即通过的测试，可能从未触发原缺陷。</text><text x="24" y="350" font-size="14">测试支持重构；通过测试不等于设计优良，也不保证没有其他缺陷。</text>
  </g>
</svg>
