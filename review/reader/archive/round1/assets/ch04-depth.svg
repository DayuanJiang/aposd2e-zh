<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" role="img" aria-labelledby="ch04-depth-title ch04-depth-desc">
  <title id="ch04-depth-title">接口小，隐藏的功能就少吗？</title>
  <desc id="ch04-depth-desc">左侧浅方法只是包装一次赋值，接口几乎和实现一样复杂。右侧 Unix 文件接口用五个基本调用隐藏路径、权限、调度、缓存和设备细节。框的大小仅作概念示意。</desc>
  <defs><marker id="ch04-depth-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L6 3L0 6Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="680" height="460" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)">
    <text x="24" y="35" font-size="20" font-weight="600">接口小，隐藏的功能就少吗？</text>
    <text x="24" y="62" font-size="14" fill="var(--diagram-muted,#5c645d)">把“需要了解的接口”与“被隐藏的实现”放在一起看</text>
    <text x="24" y="107" font-size="17" font-weight="600">浅方法：包装一次赋值</text>
    <text x="360" y="107" font-size="17" font-weight="600">深模块：文件 I/O</text>
    <rect x="24" y="126" width="294" height="65" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)"/>
    <rect x="360" y="126" width="296" height="65" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">
      <text x="40" y="152">addNullValueForAttribute</text>
      <text x="40" y="176">(attribute)</text>
      <text x="380" y="152">open · read · write</text>
      <text x="380" y="176">lseek · close</text>
    </g>
    <g stroke="var(--diagram-muted,#5c645d)" stroke-width="1.5" marker-end="url(#ch04-depth-arrow)">
      <path d="M171 199V226"/><path d="M508 199V226"/>
    </g>
    <text x="188" y="219" font-size="12" fill="var(--diagram-muted,#5c645d)">调用</text>
    <text x="525" y="219" font-size="12" fill="var(--diagram-muted,#5c645d)">调用</text>
    <rect x="24" y="238" width="294" height="69" rx="4" fill="none" stroke="var(--diagram-line,#aebbad)"/>
    <text x="40" y="267" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">data.put(attribute, null)</text>
    <text x="40" y="290" font-size="13" fill="var(--diagram-muted,#5c645d)">接口几乎没有隐藏复杂性</text>
    <rect x="360" y="238" width="296" height="140" rx="4" fill="none" stroke="var(--diagram-line,#aebbad)"/>
    <text x="380" y="265" font-size="15">路径解析　·　权限检查</text>
    <text x="380" y="292" font-size="15">并发调度　·　数据缓存</text>
    <text x="380" y="319" font-size="15">磁盘布局　·　不同存储设备</text>
    <text x="380" y="355" font-size="13" fill="var(--diagram-muted,#5c645d)">调用者不必了解这些实现细节</text>
    <path d="M24 402H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="429" font-size="15" font-weight="600">深度来自：以较小的理解成本，获得较多功能。</text>
    <text x="24" y="451" font-size="12" fill="var(--diagram-muted,#5c645d)">不同功能的示例对比；面积不代表代码行数或精确比例。</text>
  </g>
</svg>
