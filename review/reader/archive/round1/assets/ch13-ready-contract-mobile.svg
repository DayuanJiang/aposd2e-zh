<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 646" role="img" aria-labelledby="ch13-ready-contract-m-t ch13-ready-contract-m-d">
  <title id="ch13-ready-contract-m-t">ready 不等于一定有对象</title><desc id="ch13-ready-contract-m-d">三个分支：有对象则true且getNext返回对象；已结束也为true但返回NULL；false时getNext可能阻塞。直接或通过getNext调用isReady推动查询。</desc>
  <defs><marker id="ch13-ready-contract-m-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--diagram-muted,#58636b)"/></marker></defs>
  <rect width="360" height="646" fill="var(--diagram-bg,#f5f7f8)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="15" fill="var(--diagram-ink,#263239)">
    <text x="20" y="32" font-size="18" font-weight="600">ready 不等于一定有对象</text><text x="20" y="65" font-size="14">isReady 的返回值描述下一次 getNext。</text>
    <rect x="20" y="88" width="320" height="91" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)"/><text x="38" y="117" font-weight="600">至少一个对象可返回</text>
    <text x="38" y="153" font-family="monospace">true</text><path d="M86 148H128" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch13-ready-contract-m-a)"/><text x="143" y="153">不阻塞，返回对象</text>
    <rect x="20" y="204" width="320" height="91" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)"/><text x="38" y="233" font-weight="600">查询已经结束</text>
    <text x="38" y="269" font-family="monospace">true</text><path d="M86 264H128" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch13-ready-contract-m-a)"/><text x="143" y="269">不阻塞，返回 NULL</text>
    <rect x="20" y="320" width="320" height="91" rx="4" fill="var(--diagram-warm-soft,#eae2cf)"/><text x="38" y="349" font-weight="600">尚未保证可立即返回</text>
    <text x="38" y="385" font-family="monospace">false</text><path d="M90 380H128" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch13-ready-contract-m-a)"/><text x="143" y="385">可能阻塞，非必然</text>
    <path d="M20 437H340" stroke="var(--diagram-line,#aebbad)"/><text x="20" y="469" font-weight="600">另一项义务：调用才能推进查询</text>
    <text x="20" y="501">直接调用 isReady，或通过 getNext</text><path d="M180 514V538" stroke="var(--diagram-muted,#58636b)" stroke-width="1.5" marker-end="url(#ch13-ready-contract-m-a)"/>
    <rect x="20" y="545" width="320" height="43" rx="4" fill="var(--diagram-secondary-soft,#dce4ed)"/><text x="72" y="573">执行 isReady，推动查询</text>
    <text x="20" y="622" font-size="13" fill="var(--diagram-muted,#58636b)">展开可观察契约，不展示内部规则调度算法。</text>
  </g>
</svg>
