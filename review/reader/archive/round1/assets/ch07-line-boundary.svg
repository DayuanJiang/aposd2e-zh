<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 498" role="img" aria-labelledby="ch07-line-boundary-title ch07-line-boundary-desc">
  <title id="ch07-line-boundary-title">按行存储，不必按行暴露</title>
  <desc id="ch07-line-boundary-desc">教学跨行删除：第一行 ABcd，第二行 efGH，删除 cd、换行和 ef 得 ABGH。按行 API 使 UI 自己取行、拼接并替换；字符范围 API 把这些步骤隐藏在文本类内，内部仍可按行存储。</desc>
  <defs><marker id="ch07-line-boundary-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="680" height="498" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="var(--diagram-ink,#303630)" font-size="15">
    <text x="24" y="34" font-size="20" font-weight="600">按行存储，不必按行暴露</text>
    <text x="24" y="61" font-size="14" fill="var(--diagram-muted,#5c645d)">教学示例：删除第一行后缀、换行和第二行前缀</text>
    <text x="24" y="111">原文两行</text><text x="142" y="110" font-family="ui-monospace,monospace" font-size="21">AB<tspan fill="var(--diagram-danger,#a03946)">cd</tspan></text>
    <text x="142" y="143" font-family="ui-monospace,monospace" font-size="21"><tspan fill="var(--diagram-danger,#a03946)">ef</tspan>GH</text>
    <path d="M176 117H226V128H135" fill="none" stroke="var(--diagram-danger,#a03946)" stroke-dasharray="4 3"/>
    <path d="M252 121H404" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch07-line-boundary-arrow)"/>
    <text x="279" y="109" font-size="14">删除并拼接</text><text x="438" y="128" font-family="ui-monospace,monospace" font-size="24">ABGH</text>
    <path d="M24 171H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="205" font-weight="600">行接口：UI 承担存储细节</text><text x="360" y="205" font-weight="600">范围接口：文本类承担细节</text>
    <rect x="24" y="226" width="296" height="134" rx="4" fill="var(--diagram-warm-soft,#eae2cf)" stroke="var(--diagram-warm,#80531b)"/>
    <text x="40" y="256" font-weight="600">每个 UI 调用点</text><text x="40" y="285">取两行 → 保留 AB 与 GH</text><text x="40" y="314">拼接 → 替换两行</text><text x="40" y="341" font-size="14">同类操作可能到处重复</text>
    <text x="378" y="254" font-family="ui-monospace,monospace">delete(start, end)</text>
    <path d="M508 265V292" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch07-line-boundary-arrow)"/>
    <rect x="360" y="305" width="296" height="101" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/>
    <text x="376" y="335" font-weight="600">文本类内部仍按行存储</text><text x="376" y="365">保留片段 → 拼接 → 替换</text><text x="376" y="392" font-size="14">UI 无需知道行如何被拆分和合并</text>
    <text x="24" y="397" font-size="14">getLine / putLine 暴露存储单位</text>
    <text x="24" y="451" font-weight="600">价值就在差异里：接口的“字符范围”不等于内部的“行”。</text>
    <text x="24" y="479" font-size="13" fill="var(--diagram-muted,#5c645d)">字符串和位置为教学示例，步骤只说明职责，不是完整编辑算法。</text>
  </g>
</svg>
