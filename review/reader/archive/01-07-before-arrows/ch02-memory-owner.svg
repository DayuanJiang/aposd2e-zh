<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" role="img" aria-labelledby="ch02-memory-owner-title ch02-memory-owner-desc">
  <title id="ch02-memory-owner-title">谁必须知道何时释放内存？</title>
  <desc id="ch02-memory-owner-desc">固定的模块和调用者泳道中，时间从上到下。两方案均由模块分配、调用者使用，差别仅是释放责任位于调用者还是模块。只有能安全重组生命周期时才可采用后者；箭头不是 API 调用或所有权移交协议。</desc>
  <defs><marker id="ch02-memory-owner-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="680" height="436" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="var(--diagram-ink,#303630)">
    <text x="24" y="34" font-size="20" font-weight="600">谁必须知道何时释放内存？</text>
    <text x="24" y="61" font-size="14" fill="var(--diagram-muted,#5c645d)">责任泳道：向下是时间先后，不是 API 调用或所有权转移</text>
    <text x="24" y="100" font-weight="600">原设计</text><text x="360" y="100" font-weight="600">若能安全重组生命周期</text>
    <g fill="var(--diagram-secondary-soft,#dce4ed)"><rect x="100" y="136" width="92" height="181"/><rect x="436" y="136" width="92" height="181"/></g>
    <g fill="var(--diagram-warm-soft,#eae2cf)"><rect x="212" y="136" width="104" height="181"/><rect x="548" y="136" width="104" height="181"/></g>
    <text x="130" y="125">模块</text><text x="242" y="125">调用者</text><text x="466" y="125">模块</text><text x="578" y="125">调用者</text>
    <g font-size="14"><text x="48" y="169">1</text><text x="48" y="229">2</text><text x="48" y="289">3</text><text x="384" y="169">1</text><text x="384" y="229">2</text><text x="384" y="289">3</text></g>
    <path d="M31 145V308M367 145V308" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch02-memory-owner-arrow)"/>
    <text x="130" y="169">分配</text><text x="246" y="229">使用</text><text x="466" y="169">分配</text><text x="582" y="229">使用</text>
    <rect x="224" y="263" width="80" height="39" rx="4" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)"/><text x="249" y="288">释放</text>
    <rect x="442" y="263" width="80" height="39" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/><text x="467" y="288">释放</text>
    <text x="24" y="347">调用者须掌握释放义务与时机。</text><text x="360" y="347">这部分义务不再由调用者承担。</text>
    <path d="M24 365H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="396" font-weight="600">移动释放责任不等于证明生命周期安全。</text>
    <text x="24" y="421" font-size="13" fill="var(--diagram-muted,#5c645d)">安全结束使用的协议未指定；这是原书提出的一种条件性重组，不是唯一办法。</text>
  </g>
</svg>
