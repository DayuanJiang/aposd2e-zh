<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 578" role="img" aria-labelledby="ch05-format-ownership-title ch05-format-ownership-desc">
  <title id="ch05-format-ownership-title">运行顺序不等于模块边界</title>
  <desc id="ch05-format-ownership-desc">教学记号 K 代表文件格式知识。两方案的应用阶段均为 1 读、2 修改、3 写。实线为阶段到实现的调用，虚线为格式变化要求修改的实现。分离读写实现时 K 改动影响两者；共用格式实现时同一变化只影响共用模块，应用阶段不变。</desc>
  <defs><marker id="ch05-format-ownership-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="var(--diagram-muted,#5c645d)"/></marker></defs>
  <rect width="680" height="578" fill="var(--diagram-bg,#e7eae6)"/>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="var(--diagram-ink,#303630)">
    <text x="24" y="34" font-size="20" font-weight="600">运行顺序不等于模块边界</text>
    <text x="24" y="61" font-size="14" fill="var(--diagram-muted,#5c645d)">教学记号 K：文件格式知识；编号表先后，实线表调用，虚线表必需修改</text>
    <text x="24" y="98" font-weight="600">分离读写实现：同一格式变更有两个目标</text>
    <text x="58" y="131">1　读取阶段</text><text x="280" y="131">2　修改内容</text><text x="512" y="131">3　写入阶段</text>
    <path d="M114 143V177M569 143V177" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch05-format-ownership-arrow)"/>
    <text x="130" y="164" font-size="13">调用</text><text x="585" y="164" font-size="13">调用</text>
    <rect x="24" y="189" width="212" height="91" rx="4" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)"/>
    <text x="42" y="219" font-weight="600">读实现</text><text x="42" y="251">K：如何解释文件格式</text>
    <rect x="444" y="189" width="212" height="91" rx="4" fill="var(--diagram-danger-soft,#ead9dc)" stroke="var(--diagram-danger,#a03946)"/>
    <text x="462" y="219" font-weight="600">写实现</text><text x="462" y="251">K：如何生成文件格式</text>
    <text x="282" y="217" font-weight="600">格式变更 K</text>
    <g fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-dasharray="5 4" marker-end="url(#ch05-format-ownership-arrow)"><path d="M328 229V246H247"/><path d="M350 229V246H433"/></g>
    <path d="M24 304H656" stroke="var(--diagram-line,#aebbad)"/>
    <text x="24" y="336" font-weight="600">共用格式实现：相同格式变更只有一个目标</text>
    <text x="58" y="370">1　读取阶段</text><text x="280" y="370">2　修改内容</text><text x="512" y="370">3　写入阶段</text>
    <text x="265" y="395" font-size="13">应用阶段与顺序均不变</text>
    <g fill="none" stroke="var(--diagram-muted,#5c645d)" marker-end="url(#ch05-format-ownership-arrow)"><path d="M114 383V451H230"/><path d="M569 383V451H450"/></g>
    <text x="136" y="437" font-size="13">调用</text><text x="505" y="437" font-size="13">调用</text>
    <rect x="241" y="414" width="198" height="88" rx="4" fill="var(--diagram-primary-soft,#d6e5dc)" stroke="var(--diagram-primary,#0b6f5d)"/>
    <text x="257" y="443" font-weight="600">共用格式实现</text><text x="257" y="473">K：读写格式规则</text>
    <text x="24" y="521" font-weight="600">格式变更 K</text>
    <path d="M123 516H340V510" fill="none" stroke="var(--diagram-muted,#5c645d)" stroke-dasharray="5 4" marker-end="url(#ch05-format-ownership-arrow)"/>
    <text x="24" y="557" font-size="14">前提：接口确实隐藏 K；不是要求合并所有阶段或公开格式细节。</text>
  </g>
</svg>
